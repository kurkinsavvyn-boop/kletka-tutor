<!doctype html><meta charset="utf-8"><title>Клетка — перенос досок</title>
<script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
<body style="font:14px sans-serif">Клетка: перенос доски (только чтение)
<script>
// Только чтение доски: порядок слоёв и картинки так, как они показаны (с обрезкой).
// Данные уходят на приёмник на этом компьютере (sink); доска не меняется.
const note=m=>parent.postMessage(Object.assign({kletka:1},m),'*');
let started=false,sink='';
const post=(path,obj)=>fetch(sink+path,{method:'POST',headers:{'Content-Type':'text/plain'},body:typeof obj==='string'?obj:JSON.stringify(obj)});
const log=s=>{note({t:'log',s});post('/log',s).catch(()=>{})};
addEventListener('message',async e=>{const d=e.data;if(!d||!d.kletkaStart||started)return;started=true;sink=d.sink;
  try{await post('/log','связь есть');note({t:'log',s:'sink ok'})}catch(err){note({t:'log',s:'sink ERR '+err.message});started=false;return}
  run(d.only).catch(err=>log('ERR '+err.message))});
async function run(only){
  const info=await miro.board.getInfo();const bid=info.id;
  const st=await (await fetch(sink+'/status?board='+encodeURIComponent(bid))).json();
  if(st.done){log('уже готово '+bid);return}
  const items=await miro.board.get();log(bid+': объектов '+items.length);
  const layers={};
  for(const it of items){try{layers[it.id]=await miro.board.getLayerIndex(it)}catch(e){}}
  await post('/layers',{board:bid,layers});log('слои записаны');
  let imgs=items.filter(i=>i.type==='image');if(only)imgs=imgs.slice(0,only);let n=0;
  for(const im of imgs){n++;if(st.have.includes(im.id))continue;
    try{await post('/img',{board:bid,id:im.id,data:await im.getDataUrl()})}catch(e){log('ошибка '+im.id+' '+e.message)}
    if(n%20==0)log('картинки '+n+' из '+imgs.length)}
  if(!only)await post('/done',{board:bid});log('готово '+bid);
}
note({t:'ready'});
</script>
