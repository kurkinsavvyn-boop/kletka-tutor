<!doctype html><meta charset="utf-8"><title>Клетка — перенос досок</title>
<script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
<body style="font:14px sans-serif">Клетка: перенос доски (только чтение)
<script>
// Временный помощник переноса: только читает доску и отвечает сообщением странице доски.
// Ничего на доске не создаёт и не меняет.
const note=m=>parent.postMessage(Object.assign({kletka:1},m),'*');
const dims=src=>new Promise(r=>{const i=new Image();i.onload=()=>r([i.naturalWidth,i.naturalHeight]);i.onerror=()=>r(null);i.src=src});
const OPS={
  // порядок слоёв всех объектов
  async layers(){const items=await miro.board.get();const out={};
    for(const it of items){try{out[it.id]=await miro.board.getLayerIndex(it)}catch(e){}}return out},
  // размеры картинок: на доске, показанная (preview) и исходная (original)
  async probe({from=0,count=5}){const imgs=(await miro.board.get({type:'image'})).slice(from,from+count);const out=[];
    for(const im of imgs){const p=await im.getDataUrl('preview').catch(()=>null),o=await im.getDataUrl('original').catch(()=>null);
      out.push({id:im.id,w:im.width,h:im.height,url:im.url,pv:p&&await dims(p),pvLen:p&&p.length,or:o&&await dims(o)})}
    return out}
};
addEventListener('message',async e=>{const d=e.data;if(!d||!d.kletkaOp||e.origin!=='https://miro.com'||!OPS[d.kletkaOp])return;
  try{note({t:'res',id:d.id,v:await OPS[d.kletkaOp](d.args||{})})}catch(err){note({t:'res',id:d.id,err:err.message})}});
note({t:'ready'});
</script>
