<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Клетка для репетитора</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: тетрадь в клетку. Рабочие панели лежат на сетке, красная ручка учителя — только для ошибок, ключа и «сейчас проходим». */
:root{
  --paper:#F7F9FC; --grid:#E3EAF4; --card:#FFFFFF; --line:#D5DDEA;
  --ink:#1F2C55; --ink-2:#5B6888; --ink-3:#66718D;
  --pen:#D5402F; --pen-soft:#FBE6E2;
  --ink-soft:#E6ECF8;
  --ok:#2C8A57; --ok-soft:#E1F2E8; --warn:#C98A12; --warn-soft:#FBF0D9; --bad:#D5402F; --bad-soft:#FBE6E2; --none:#B4BDD0;
  --sheet:#FFFFFF; --sheet-ink:#1A1F2E; --sheet-line:#C9D2E2; --sheet-pen:#D5402F;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-disp:"Unbounded", "Golos Text", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151F; --grid:#1A2130; --card:#171D2A; --line:#283247;
  --ink:#E4E9F5; --ink-2:#A3AECA; --ink-3:#8E9AB6;
  --pen:#FF7863; --pen-soft:#3A1F1D; --ink-soft:#222B40;
  --ok:#5CC98C; --ok-soft:#173326; --warn:#E8B04A; --warn-soft:#33290F; --bad:#FF7863; --bad-soft:#3A1F1D; --none:#4A5470;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151F; --grid:#1A2130; --card:#171D2A; --line:#283247;
  --ink:#E4E9F5; --ink-2:#A3AECA; --ink-3:#8E9AB6;
  --pen:#FF7863; --pen-soft:#3A1F1D; --ink-soft:#222B40;
  --ok:#5CC98C; --ok-soft:#173326; --warn:#E8B04A; --warn-soft:#33290F; --bad:#FF7863; --bad-soft:#3A1F1D; --none:#4A5470;
  color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-disp);font-weight:700;font-size:18px;letter-spacing:-.01em;background:none;border:0;padding:0}
.logo i{width:18px;height:18px;border:2px solid var(--ink);display:grid;grid-template:1fr 1fr/1fr 1fr;border-radius:3px;overflow:hidden}
.logo i b{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.logo i b:nth-child(4){background:var(--pen)}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:14px;flex-wrap:wrap;min-width:0}
.crumbs button{background:none;border:0;padding:4px 6px;border-radius:6px;color:var(--ink-2)}
.crumbs button:hover{background:var(--ink-soft);color:var(--ink)}
.crumbs .cur{color:var(--ink);font-weight:600;padding:4px 6px}
.steps{margin-left:auto;display:flex;gap:4px;font-size:12px;color:var(--ink-3)}
.steps span{padding:3px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.steps span.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.steps span.done{background:var(--ink);border-color:var(--ink);color:var(--card)}

.wrap{max-width:1180px;margin:0 auto;padding-block:28px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-family:var(--f-disp);font-weight:600;font-size:clamp(22px,3vw,30px);letter-spacing:-.015em}
.head p{margin:4px 0 0;color:var(--ink-2)}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);padding:10px 16px;font-weight:600;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);min-height:42px}
.btn:hover{background:var(--ink-soft)}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.primary:hover{filter:brightness(1.15);background:var(--ink)}
.btn.pen{border-color:var(--pen);color:var(--pen)}
.btn.small{padding:6px 11px;min-height:34px;font-size:14px}
.btn.quiet{border-color:var(--line)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px}

/* Ученики */
.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.st{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,transform .15s}
.st:hover{border-color:var(--ink);transform:translateY(-1px)}
.st-top{display:flex;align-items:center;gap:12px}
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--ink-soft);color:var(--ink);flex:none}
.st h3{font-size:17px;font-weight:600}
.st .grade{color:var(--ink-2);font-size:14px}
.st-now{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.st-now .t{font-weight:500}
.st-now .t2{font-size:13.5px;color:var(--ink-2)}
.st-foot{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:99px;padding:3px 9px;background:var(--ink-soft);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.add-card{border:1.5px dashed var(--line);background:transparent;border-radius:14px;color:var(--ink-2);min-height:170px;display:grid;place-items:center;font-weight:600}
.add-card:hover{border-color:var(--ink);color:var(--ink)}

/* Ученик */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.tabs{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--ink-2)}
.tab.on{background:var(--ink-soft);color:var(--ink)}
.sec{padding:14px 18px 6px}
.sec h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.topic{width:100%;display:flex;align-items:center;gap:12px;padding:11px 10px;border:0;background:none;border-radius:9px;text-align:left}
.topic:hover{background:var(--ink-soft)}
.topic .tt{flex:1;min-width:0}
.topic .pct{font-size:13px;color:var(--ink-2)}
.topic[disabled]{cursor:default;opacity:.55}
.topic[disabled]:hover{background:none}
.dot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--none)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.now{font-size:11.5px;font-weight:700;color:var(--pen);border:1.5px solid var(--pen);border-radius:5px;padding:0 6px;margin-left:8px;white-space:nowrap;transform:rotate(-2deg);display:inline-block}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 18px 16px;color:var(--ink-2);font-size:13px;border-top:1px solid var(--line);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.locked{margin:12px 18px;padding:12px 14px;border-radius:10px;background:var(--ink-soft);color:var(--ink-2);font-size:14px}
.side{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.side h2{font-size:16px;font-weight:600}
.res{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.res-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.res .t{font-weight:500;font-size:14px}
.res .m{color:var(--ink-2);font-size:13px}
.res details{font-size:13px}
.res summary{cursor:pointer;color:var(--pen);font-weight:600}
.mist{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.mist div{display:flex;justify-content:space-between;gap:8px}
.mist s{color:var(--pen)}
.empty{color:var(--ink-3);font-size:14px}

/* Тема */
.topic-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:22px;align-items:start}
.levels{display:flex;flex-direction:column;gap:10px}
.lvl{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.lvl:hover{border-color:var(--ink-2)}
.lvl.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink-soft)}
.lvl-top{display:flex;align-items:center;gap:10px}
.lvl-mark{display:flex;gap:3px}
.lvl-mark i{width:8px;height:14px;border-radius:2px;background:var(--line)}
.lvl-mark i.f{background:var(--ink)}
.lvl b{font-size:15px}
.lvl .d{color:var(--ink-2);font-size:13.5px}
.lvl .ex{font-size:13.5px;color:var(--ink);background:var(--ink-soft);border-radius:6px;padding:3px 8px;align-self:flex-start}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.actions .btn{flex:1 1 auto}
.hint{font-size:13px;color:var(--ink-3)}
.tune{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.tune summary{cursor:pointer;font-weight:600;color:var(--ink-2);font-size:14px}
.tune-row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;font-size:14px}
.tune-row input{width:84px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}

/* Лист A4 */
.sheet-wrap{display:flex;flex-direction:column;gap:10px;min-width:0}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sheet{container-type:inline-size;background:var(--sheet);color:var(--sheet-ink);aspect-ratio:210/297;width:100%;max-width:100%;border-radius:4px;
  box-shadow:0 1px 2px rgba(20,30,60,.08),0 10px 30px rgba(20,30,60,.10);overflow:hidden;font-family:var(--f-ui)}
.sheet-in{padding:6cqw 7cqw;display:flex;flex-direction:column;gap:3.4cqw;height:100%}
.sh-head{display:grid;grid-template-columns:1fr auto;gap:1cqw 4cqw;font-size:2.3cqw;color:#4e5870}
.sh-head .fld{border-bottom:.25cqw solid var(--sheet-line);padding-bottom:.6cqw;min-width:22cqw}
.sh-head .fld b{color:var(--sheet-ink);font-weight:600}
.sh-title{font-family:var(--f-disp);font-weight:600;font-size:4cqw;letter-spacing:-.01em;line-height:1.2}
.sh-sub{font-size:2.3cqw;color:#4e5870;margin-top:-2cqw}
.sh-items{display:grid;gap:3.2cqw 4cqw;font-size:3.5cqw;font-variant-numeric:tabular-nums}
.sh-items.c3{grid-template-columns:repeat(3,1fr)}
.sh-items.c2{grid-template-columns:repeat(2,1fr)}
.sh-items.c4{grid-template-columns:repeat(4,1fr)}
.it{display:flex;align-items:center;gap:1.2cqw;white-space:nowrap}
.sh-items.c1{grid-template-columns:1fr}
.grp{grid-column:1/-1;font-size:2.3cqw;color:#4e5870;border-bottom:.2cqw solid var(--sheet-line);padding-bottom:.6cqw;margin-top:1cqw}
.grp b{color:var(--sheet-ink);font-weight:600;margin-right:1cqw}
.it.own{white-space:normal;font-size:3.1cqw;align-items:baseline}
.it.own .box{min-width:9cqw}
.it .n{font-size:2.1cqw;color:#6b748c;width:3.2cqw}
.box{display:inline-block;min-width:7cqw;height:5.2cqw;border:.3cqw solid #8a94ab;border-radius:.8cqw;vertical-align:middle;text-align:center;line-height:4.6cqw}
.circ{display:inline-block;width:5cqw;height:5cqw;border:.3cqw solid #8a94ab;border-radius:50%;text-align:center;line-height:4.4cqw}
.ans .box,.ans .circ{border-color:var(--sheet-pen);color:var(--sheet-pen);font-weight:600}
.col{display:inline-grid;grid-template-columns:auto auto;column-gap:1cqw;font-size:3.6cqw;line-height:1.25;justify-items:end}
.col .op{grid-row:1/3;align-self:center;justify-self:start}
.col .bar{grid-column:1/3;border-top:.3cqw solid var(--sheet-ink);width:100%;margin:.4cqw 0}
.col .r{grid-column:2;min-width:9cqw;height:5cqw;border:.3cqw dashed #b3bbcc;border-radius:.6cqw;color:var(--sheet-pen);font-weight:600;text-align:right;padding-right:.6cqw}
.sh-foot{margin-top:auto;display:flex;justify-content:space-between;font-size:2cqw;color:#6b748c;border-top:.2cqw solid var(--sheet-line);padding-top:1.4cqw}
.key-stamp{color:var(--sheet-pen);border:.35cqw solid var(--sheet-pen);border-radius:1cqw;padding:.3cqw 1.6cqw;font-weight:700;transform:rotate(-3deg);display:inline-block;font-size:2.6cqw}

/* Маршрут */
.route{padding:16px 18px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.route-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.route-head h2{font-size:16px;font-weight:600}
.route-row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px;position:relative}
.rt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.rt:hover{border-color:var(--ink-2)}
.rt.cur{border:2px solid var(--ink);background:var(--ink-soft)}
.rt.cur .rt-t{font-size:16px}
.rt.prev{opacity:.8}
.rt.empty{border-style:dashed;color:var(--ink-3)}
.rt .label{font-size:11px}
.rt-t{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.rt-m{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.route-act{display:flex;gap:8px;flex-wrap:wrap}
.btn[disabled]{opacity:.45;cursor:default}
.fullprog>summary{cursor:pointer;padding:14px 18px;font-weight:600;color:var(--ink-2)}
.fullprog>summary:hover{color:var(--ink)}
@media (max-width:700px){.route-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.rt.cur{grid-column:1/-1;order:-1}}

/* Конструктор */
.builder{padding:18px;display:flex;flex-direction:column;gap:16px}
.bgroup{display:flex;flex-direction:column;gap:16px}
.builder input[type=text],.builder textarea{padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:var(--card);color:var(--ink);width:100%}
.builder textarea{resize:vertical;min-height:150px;line-height:1.55}
.builder input[type=number]{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;width:96px}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.kinds button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.kinds button span{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kinds button.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink-soft)}
.checks.row{flex-direction:row;flex-wrap:wrap;gap:6px 16px}
.berr{color:var(--pen);font-size:14px;font-weight:500}
.berr:empty{display:none}
.pv-empty{border:1.5px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--ink-3)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px 0}
.tools label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2)}
.gradehead{padding:16px 18px 0;font-family:var(--f-disp);font-weight:600;font-size:15px}
.mine{font-size:11px;font-weight:700;color:var(--ink-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:8px}
.txt{display:flex;gap:8px}
.txt input{flex:1;min-width:0;font:inherit;font-size:22px;font-weight:600;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.task.long{font-size:clamp(20px,4.5vw,26px)}

/* Печать */
.print-pages{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pen);border-radius:10px;padding:12px 16px;color:var(--ink-2);font-size:14px;margin-bottom:18px}

/* Модалка */
.veil{position:fixed;inset:0;background:rgba(10,15,30,.45);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);border-radius:16px;width:min(480px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.modal h2{font-family:var(--f-disp);font-weight:600;font-size:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:var(--card);color:var(--ink);max-width:100%}
.field input[type=text]{padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:var(--card);color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;font-weight:600;min-width:46px}
.seg button.on{border-color:var(--ink);background:var(--ink);color:var(--card)}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:9px;align-items:center}
.code{font-family:var(--f-disp);font-size:26px;letter-spacing:.06em;text-align:center;padding:14px;border:2px dashed var(--ink);border-radius:12px}
.linkbox{display:flex;gap:8px}
.linkbox input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px;background:var(--ink-soft);color:var(--ink)}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* Ученик решает */
.player{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pl-instr{margin:0;text-align:center;font-weight:600;color:var(--ink-2)}
.pl-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pl-who{font-size:14px;color:var(--ink-2)}
.score{display:flex;gap:14px;font-weight:700}
.score span{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.score small{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .25s}
.task{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:170px;display:grid;place-items:center;padding:20px;font-size:clamp(30px,7vw,44px);font-weight:700;font-variant-numeric:tabular-nums;text-align:center;position:relative}
.task .q{display:flex;align-items:center;justify-content:center;gap:.3em;flex-wrap:wrap}
.task .slot{display:inline-block;min-width:1.6em;padding:0 .2em;border:3px dashed var(--ink-3);border-radius:10px;color:var(--ink)}
.task .slot.filled{border-style:solid;border-color:var(--ink)}
.task .col{font-size:inherit;column-gap:.25em}
.task .col .bar{border-top:3px solid var(--ink)}
.task .col .r{height:1.2em;min-width:2.5em;border:3px dashed var(--ink-3);border-radius:8px;color:var(--ink);font-weight:700;padding-right:.15em}
.fb{position:absolute;bottom:10px;left:0;right:0;font-size:15px;font-weight:700}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--pen)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:24px;font-weight:700;min-height:58px}
.pad button:hover{border-color:var(--ink)}
.pad .go{background:var(--ink);color:var(--card);border-color:var(--ink);font-size:18px}
.pad .del{color:var(--pen);font-size:17px}
.signs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.signs button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:34px;font-weight:700;min-height:72px}
.signs button:hover{border-color:var(--ink)}
.finish{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px 20px}
.big{font-family:var(--f-disp);font-size:52px;font-weight:700;line-height:1}
.sent{display:inline-flex;gap:8px;align-items:center;background:var(--ok-soft);color:var(--ok);font-weight:600;border-radius:99px;padding:6px 14px;font-size:14px}
.demo-bar{background:var(--pen-soft);color:var(--pen);font-size:13px;font-weight:600;text-align:center;padding:6px;border-radius:8px}
.foot{margin-top:40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--ink-3);font-size:13px}
.foot button{background:none;border:0;color:var(--ink-2);text-decoration:underline;padding:0}

@media (max-width:900px){.cols,.topic-grid{grid-template-columns:minmax(0,1fr)}.steps{display:none}}
@media (max-width:600px){.top-in{flex-wrap:wrap;gap:4px 12px;padding-block:10px}.crumbs{flex-basis:100%;font-size:13px;gap:2px}.crumbs button,.crumbs .cur{padding:2px 4px}
  .crumbs .cur{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.wrap{padding-block:20px 48px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* ---------- генератор случайных чисел с seed ---------- */
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=(r,lo,hi)=>lo+Math.floor(r()*(hi-lo+1));
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const fmt=n=>typeof n==='number'?(Math.abs(n)>=10000?n.toLocaleString('ru-RU'):String(n)):n;
const TR={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
const translit=s=>s.toLowerCase().split('').map(c=>TR[c]??c).join('').replace(/[^a-z0-9]/g,'')||'UCHENIK';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- движок «Арифметика» ---------- */
const digitsOf=n=>String(n).split('').reverse().map(Number);
function carries(a,b){const x=digitsOf(a),y=digitsOf(b);let c=0,any=false;for(let i=0;i<Math.max(x.length,y.length);i++){const s=(x[i]||0)+(y[i]||0)+c;c=s>=10?1:0;if(c)any=true}return any}
function borrows(a,b){const x=digitsOf(a),y=digitsOf(b);for(let i=0;i<y.length;i++)if((x[i]||0)<y[i])return true;return false}
function onesCarry(a,b){return a%10+b%10>=10}
function onesBorrow(a,b){return a%10<b%10}

function pair(op,p,r,t){
  const hiEff=p.ramp===false?p.hi:Math.max(p.lo,Math.round(p.lo+(p.hi-p.lo)*(0.45+0.55*t)));
  const minOp=p.digits?10**(p.digits-1):1;
  const step=p.round?10:1;
  const carryFn=p.column?(op==='+'?carries:borrows):(op==='+'?onesCarry:onesBorrow);
  for(let k=0;k<400;k++){
    let a,b,res;
    if(op==='+'){
      res=ri(r,Math.ceil(Math.max(p.lo,2*minOp)/step),Math.floor(hiEff/step))*step;
      a=ri(r,Math.ceil(minOp/step),Math.floor((res-minOp)/step))*step;b=res-a;
      if(a<minOp||b<minOp)continue;
      if(p.lo>=11&&!p.digits&&res<11)continue;
    }else if(op==='-'){
      a=ri(r,Math.ceil(Math.max(p.lo,2*minOp)/step),Math.floor(hiEff/step))*step;
      b=ri(r,Math.ceil(minOp/step),Math.floor((a-(p.allowZero?0:minOp))/step))*step;res=a-b;
      if(b<minOp||res<0)continue;
    }else if(op==='×'){
      if(p.table){a=ri(r,p.table[0],p.table[1]);b=ri(r,2,9);if(r()<.5)[a,b]=[b,a]}
      else if(p.extra==='round'){a=ri(r,2,9)*10;b=ri(r,2,9);if(r()<.5)[a,b]=[b,a]}
      else if(p.extra==='2x1'){a=ri(r,12,49);b=ri(r,2,9);if(a%10===0||a*b>400)continue}
      else{a=ri(r,p.aLo,Math.max(p.aLo,Math.round(p.aLo+(p.aHi-p.aLo)*(0.4+0.6*t))));b=ri(r,2,9)}
      res=a*b;
    }else{
      if(p.table){b=ri(r,p.table[0],p.table[1]);const q=ri(r,2,9);a=b*q;res=q}
      else if(p.extra==='round'){b=ri(r,2,9);const q=ri(r,2,9)*10;a=b*q;res=q}
      else{b=ri(r,2,9);const q=ri(r,11,30);a=b*q;res=q;if(a>99&&!p.big)continue}
    }
    if((op==='+'||op==='-')&&p.carry){const c=carryFn(a,b);if(p.carry==='with'&&!c)continue;if(p.carry==='without'&&c)continue}
    return{a,b,op,res};
  }
  return{a:2,b:3,op:'+',res:5,fallback:true};
}

/* выражения для порядка действий: свой маленький разбор, деление только нацело */
function evalExpr(s){
  const tok=s.match(/\d+|[+\-×÷()]/g);let i=0;
  function prim(){const x=tok[i++];if(x==='('){const v=sum();i++;return v}return Number(x)}
  function prod(){let v=prim();while(tok[i]==='×'||tok[i]==='÷'){const o=tok[i++],w=prim();if(o==='×')v*=w;else{if(w===0||v%w)return NaN;v/=w}}return v}
  function sum(){let v=prod();while(tok[i]==='+'||tok[i]==='-'){const o=tok[i++],w=prod();v=o==='+'?v+w:v-w;if(v<0)return NaN}return v}
  const v=sum();return Number.isInteger(v)&&v>=0?v:NaN;
}
function orderItem(p,r){
  for(let k=0;k<500;k++){
    const pat=pick(r,p.patterns);
    const s=pat.replace(/[a-d]/g,()=>String(p.small?ri(r,2,9):ri(r,2,p.max||60)));
    const s2=s.replace(/(\d+)\s*÷\s*(\d+)/g,(m,x,y)=>`${Number(y)*ri(r,2,9)} ÷ ${y}`);
    const v=evalExpr(s2.replace(/\s/g,''));
    if(!isNaN(v)&&v<=(p.cap||100))return{type:'expr',q:s2.replace(/-/g,'−'),ans:v};
  }
  return{type:'expr',q:'2 + 3 × 4',ans:14};
}

function generate(p,seed){
  const r=rng(seed);const items=[];const n=p.count;
  if(p.kind==='mix'){
    items.failed=0;
    p.parts.forEach((pt,k)=>{const sub=generate({...pt.p,count:p.per},seed+k*7919);items.failed+=sub.failed||0;sub.forEach(x=>{x.src=pt.tid;items.push(x)})});
    return items;
  }
  if(p.kind==='own'){
    const arr=p.list.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
    return arr.slice(0,Math.min(n,arr.length)).map(x=>({type:'own',q:x.q,ans:x.ans}));
  }
  items.failed=0;
  for(let i=0;i<n;i++){
    const t=n>1?i/(n-1):1;
    if(p.kind==='order'){items.push(orderItem(p,r));continue}
    if(p.kind==='compare'){
      if(p.cmp==='num'){const x=ri(r,p.lo,p.hi);let y=r()<.2?x:x+ri(r,-3,3);y=Math.max(0,y);items.push({type:'cmp',left:String(x),right:String(y),ans:x>y?'>':x<y?'<':'='})}
      else{const e=pair(pick(r,p.ops),p,r,t);if(e.fallback)items.failed++;const right=Math.max(0,r()<.25?e.res:e.res+pick(r,[-2,-1,1,2]));
        items.push({type:'cmp',left:`${fmt(e.a)} ${sym(e.op)} ${fmt(e.b)}`,right:fmt(right),ans:e.res>right?'>':e.res<right?'<':'='})}
      continue}
    const e=pair(pick(r,p.ops),p,r,t);if(e.fallback)items.failed++;
    if(p.kind==='column'){items.push({type:'col',a:e.a,b:e.b,op:e.op,ans:e.res});continue}
    let miss='res';
    if(p.missing==='any')miss=pick(r,['a','b','res']);else if(p.missing)miss=p.missing;
    if(p.missing==='ab')miss=pick(r,['a','b']);
    const ans=miss==='a'?e.a:miss==='b'?e.b:e.res;
    items.push({type:'eq',a:e.a,b:e.b,op:e.op,res:e.res,miss,ans,x:!!p.xvar});
  }
  return items;
}

function itemHTML(it,showAns){
  if(it.type==='own'){const box=`<span class="box">${showAns?esc(it.ans):''}</span>`;
    return it.q.includes('□')?`<span>${esc(it.q).replace('□',box)}</span>`:`<span>${esc(it.q)} = ${box}</span>`}
  if(it.type==='col'){
    return `<div class="col"><span class="op">${sym(it.op)}</span><span>${fmt(it.a)}</span><span>${fmt(it.b)}</span><span class="bar"></span><span class="r">${showAns?fmt(it.ans):''}</span></div>`}
  if(it.type==='cmp')return `<span>${it.left}</span><span class="circ">${showAns?it.ans:''}</span><span>${it.right}</span>`;
  if(it.type==='expr')return `<span>${it.q} =</span><span class="box">${showAns?fmt(it.ans):''}</span>`;
  const blank=v=>showAns?`<span class="box">${fmt(v)}</span>`:(it.x?'<b>x</b>':'<span class="box"></span>');
  const A=it.miss==='a'?blank(it.a):fmt(it.a),B=it.miss==='b'?blank(it.b):fmt(it.b),R=it.miss==='res'?blank(it.res):fmt(it.res);
  return `<span>${A}</span><span>${sym(it.op)}</span><span>${B}</span><span>=</span><span>${R}</span>`;
}
function instr(it){
  if(!it)return'';
  if(it.type==='cmp')return'Поставь знак >, < или = в кружок.';
  if(it.type==='col')return'Реши в столбик.';
  if(it.type==='expr')return'Найди значение выражения, соблюдай порядок действий.';
  if(it.type==='own')return'Впиши ответ.';
  if(it.x)return'Найди x.';
  return'Впиши ответ в окошко.';
}

/* порядок тем: по математике встроенная программа 1–4 класса, свои темы встают в конец своего класса;
   по русскому пока только свои темы, по классам */
function trackIds(subj='math'){const ids=[];for(const g of [1,2,3,4]){if(subj==='math')for(const sec of MATH[g])for(const t of sec.topics)ids.push(t.id);
  for(const c of S.customTopics)if(c.subject===subj&&c.grade===g&&!c.review)ids.push(c.id)}return ids}
function trackPos(st,subj='math'){const tr=trackIds(subj);if(!tr.length)return{tr,i:-1};let i=tr.indexOf(curOf(st,subj));
  if(i<0){if(subj==='math')i=tr.indexOf(MATH[st.grade][0].topics[0].id);else{i=tr.findIndex(id=>TOPICS[id].grade>=st.grade);if(i<0)i=0}}
  return{tr,i}}
function makeReview(st,subj='math'){
  const {tr,i}=trackPos(st,subj);const prev=tr.slice(0,i);
  const weak=prev.map(id=>({id,m:mastery(st.id,id)})).filter(x=>x.m.pct!=null&&x.m.pct<85).sort((a,b)=>a.m.pct-b.m.pct).map(x=>x.id);
  const pick=weak.slice(0,3);
  for(let k=prev.length-1;k>=0&&pick.length<3;k--)if(!pick.includes(prev[k]))pick.push(prev[k]);
  pick.sort((a,b)=>tr.indexOf(a)-tr.indexOf(b));
  const parts=pick.map(id=>{const t=TOPICS[id];return{tid:id,p:t.L[Math.min(1,t.L.length-1)].p}});
  const rv={id:'rev-'+Date.now(),review:true,custom:true,subject:subj,grade:st.grade,section:'Повторение',t:'Повторение пройденного',
    L:[{n:`Микс из ${pick.length} ${pick.length===1?'темы':'тем'}`,d:pick.map(id=>TOPICS[id].t).join(' · '),p:{kind:'mix',parts,per:4,count:parts.length*4}}]};
  S.customTopics=S.customTopics.filter(c=>!(c.review&&c.forStudent===st.id&&!S.assignments.some(a=>a.topicId===c.id)));
  rv.forStudent=st.id;S.customTopics.push(rv);TOPICS=allTopics();save();openTopic(rv.id);
}
function deleteStudent(st){
  S.students=S.students.filter(s=>s.id!==st.id);
  S.attempts=S.attempts.filter(a=>a.studentId!==st.id);
  S.assignments=S.assignments.filter(a=>a.studentId!==st.id);
  S.customTopics=S.customTopics.filter(c=>c.forStudent!==st.id);
  TOPICS=allTopics();save();go({screen:'students',studentId:null,confirmStDel:false});
}

    return `<button class="topic" data-t="${t.id}"><span class="dot ${m.cls}"></span><span class="tt">${esc(t.t)}${t.custom?'<span class="mine">моя</span>':''}${curOf(st,t.subject)===t.id?'<span class="now">сейчас</span>':''}</span><span class="pct num">${m.pct!=null?m.pct+'%':''}</span></button>`};

  const pos=trackPos(st,subj);let route;
  if(pos.i>=0){

    const tile=(id,label,cls)=>{if(!id)return `<div class="rt empty ${cls}"><span class="label">${label}</span><span class="rt-t">${cls==='prev'?'Это первая тема':label==='Потом'?'':subj==='math'?'Дальше программы 1–4 класса пока нет':'Дальше тем нет, добавьте свою'}</span></div>`;

      <div class="route-act"><button class="btn primary" id="r-task">Задание по текущей теме</button>

      ${tr[i+1]&&mc.pct!=null&&mc.pct<85?`<p class="hint" style="margin:0">По текущей теме последний результат ${mc.pct}%. Перейти дальше можно, но тему стоит закрепить.</p>`:''}

      <p class="empty" style="margin:0">Тем по русскому пока нет. Создайте свою тему списком, например «м□локо = о», и она станет первой в маршруте.</p>
      <div class="route-act"><button class="btn primary" id="r-new">+ Своя тема по русскому</button></div></section>`;
  }
  const grades=subj==='math'?[1,2,3,4]:[1,2,3,4].filter(g=>g===st.grade||mine(g).length);
  let prog=`<div class="tools"><span class="hint">${subj==='math'?'Порядок тем общий для 1–4 класса. Откройте любую тему, чтобы дать задание или сделать её текущей.':'Ваши темы по русскому идут в маршруте по классам. Откройте тему, чтобы дать задание или сделать её текущей.'}</span><button class="btn small" id="newt">+ Своя тема</button></div>`;
  for(const g of grades){
    prog+=`<div class="gradehead">${gradeWord(g)}${g===st.grade?' · класс ученика':''}</div>`;
    const my=mine(g);
    if(subj==='math')prog+=MATH[g].map(sec=>`<div class="sec"><h3>${esc(sec.s)}</h3>${sec.topics.map(t=>row(TOPICS[t.id])).join('')}</div>`).join('');
    if(my.length)prog+=`<div class="sec"><h3>${MY}</h3>${my.map(row).join('')}</div>`;
    if(subj!=='math'&&g===st.grade)prog+=`<div class="locked">Генератор «Вставь букву» появится в следующей версии, его темы встанут в этот же маршрут.</div>`+
      RUS[g].map(sec=>`<div class="sec"><h3>${esc(sec.s)} · скоро</h3>${sec.topics.map(t=>`<button class="topic" disabled><span class="dot"></span><span class="tt">${esc(t)}</span></button>`).join('')}</div>`).join('');
  }

/* ---------- конструктор своей темы ---------- */
const KINDS=[['examples','Примеры','7 + 5 = □'],['window','Окошки','7 + □ = 12'],['compare','Сравнение','7 + 5 ◯ 11'],['column','Столбик','47 + 38 в столбик'],['eq','Уравнения','x + 5 = 12']];
const OPS=[['+','сложение'],['-','вычитание'],['×','умножение'],['÷','деление']];
function openBuilder(){
  const st=student(V.studentId);const subject=V.subject||'math';
  V.b={mode:subject==='rus'?'own':'gen',name:'',grade:st.grade,subject,kind:'examples',ops:['+','-'],lo:1,hi:20,carry:'any',count:12,text:''};
  go({screen:'builder',seed:newSeed()});
}
function buildTopic(b){
  const base={id:'c'+Date.now(),custom:true,subject:b.subject,grade:b.grade,section:MY,t:b.name.trim()||'Новая тема'};
  if(b.mode==='own'){const {list}=parseList(b.text);const c=Math.min(b.count,list.length);
    return{...base,L:[{n:'Свой список',d:`${list.length} заданий, порядок перемешивается`,p:{kind:'own',count:c,list}}]}}
  let ops=b.ops.slice();
  const p={kind:b.kind==='column'?'column':b.kind==='compare'?'compare':'examples',ops,lo:b.lo,hi:b.hi,count:b.count};
  if(b.kind==='compare')p.cmp='expr';
  if(b.kind==='window')p.missing='any';
  if(b.kind==='eq'){p.missing='ab';p.xvar=true}
  if(b.carry!=='any')p.carry=b.carry;
  if(b.kind==='column'){p.column=true;p.ops=ops.filter(o=>o!=='÷');if(p.ops.includes('×')){p.ops=['×'];p.aLo=Math.max(2,b.lo);p.aHi=Math.max(b.lo+1,b.hi)}}
  else if(ops.some(o=>o==='×'||o==='÷'))p.table=[2,9];
  const mid=Math.max(b.lo+2,Math.round(b.lo+(b.hi-b.lo)/2));
  const harder=b.kind==='examples'?{...p,missing:'any'}:{...p,count:Math.min(24,p.count+4)};
  return{...base,L:[
    {n:'Попроще',d:p.table&&!ops.some(o=>o==='+'||o==='-')?'таблица на 2–5':`числа до ${fmt(mid)}`,p:{...p,hi:mid,aHi:p.aHi?Math.max(p.aLo+1,Math.round((p.aLo+p.aHi)/2)):undefined,table:p.table?[2,5]:undefined}},
    {n:'Как задано',d:p.table&&!ops.some(o=>o==='+'||o==='-')?'вся таблица':`числа от ${fmt(b.lo)} до ${fmt(b.hi)}`,p},
    {n:'Посложнее',d:b.kind==='examples'?'пропуск в любом месте':`длиннее лист: ${harder.count} заданий`,p:harder}]};
}
function builderErrors(b){
  const e=[];
  if(b.mode==='own'){const {list,bad}=parseList(b.text);
    if(list.length<2)e.push('Добавьте хотя бы 2 строки в формате «вопрос = ответ».');
    if(bad)e.push(`Строк без знака «=» или без ответа: ${bad}. Они не попадут в тему.`);}
  else{
    if(!b.ops.length)e.push('Выберите хотя бы одно действие.');
    if(b.kind==='column'&&b.ops.length&&b.ops.every(o=>o==='÷'))e.push('Столбиком можно складывать, вычитать и умножать. Деление в столбик появится позже.');
    if(!(Number.isFinite(b.lo)&&Number.isFinite(b.hi))||b.lo<0||b.hi<=b.lo+1)e.push('Число «до» должно быть хотя бы на 2 больше, чем «от».');
    if(b.hi>100000)e.push('Слишком большие числа: максимум 100 000.');
  }
  if(!(b.count>=4&&b.count<=24))e.push('Заданий на листе: от 4 до 24.');
  return e;
}

  let grade=2;const subj=new Set(['math']);
  modal(`<h2>Новый ученик</h2>
    <div class="field"><label for="nm" class="label">Имя и фамилия</label><input id="nm" type="text" placeholder="Например, Соня Петрова" autocomplete="off"></div>
    <div class="field"><span class="label">Класс в школе</span><div class="seg" id="gr">${[1,2,3,4].map(g=>`<button data-g="${g}" class="${g===grade?'on':''}">${g}</button>`).join('')}</div></div>
    <div class="field"><label class="label" for="st-start">С какой темы начать математику</label><select id="st-start"></select>
      <span class="hint">Если ученик сильнее программы, выберите тему старшего класса. Маршрут пойдёт от неё.</span></div>
    <div class="field" id="rus-start-f" hidden><label class="label" for="st-start-rus">С какой темы начать русский</label><select id="st-start-rus"></select></div>
    <div class="field"><span class="label">Предметы</span><div class="checks">
      <label><input type="checkbox" id="sm" checked> Математика</label><label><input type="checkbox" id="sr"> Русский язык</label></div></div>
    <p class="hint" id="err" style="margin:0"></p>
    <div class="modal-actions"><button class="btn quiet" id="cl">Отмена</button><button class="btn primary" id="ok">Добавить</button></div>`,()=>{
    const fillStart=()=>{const sel=document.getElementById('st-start');
      sel.innerHTML=[1,2,3,4].map(g=>`<optgroup label="${gradeWord(g)}">${trackIds().filter(id=>TOPICS[id].grade===g).map(id=>`<option value="${id}">${esc(TOPICS[id].t)}</option>`).join('')}</optgroup>`).join('');
      sel.value=MATH[grade][0].topics[0].id;
      const rt=trackIds('rus'),rs=document.getElementById('st-start-rus');
      document.getElementById('rus-start-f').hidden=!(rt.length&&document.getElementById('sr').checked);
      rs.innerHTML=rt.map(id=>`<option value="${id}">${gradeWord(TOPICS[id].grade)} · ${esc(TOPICS[id].t)}</option>`).join('');
      const d=rt.find(id=>TOPICS[id].grade>=grade);if(d)rs.value=d};
    fillStart();
    document.getElementById('sr').onchange=fillStart;
    document.querySelectorAll('#gr button').forEach(b=>b.onclick=()=>{grade=+b.dataset.g;document.querySelectorAll('#gr button').forEach(x=>x.classList.toggle('on',x===b));fillStart()});
    document.getElementById('cl').onclick=close;
    document.getElementById('ok').onclick=()=>{
      const name=document.getElementById('nm').value.trim();
      const subjects=[document.getElementById('sm').checked&&'math',document.getElementById('sr').checked&&'rus'].filter(Boolean);
      if(!name){document.getElementById('err').textContent='Введите имя ученика.';return}
      if(!subjects.length){document.getElementById('err').textContent='Отметьте хотя бы один предмет.';return}
      const id='s'+Date.now();
      const ns={id,name,grade,subjects,current:document.getElementById('st-start').value};
      if(subjects.includes('rus')&&trackIds('rus').length)ns.currentRus=document.getElementById('st-start-rus').value;
      S.students.push(ns);save();close();
      go({screen:'student',studentId:id,subject:subjects[0]});
    };
  });
}

/* ---------- экран ученика ---------- */
let P=null;
function startPlayer(h){
  const t=TOPICS[h.topicId];const p={...t.L[h.level].p,...(h.over||{})};
  P={h,t,items:generate(p,h.seed),i:0,input:'',correct:0,streak:0,score:0,mistakes:[],log:[],start:Date.now(),fb:null,lock:false};
  V.studentId=h.studentId;go({screen:'player'});
}
const isNumAns=it=>/^\d+$/.test(String(it.ans));
const textMode=it=>it.type==='own'&&!isNumAns(it);
const norm=s=>String(s).trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');
function qText(it){
  if(it.type==='own'){const slot=`<span class="slot${P.input?' filled':''}">${esc(P.input)||'?'}</span>`;
    return it.q.includes('□')?`<span>${esc(it.q).replace('□',slot)}</span>`:`<span>${esc(it.q)} =</span>${slot}`}
  if(it.type==='cmp')return `${it.left} <span class="slot${P.input?' filled':''}">${P.input||'?'}</span> ${it.right}`;
  if(it.type==='expr')return `${it.q} = <span class="slot${P.input?' filled':''}">${P.input||'?'}</span>`;
  if(it.type==='col')return `<div class="col"><span class="op">${sym(it.op)}</span><span>${fmt(it.a)}</span><span>${fmt(it.b)}</span><span class="bar"></span><span class="r">${P.input||''}</span></div>`;
  const slot=`<span class="slot${P.input?' filled':''}">${P.input||(it.x?'x':'?')}</span>`;
  return `${it.miss==='a'?slot:fmt(it.a)} ${sym(it.op)} ${it.miss==='b'?slot:fmt(it.b)} = ${it.miss==='res'?slot:fmt(it.res)}`;
}
function plainQ(it){
  if(it.type==='own')return it.q.includes('□')?it.q:it.q+' = □';
  if(it.type==='cmp')return `${it.left} ◯ ${it.right}`;
  if(it.type==='expr')return `${it.q} = □`;
  if(it.type==='col')return `${fmt(it.a)} ${sym(it.op)} ${fmt(it.b)}`;
  const s=v=>it.x?'x':'□';
  return `${it.miss==='a'?s():fmt(it.a)} ${sym(it.op)} ${it.miss==='b'?s():fmt(it.b)} = ${it.miss==='res'?s():fmt(it.res)}`;
}
function viewPlayer(){
  const it=P.items[P.i];const st=student(P.h.studentId);
  const tm=textMode(it);
  const pad=it.type==='cmp'
    ?`<div class="signs">${['<','=','>'].map(s=>`<button data-sign="${s}" aria-label="знак ${s}">${s}</button>`).join('')}</div>`
    :tm?`<div class="txt"><input id="tx" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ответ" placeholder="Ответ" value="${esc(P.input)}"><button class="btn primary" id="txok">Готово</button></div>`
    :`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button class="del" data-k="del">Стереть</button><button data-k="0">0</button><button class="go" data-k="ok">Готово</button></div>`;
  app.innerHTML=`<div class="player">
    <div class="demo-bar">Так домашку видит ученик на телефоне или компьютере</div>
    <div class="pl-head"><div><div class="pl-who">${esc(st.name)} · ${esc(P.t.t)}</div><div class="label">Задание ${P.i+1} из ${P.items.length}</div></div>
      <div class="score num"><span>${P.score}<small>очки</small></span><span>${P.streak}<small>подряд</small></span></div></div>
    <div class="prog"><i style="width:${P.i/P.items.length*100}%"></i></div>
    <p class="pl-instr">${esc(instr(it))}</p>
    <div class="task${it.type==='own'&&it.q.length>16?' long':''}" aria-live="polite"><div class="q">${qText(it)}</div>${P.fb?`<div class="fb ${P.fb.ok?'ok':'bad'}">${P.fb.ok?'Верно! +10':'Правильный ответ: '+esc(P.fb.ans)}</div>`:''}</div>
    ${pad}
    <div style="text-align:center"><button class="btn small quiet" id="stop">Закончить досрочно</button></div></div>`;
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k));
  app.querySelectorAll('[data-sign]').forEach(b=>b.onclick=()=>{P.input=b.dataset.sign;submit()});
  if(tm){const tx=document.getElementById('tx');const send=()=>{if(!P.lock&&P.input.trim())submit()};
    tx.oninput=()=>{P.input=tx.value};tx.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};
    document.getElementById('txok').onclick=send;if(!P.lock)tx.focus()}
  document.getElementById('stop').onclick=finish;
}
function key(k){
  if(!P||P.lock||V.screen!=='player')return;
  if(k==='del')P.input=P.input.slice(0,-1);
  else if(k==='ok'){if(P.input)submit();return}
  else if(P.input.length<7)P.input+=k;
  P.fb=null;viewPlayer();
}
function submit(){
  const it=P.items[P.i];const ok=norm(it.ans)===norm(P.input);
  P.log.push({src:it.src,ok});
  if(ok){P.correct++;P.streak++;P.score+=10}else{P.streak=0;P.mistakes.push({q:plainQ(it),given:P.input,ans:String(fmt(it.ans)),src:it.src})}
  P.fb={ok,ans:String(fmt(it.ans))};P.lock=true;viewPlayer();
  setTimeout(()=>{P.lock=false;P.fb=null;P.input='';P.i++;if(P.i>=P.items.length)finish();else viewPlayer()},ok?650:1500);
}
function finish(){
  if(!P)return;
  const a={id:'a'+Date.now(),studentId:P.h.studentId,topicId:P.t.id,level:P.h.level,correct:P.correct,total:P.items.length,answered:P.i,time:Math.round((Date.now()-P.start)/1000),date:Date.now(),mistakes:P.mistakes};
  if(P.t.review){
    const by={};for(const x of P.log){by[x.src]=by[x.src]||{c:0,n:0};by[x.src].n++;if(x.ok)by[x.src].c++}
    Object.keys(by).forEach((src,k)=>S.attempts.push({id:a.id+'-'+k,studentId:a.studentId,topicId:src,level:Math.min(1,TOPICS[src].L.length-1),
      correct:by[src].c,total:by[src].n,time:a.time,date:a.date,mistakes:P.mistakes.filter(m=>m.src===src),via:'review'}));
  }else S.attempts.push(a);
  const h=S.assignments.find(x=>x.code===P.h.code);if(h)h.status='сдано';save();
  P.result=a;go({screen:'done'});
}
function viewDone(){
  const a=P.result;const pct=Math.round(a.correct/a.total*100);
  const word=pct>=85?'Отлично!':pct>=60?'Хорошо, есть над чем поработать':'Давай потренируемся ещё';
  app.innerHTML=`<div class="player"><div class="demo-bar">Экран ученика</div>
    <div class="panel finish"><span class="label">${esc(P.t.t)}</span><div class="big num">${a.correct} из ${a.total}</div>
      <p style="margin:0;font-size:18px;font-weight:600">${word}</p><span class="sent">✓ Результат отправлен репетитору</span>
      <p class="hint" style="margin:0">Время: ${Math.floor(a.time/60)} мин ${a.time%60} с. Очки: ${P.score}.</p></div>
    <button class="btn primary" id="back">Вернуться к репетитору и посмотреть результат</button></div>`;
  document.getElementById('back').onclick=()=>{const sid=P.h.studentId;P=null;go({screen:'student',studentId:sid,subject:'math'})};
}
document.addEventListener('keydown',e=>{
  if(V.screen!=='player'||!P||mroot.innerHTML)return;
  const it=P.items[P.i];
  if(it.type==='cmp'){if(['<','>','='].includes(e.key)){P.input=e.key;submit()}return}
  if(textMode(it))return;
  if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('del');else if(e.key==='Enter')key('ok');
});
document.getElementById('home').onclick=()=>go({screen:'students'});
render();
</script>

</html>
