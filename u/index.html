  pos3:{cols:['сущ.','прил.','глаг.'],hint:'Распредели слова по частям речи: существительное, прилагательное, глагол.',gen:()=>[...NOUNS.map(n=>({w:n.w,c:'сущ.'})),...lexList('a').map(w=>({w,c:'прил.'})),...lexList('v').map(w=>({w,c:'глаг.'}))]},
  pos4:{cols:['сущ.','прил.','глаг.','числ.'],hint:'Распредели слова по частям речи.',gen:()=>[...SORTS.pos3.gen(),...lexList('num').map(w=>({w,c:'числ.'}))]},
  pos5:{cols:['сущ.','прил.','глаг.','нареч.'],hint:'Распредели слова по частям речи.',gen:()=>[...SORTS.pos3.gen(),...lexList('adv').map(w=>({w,c:'нареч.'}))]},
  gender:{cols:['м. р.','ж. р.','ср. р.'],hint:'Распредели существительные по родам.',gen:()=>NOUNS.map(n=>({w:n.w,c:GEN[n.g]}))},
  decl:{cols:['1 скл.','2 скл.','3 скл.'],hint:'Определи склонение существительных и распредели их.',gen:()=>NOUNS.filter(n=>n.w!=='дочь').map(n=>({w:n.w,c:declOf(n)}))},
  conj:{cols:['I спр.','II спр.'],hint:'Определи спряжение глаголов и распредели их.',gen:()=>[...lexList('c1').map(w=>({w,c:'I спр.'})),...lexList('c2').map(w=>({w,c:'II спр.'}))]},
  adjg:{cols:['м. р.','ж. р.','ср. р.','мн. ч.'],hint:'Распредели прилагательные: род или множественное число.',gen:()=>lexList('a').flatMap(a=>adjForms(a).map(([w,c])=>({w,c})))},
  adjn:{cols:['ед. ч.','мн. ч.'],hint:'Распредели прилагательные: единственное или множественное число.',gen:()=>lexList('a').flatMap(a=>adjForms(a).map(([w,c])=>({w,c:c==='мн. ч.'?'мн. ч.':'ед. ч.'})))},
  vpast:{cols:['м. р.','ж. р.','ср. р.','мн. ч.'],hint:'Глаголы в прошедшем времени: распредели по родам и числу.',gen:()=>[...lexList('c1'),...lexList('c2')].filter(v=>/ть$/.test(v)&&PAST_OK(v)).flatMap(v=>pastForms(v).map(([w,c])=>({w,c})))},
  vtense:{cols:['прош. вр.','наст. вр.','буд. вр.'],hint:'Распредели глаголы по временам.',gen:()=>byCols(VTENSE)},
  vnum:{cols:['ед. ч.','мн. ч.'],hint:'Распредели глаголы: единственное или множественное число.',gen:()=>byCols(VNUM)},
  pron:{cols:['1-е лицо','2-е лицо','3-е лицо'],hint:'Распредели личные местоимения по лицам.',gen:()=>byCols(PRON)},
  purpose:{cols:['повеств.','вопрос.','побуд.'],hint:'Распредели предложения по цели высказывания: повествовательные, вопросительные, побудительные.',gen:()=>byCols(PURP)},
  slov:{cols:['словосочетание','не словосочетание'],hint:'Распредели: где словосочетание, а где нет (это предложение, слова с предлогом или однородные слова).',gen:()=>byCols(SLOV)},
  complex:{cols:['простое','сложное'],hint:'Распредели предложения: простые и сложные.',gen:()=>byCols(CMPLX)}};
function sortItems(p,r){const S0=SORTS[p.set];let pool=S0.gen();
  if(p.filter==='syl12')pool=pool.filter(x=>sylN(x.w)<=2);
  const seen=new Set();pool=shuffle(r,pool).filter(x=>!seen.has(x.w)&&seen.add(x.w));
  /* поровну из каждого столбика, чтобы ни один не пустовал */
  const per={};for(const c of S0.cols)per[c]=pool.filter(x=>x.c===c);
  const out=[];for(let k=0;out.length<p.count&&k<99;k++)for(const c of S0.cols){if(out.length>=p.count)break;const x=per[c][k];if(x)out.push(x)}
  return shuffle(r,out).map(x=>({type:'sort',w:x.w,ans:x.c,opts:S0.cols,cols:S0.cols,hint:S0.hint,hintOn:'Куда отнести: '+S0.cols.join(' или ')+'?',long:x.w.length>18}))}

/* «Раздели»: слоги, перенос, ударение; «Измени»: множественное число; алфавит */
const PLUR=`кот коты|стол столы|окно окна|книга книги|тетрадь тетради|ручка ручки|мяч мячи|ёж ежи|лиса лисы|дерево деревья|яблоко яблоки|цветок цветы|гриб грибы|друг друзья|лист листья|море моря|поле поля|сад сады|лес леса|город города|ключ ключи|нож ножи|птица птицы|рыба рыбы|школа школы|река реки|гора горы|звезда звёзды|ребёнок дети|облако облака|дом дома|глаз глаза|стул стулья|брат братья|сестра сёстры`;
function splitItems(p,r){const out=[];
  if(p.what==='syl'){let ws=uniq([...allWords(),'кит','дом','сок','лес','слон','ёлка','мука','рука','ворона','машина','черепаха','мотоцикл','телевизор']).filter(w=>{const s=sylN(w);return s>=p.min&&s<=p.max});
    return shuffle(r,ws).slice(0,p.count).map(w=>({type:'own',q:w+' — □',ans:String(sylN(w)),hint:'Сколько слогов в слове? Впиши число.'}))}
  if(p.what==='hy'){let ws=lexList('hy').filter(w=>sylN(w)>=p.min&&sylN(w)<=p.max);if(p.no)ws=[...ws,...shuffle(r,lexList('hyNo')).slice(0,Math.ceil(p.count/4))];
    ws=shuffle(r,ws).slice(0,p.count);
    return ws.map(w=>{const ok=hyphs(w),bad=[];for(let k=1;k<w.length;k++){const v=w.slice(0,k)+'-'+w.slice(k);if(!ok.includes(v))bad.push(v)}
      const NO='нельзя перенести',right=ok.length?pick(r,ok):NO;const opts=shuffle(r,[right,...shuffle(r,bad).slice(0,ok.length?1:2),...(ok.length?[NO]:[])]).slice(0,3);if(!opts.includes(right))opts[0]=right;
      return{type:'line',w,ans:right,key:ok.length?ok.join(', '):'—',opts:shuffle(r,opts),hint:p.no?'Раздели слова для переноса всеми способами. Если перенести нельзя — поставь прочерк.':'Раздели слова для переноса всеми способами.',hintOn:'Как можно перенести слово?'}})}
  if(p.what==='str'){const ws=shuffle(r,stressWords().filter(w=>{const s=sylN(w.replace(ACUTE,''));return s>=p.min&&s<=p.max})).slice(0,p.count);
    return ws.map(sw=>{const w=sw.replace(ACUTE,''),n=sylN(w);const vars=Array.from({length:n},(_,i)=>stressVar(w,i));
      return{type:'line',w,ans:sw,key:sw,opts:vars.slice(0,4),noLine:true,hint:'Поставь в словах ударение.',hintOn:'Где ударение?'}})}
  if(p.what==='pronf')return shuffle(r,PRONF.split('|')).slice(0,p.count).map(x=>{const [a,b]=x.split(':');return{type:'line',w:a,ans:b,key:b,hint:'Поставь местоимение в нужную форму.',hintOn:'Поставь местоимение в нужную форму.'}});
  if(p.what==='plur')return shuffle(r,PLUR.split('|')).slice(0,p.count).map(x=>{const [a,b]=x.split(' ');return{type:'line',w:a,ans:b,key:b,hint:'Запиши слово во множественном числе.',hintOn:'Запиши во множественном числе.'}});
  if(p.what==='abc'){for(let k=0;k<p.count;k++){const ws=[];const used=new Set();
      for(const n of shuffle(r,NOUNS)){if(ws.length>=p.n)break;if(used.has(n.w[0]))continue;used.add(n.w[0]);ws.push(n.w)}
      const ord=ws.slice().sort((a,b)=>a.localeCompare(b,'ru'));
      out.push({type:'line',w:ws.join(', '),ans:ord[0],key:ord.join(', '),opts:shuffle(r,ws),hint:'Запиши слова в алфавитном порядке.',hintOn:'Какое слово стоит первым по алфавиту?',long:true})}
    return out}
  return out}

/* «Выбери»: синонимы, антонимы, однокоренные, падеж, НЕ с глаголами, предлоги */
const SYN=`автомобиль машина|азбука алфавит|актёр артист|блестеть сиять|врач доктор|гребёнка расчёска|друг товарищ|думать размышлять|метель вьюга|мокрый влажный|правильный верный|прилежный старательный|работа труд|смелый храбрый|смешной забавный|учитель педагог|шалить баловаться|красивый прекрасный|ласковый нежный|задира забияка|ключ родник|быстрый скорый|грустный печальный|огромный громадный`;
const ANT=`белый чёрный|близкий далёкий|больной здоровый|большой маленький|быстро медленно|вежливый грубый|весело грустно|мокрый сухой|мягкий твёрдый|начинать кончать|война мир|высокий низкий|глубокий мелкий|говорить молчать|горячий холодный|острый тупой|пасмурный ясный|плакать смеяться|густой редкий|длинный короткий|жара мороз|загадка отгадка|ленивый прилежный|лето зима|лёгкий тяжёлый|север юг|слабый сильный|смелый трусливый|хвалить ругать|чистый грязный|шум тишина|щедрый жадный|день ночь|старый молодой|друг враг`;
const COGN=`лес лесной лесник лестница|вода водный подводный водитель|гора горка горный горе|сад садовник садик садиться|рыба рыбак рыбный рынок|кот котик котёнок который|море моряк морской мороз|гриб грибник грибной грипп|зима зимний зимовать земля|лиса лисица лисёнок лист|соль солонка солёный солнце|сыр сырный сырок сырой|нос носик носовой носить|лёд ледник ледяной лето|дом домик домашний домино|снег снежок снеговик снасть`;
const CASES=['И. п.','Р. п.','Д. п.','В. п.','Т. п.','П. п.'];
const CASEQ=`И. п.:[Кошка] спит.|И. п.:[Солнце] светит ярко.|И. п.:В саду растут [яблони].|И. п.:Дует холодный [ветер].|Р. п.:На улице нет [снега].|Р. п.:У [мамы] сегодня праздник.|Р. п.:Купили подарок для [брата].|Р. п.:Мы вышли из [леса].|Д. п.:Мы подошли к [реке].|Д. п.:Я дал корм [собаке].|Д. п.:Мы шли по [дороге].|Д. п.:Я рад [другу].|В. п.:Я вижу [кошку].|В. п.:Маша читает [книгу].|В. п.:Я люблю [зиму].|В. п.:Мы пошли в [лес].|Т. п.:Мы любуемся [закатом].|Т. п.:Я пишу [ручкой].|Т. п.:Я гуляю с [папой].|Т. п.:Сарай стоит за [домом].|П. п.:Я думаю о [маме].|П. п.:Птица сидит на [ветке].|П. п.:Дедушка живёт в [городе].|П. п.:Мы мечтаем о [море].`;
const NEV=`не знал|не спал|не видел|не пришёл|не может|не умеет|не хочу|не слышу|не шуми|не бегай|не забыл|не успел|не плачь|не трогай|не боится`;
const NEW=`ненавидеть|негодовать|недоумевать|нездоровится`;
const PREPN=`в лесу|на столе|под деревом|за домом|из школы|к реке|по дороге|у окна|над рекой|от мамы|с папой|до школы|в саду|на поляне|под окном|из леса`;
function chItems(p,r){const out=[];const pairs=s=>s.split('|').map(x=>x.split(' '));
  if(p.what==='syn'||p.what==='ant'){const own=pairs(p.what==='syn'?SYN:ANT),other=pairs(p.what==='syn'?ANT:SYN).flat();
    for(const [a,b] of shuffle(r,own).slice(0,p.count)){const [q,ans]=r()<.5?[a,b]:[b,a];
      const synOf=w=>pairs(SYN).filter(x=>x.includes(w)).flat();
      const taken=new Set([...own.filter(x=>x.includes(q)).flat(),...synOf(ans),...synOf(q)]);
      const pool=uniq([...own.flat(),...other]).filter(w=>!taken.has(w));
      out.push({type:'ch',q:`${p.what==='syn'?'Синоним':'Антоним'} к слову «${q}»`,opts:shuffle(r,[ans,...shuffle(r,pool).slice(0,2)]),ans,svg:'',hint:p.what==='syn'?'Подбери синоним — слово, близкое по значению. Обведи.':'Подбери антоним — слово, противоположное по значению. Обведи.'})}
    return out}
  if(p.what==='cogn')return shuffle(r,COGN.split('|')).slice(0,p.count).map(g=>{const ws=g.split(' '),odd=ws[3];
    return{type:'ch',q:'Какое слово лишнее?',opts:shuffle(r,ws),ans:odd,svg:'',hint:'В каждой строке три однокоренных слова и одно лишнее. Обведи лишнее.'}});
  if(p.what==='case')return shuffle(r,CASEQ.split('|')).slice(0,p.count).map(x=>{const k=x.indexOf(':'),c=x.slice(0,k),s=x.slice(k+1),w=s.match(/\[(.+?)\]/)[1];
    return{type:'ch',q:s.replace(/\[(.+?)\]/,'«$1»'),opts:CASES,ans:c,svg:'',hint:'Определи падеж выделенного существительного. Обведи.'}});
  if(p.what==='ne'){const items=[...NEV.split('|').map(x=>({ans:x,bad:x.replace(' ','')})),...NEW.split('|').map(x=>({ans:x,bad:x.replace(/^не/,'не ')}))];
    return shuffle(r,items).slice(0,p.count).map(x=>({type:'ch',q:'Как правильно?',opts:shuffle(r,[x.ans,x.bad]),ans:x.ans,svg:'',hint:'НЕ с глаголами пишется раздельно. Обведи, как правильно.'}))}
  if(p.what==='prep')return shuffle(r,PREPN.split('|')).slice(0,p.count).map(x=>({type:'ch',q:'Как правильно?',opts:shuffle(r,[x,x.replace(' ','')]),ans:x,svg:'',hint:'Предлоги пишутся отдельно от слов. Обведи, как правильно.'}));
  return out}

/* главные члены предложения: [подлежащее] {сказуемое} */
const SNT=`Маленький [котёнок] {спит} на окне.|[Солнце] {светит} ярко.|Утром [дети] {пошли} в школу.|В саду {цветут} [розы].|[Птицы] {улетели} на юг.|Высоко в небе {летит} [самолёт].|[Мама] {испекла} пирог.|На ветке {сидит} [снегирь].|[Ветер] {качает} деревья.|[Ребята] {катаются} на коньках.|Весной {тает} [снег].|[Собака] громко {лает}.|[Бабушка] {вяжет} тёплые носки.|По небу {плывут} [облака].|[Ёжик] {нашёл} гриб.|Ночью {выпал} [снег].|[Река] {течёт} медленно.|[Мальчик] {читает} книгу.`;
function odnItems(p,r){return shuffle(r,ODN.split('|')).slice(0,p.count).map(s=>{const hom=[...s.matchAll(/\[(.+?)\]/g)].map(m=>m[1]),plain=s.replace(/[\[\]]/g,'');
  const others=plain.replace(/[.,]/g,'').split(' ').filter(w=>w.length>2&&!hom.includes(w));const ans=hom.join(', ');
  const wrong1=[hom[0],pick(r,others)].join(', '),wrong2=[...hom.slice(1),pick(r,others)].join(', ');
  return{type:'snt',s,odn:true,ans,opts:uniq(shuffle(r,[ans,wrong1,wrong2])),q:plain,hint:'Подчеркни однородные члены предложения.',hintOn:'Найди однородные члены.'}})}
function sntItems(p,r){if(p.odn)return odnItems(p,r);return shuffle(r,SNT.split('|')).slice(0,p.count).map((s,k)=>{const words=s.replace(/[.]/g,'').split(' ');
  const subj=words.find(w=>w[0]==='[').slice(1,-1),pred=words.find(w=>w[0]==='{').slice(1,-1),ask=k%2?'pred':'subj',ans=ask==='subj'?subj:pred;
  const plain=words.map(w=>w.replace(/[\[\]{}]/g,''));
  const opts=shuffle(r,[ans,...shuffle(r,plain.filter(w=>w!==ans&&w.length>2)).slice(0,2)]);
  return{type:'snt',s,ans,opts,hint:'Подчеркни подлежащее одной чертой, сказуемое — двумя.',hintOn:ask==='subj'?'Найди подлежащее.':'Найди сказуемое.',q:s.replace(/[\[\]{}]/g,'')}})}

/* состав слова: п — приставка, к — корень, с — суффикс, о — окончание (пустое — нулевое) */
const MOR=`лесник:к-лес с-ник о-|лесной:к-лес с-н о-ой|подоконник:п-под к-окон с-ник о-|рыбак:к-рыб с-ак о-|домик:к-дом с-ик о-|садовник:к-сад с-ов с-ник о-|переход:п-пере к-ход о-|подберёзовик:п-под к-берёз с-ов с-ик о-|зимний:к-зим с-н о-ий|морской:к-мор с-ск о-ой|дорожка:к-дорож с-к о-а|рыбка:к-рыб с-к о-а|снежок:к-снеж с-ок о-|грибник:к-гриб с-ник о-|пригорок:п-при к-гор с-ок о-|подорожник:п-по к-дорож с-ник о-|листочек:к-лист с-оч с-ек о-|горка:к-гор с-к о-а|перелесок:п-пере к-лес с-ок о-|вода:к-вод о-а|водный:к-вод с-н о-ый|лесок:к-лес с-ок о-|подводный:п-под к-вод с-н о-ый|котёнок:к-кот с-ёнок о-|носик:к-нос с-ик о-|столик:к-стол с-ик о-|сестрица:к-сестр с-иц о-а|приморский:п-при к-мор с-ск о-ий|подснежник:п-под к-снеж с-ник о-|заречный:п-за к-реч с-н о-ый`;
const MROLE={п:'приставку',к:'корень',с:'суффикс',о:'окончание'};
function morItems(p,r){const all=MOR.split('|').map(x=>{const [w,s]=x.split(':');return{w,parts:s.split(' ').map(t=>({r:t[0],t:t.slice(2)}))}});
  return shuffle(r,all).slice(0,p.count).map((m,k)=>{
    const asks=p.ask==='root'?['к']:['к','п','с','о'].filter(a=>a==='с'?m.parts.filter(x=>x.r==='с').length===1:m.parts.some(x=>x.r===a&&x.t));const ask=asks[k%asks.length];
    const ans=m.parts.filter(x=>x.r===ask).map(x=>x.t).join(ask==='с'?' и ':'');
    const segs=m.parts.map(x=>x.t).filter(Boolean),cand=uniq([...segs,segs.slice(0,2).join(''),segs.slice(-2).join('')]).filter(x=>x&&x!==ans&&x!==m.w);
    return{type:'mor',w:m.w,parts:m.parts,ans,opts:shuffle(r,[ans,...shuffle(r,cand).slice(0,2)]),hint:p.ask==='root'?'Выдели корень в словах.':'Разбери слова по составу: выдели приставку, корень, суффикс и окончание.',hintOn:`Найди ${MROLE[ask]} в слове «${m.w}».`}})}
const PROG={math:MATH,rus:RUSP};
const SUBJ={math:'Математика',rus:'Русский язык'};
function allTopics(){const m={};for(const subj in PROG)for(const g in PROG[subj])for(const sec of PROG[subj][g])for(const t of sec.topics)if(!t.soon)m[t.id]={...t,grade:+g,section:sec.s,subject:subj};
  for(const c of (S&&S.customTopics)||[])m[c.id]=c;return m}
let TOPICS={};
const MY='Мои темы';
const parseList=text=>{const list=[];let bad=0;for(const raw of text.split('\n')){const line=raw.trim();if(!line)continue;const k=line.lastIndexOf('=');
  const q=k>0?line.slice(0,k).trim():'',ans=k>0?line.slice(k+1).trim():'';if(q&&ans)list.push({q,ans});else bad++}return{list,bad}};

function mastery(sid,tid){
  const at=S.attempts.filter(x=>x.studentId===sid&&x.topicId===tid).sort((x,y)=>y.date-x.date).slice(0,3);
  if(!at.length)return{cls:'',pct:null,n:0,low:false,at:[]};
  const oneLevel=TOPICS[tid]&&TOPICS[tid].L.length===1;
  let sw=0,sv=0,n=0;
  at.forEach((a,i)=>{const w=[3,2,1][i]*Math.min(a.total,10)/10;const f=oneLevel?1:[0.8,1,1][Math.min(a.level||0,2)];
    sv+=w*(a.correct/a.total)*f;sw+=w;n+=a.total});

}

/* высоты всех частей листа кратны клетке: тогда цифры каждого задания попадают в клетки */
function snapCells(root){(root||document).querySelectorAll('.sheet').forEach(sh=>{const c=sh.clientWidth*CELL/100;if(!c)return;
  sh.querySelectorAll('.tw').forEach(el=>{el.style.width='';el.style.width=(Math.ceil(el.scrollWidth/c-0.02)*c)+'px'});

  /* задания с текстом: ширина по содержимому, в одной части — одинаковая, чтобы шли ровными колонками */

function sheetParts(items,{topic,level,seed,studentName,answers,design}){

  const kind=items[0]&&items[0].type;
  const ownLen=Math.max(0,...items.filter(x=>x.type==='own').map(x=>x.q.length+(x.svg?40:0)));
  const mixed=new Set(items.map(x=>x.type)).size>1||items.some(x=>x.src);
  /* сколько колонок помещается: по длине самого длинного задания */

  const maxLen=Math.max(0,...items.map(lenOf));
  const tight=true;
  /* на «Строгом» шрифт крупнее, поэтому три колонки только для коротких примеров */
  const fit=c=>maxLen>(tight?28:34)?'c1':maxLen>(D?13:11)&&c==='c3'?'c2':c;
  const cols=mixed?fit('c2'):kind==='sort'?(items.some(x=>x.w.length>11)?'c3':'c4'):kind==='line'?(items.some(x=>x.long)?'c1':items.some(x=>x.noLine)?'c4':'c2'):kind==='mor'?'c3':kind==='snt'?'c1':kind==='ins'?(items.some(x=>x.phr)?'c1':items.some(x=>x.chk)?'c2':items.some(x=>x.w.length>11)?'c3':'c4'):kind==='word'?'c1':kind==='ch'?'c2':kind==='col'?(Math.max(...items.map(x=>String(fmt(x.ans)).length))>(tight?4:6)?'c3':'c4'):fit(kind==='expr'?'c2':kind==='own'?(ownLen>40?'c1':ownLen>16?'c2':'c3'):'c3');

  const padX=!D?7:D.lv===3?8:9;const avail=Math.floor((100-2*padX-2*CELL)/CELL);
  const cellItems=items.filter(cellable);const k0=cellItems.length?Math.max(...cellItems.map(cellWidth)):0;
  const nOld={c1:1,c2:2,c3:3,c4:4}[cols]||2;
  const k=k0?Math.min(k0,avail):Math.floor((avail+2)/nOld)-2;
  const nCols=Math.max(1,Math.floor((avail+2)/(k+2)));
  const gridStyle=`grid-template-columns:repeat(${nCols},calc(var(--c) * ${k}))`;
  const spanAll=it=>!cellable(it)&&(cellItems.length>0||it.type==='word');
  const title=answers?'Ответы':topic.t;

  const subText=answers?esc(topic.t):esc(topic.L[level].n)+'. '+(mixed?'Лист из нескольких частей, у каждой своё указание.':esc(instr(items[0])));
  const fields=`<div class="sh-head"><div class="fld">Имя: <b>${esc(studentName||'')}</b></div><div class="fld">Дата: </div>
    <div class="fld">${gradeWord(topic.grade)} · ${lvl}</div><div class="fld">Вариант <b class="num">${seed}</b></div></div>`;
  const rule=topic.rule&&!answers&&!V.noRule?`<div class="sh-rule"><b>Правило</b><span>${esc(topic.rule[0])}</span><i>${esc(topic.rule[1])}</i></div>`:'';
  const titleH=`<div class="sh-title">${answers?'<span class="key-stamp">Ключ</span> ':''}${D&&D.lv===3?stkSVG(D.theme.stk[0],'tico'):''}${esc(title)}</div>`;
  const head=(!D?`${fields}<div>${titleH}</div><div class="sh-sub">${subText}</div>`
    :D.lv===1?`${fields}<div class="hero"><div class="hero-art">${D.img?artImg(D.img.top):charSVG(D.char)}</div><div class="hero-r">${titleH}<div class="bubble">${subText}</div></div></div>`
    :D.lv===2?`<div class="band"><div class="band-t">${titleH}<div class="sh-sub">${subText}</div></div><div class="band-art">${D.img?artImg(D.img.char):charSVG(D.char)}</div></div>${fields}`
    :`${fields}<div>${titleH}</div><div class="sh-sub">${subText}</div>`)+rule;
  const mini=`<div class="sh-mini">${D&&D.lv<=2?stkSVG(D.theme.stk[1],'gico'):''}<b>${esc(studentName||'')}</b><span>${answers?'Ключ · ':''}${esc(topic.t)} · продолжение</span></div>`;
  /* задания идут строкой с переносом; ширина — по самому широкому заданию своей части, поэтому в части они встают ровными колонками */

  /* заголовок части держится вместе со своим первым заданием */

    const estH=it=>{if(it.tbl)return 10;if(it.type==='col'){const r=colRows(it);return 3+(r.parts?r.parts+1:0)}return cellable(it)?1:it.type==='word'?6:it.type==='grid'?it.h+3:it.svg?6:it.type==='ch'?3:1};
    const isSpan=it=>it.type==='word'||it.type==='ch'&&!it.svg||it.tbl||it.type==='snt'||it.phr||it.long;
    /* примерная ширина задания в клетках: цифры и знаки по клетке, буквы примерно по полклетки */
    const estW=it=>{if(cellable(it))return cellWidth(it);if(it.type==='grid')return it.w+4+Math.max(0,8-(it.w+2));if(it.svg||it.type==='ch')return 99;
      const q=it.type==='own'?it.q:it.type==='cmp'?it.left+' ◯ '+it.right:plainQ(it);let w=2;for(const ch of String(q))w+=/[\d+−×:=<>()◯□-]/.test(ch)?1:/\s/.test(ch)?0.3:0.5;return Math.ceil(w)+ansLen(it)};
    /* сколько колонок заданий помещается рядом с картинкой шириной pic клеток */
    const kAt=list=>Math.max(0,...list.filter(cellable).map(cellWidth));
    const sideFit=(pic,kk)=>{const w=avail-pic-2;if(w<6)return null;if(kk&&kk<=w)return{n:Math.floor((w+2)/(kk+2)),kw:kk,w,pic};return kk?null:{n:1,kw:w,w,pic}};
    const sg=(f,html)=>`<div class="sgrid" style="width:calc(var(--c) * ${f.w})">${html}</div>`;
    /* большой лист — примерно больше полутора страниц: на нём картинок больше */
    /* примерная высота листа в клетках: где начинается каждое задание */
    const startY=[];let tot=0;{let col=0,rh=0;const close=()=>{if(col){tot+=rh+1;col=0;rh=0}};
      items.forEach((it,i)=>{const g=mixed&&newGroup(it,i);if(g||isSpan(it))close();if(g)tot+=2;startY[i]=tot+(col?0:0);
        if(isSpan(it)){tot+=estH(it)+1;return}const kk=kOf[gid[i]]||k,n=Math.max(1,Math.floor((avail+2)/(kk+2)));
        rh=Math.max(rh,estH(it));if(++col>=n)close()});close();startY[items.length]=tot}
    const big=tot>34||(mixed&&items.length>=12);
    /* блок «картинка сбоку, задания рядом»: берёт задания с конца отрезка [lo, hi), сколько поместится по высоте картинки */

      const pic=`<div class="tB" style="width:calc(var(--c) * ${F.pic})">${extra||''}${artImg(src)}</div>`;
      return{t,html:`<div class="tailG${left?' left':''}" style="width:calc(var(--c) * ${avail})">${left?pic:''}${sg(F,pieces.slice(t,hi).join(''))}${left?'':pic}</div>`}};
    const alone=(src,extra)=>src?`<div class="scene2">${extra||''}${artImg(src)}</div>`:'';
    const say=D.img&&D.img.say?artImg(D.img.say,'say'):'';
    /* шапка «Сказки»: первая картинка слева, рядом название и первые задания */
    let M=0,headPiece='';
    if(D.lv===1){
      const kH=kAt(items.slice(0,8));const arT=D.img?D.img.arTop:1;
      const want=Math.max(8,Math.min(16,Math.round(13*arT)));
      let F=null;for(let pic=want;pic>=8&&!F;pic--)F=sideFit(pic,kH);
      if(F){
        const wP=F.pic,imgH=Math.round(wP/arT);
        const tLines=Math.ceil(String(title).length/Math.max(4,F.w*1.3)),bLines=Math.ceil(subText.length/Math.max(8,F.w*2.2));

        const art=D.img?artImg(D.img.top):charSVG(D.char);
        headPiece=`<div class="heroG" style="width:calc(var(--c) * ${avail})"><div class="hA" style="width:calc(var(--c) * ${wP});min-height:calc(var(--c) * ${imgH})">${art}</div><div class="hR"><div class="hT">${titleH}<div class="bubble">${subText}</div></div>${sg(F,pieces.slice(0,M).join(''))}</div></div>`;

    const n=items.length,img=D.img;
    const blocks=[];
    /* «Сказка»: на уроке и проверочной три картинки — в начале, в середине (справа) и в конце (слева);
       на обычном листе — вторая в конце. «Яркий»: картинка в шапке, на большом листе ещё одна в конце */

  const cls=(D?`lv${D.lv} fr-${D.frame}${D.bw?' bw':''}`:'')+(topic.subject==='rus'?' ru':'');
  const pal=D?(D.bw?['#555','#999','#f2f2f2','#777']:D.pal):null;
  const style=D?`--p1:${pal[0]};--p2:${pal[1]};--p3:${pal[2]};--p4:${pal[3]}`:'';
  const deco=k=>{if(!D)return'';const r=rng(D.seed*31+k*7+1);let h='<div class="fr"></div>';

}

/* раскладка по страницам A4: задания добавляются по одному, пока страница не переполнится */
function paginate(host,items,o){
  const s=sheetParts(items,o);host.innerHTML='';
  let pn=0;
  const newPage=first=>{const d=document.createElement('div');d.className='sheet page'+(o.answers?' ans':'')+' '+s.cls;d.setAttribute('style',s.style);
    d.innerHTML=`${s.deco(pn++)}<div class="sheet-in">${first?s.head:s.mini}<div class="sh-items" style="${s.gridStyle}"></div><div class="sh-foot"><span>${s.footL}</span><span class="pg"></span></div></div>`;
    host.appendChild(d);return d};
  let page=newPage(true);
  const over=pg=>{const inner=pg.querySelector('.sheet-in');return inner.scrollHeight>pg.clientHeight+1};
  /* на каждой печатной странице — картинка: если её нет, она встаёт в свободное место внизу страницы */
  let fk=0;
  const fill=pg=>{if(!s.pics.length||pg.querySelector('img.pic'))return;
    const grid=pg.querySelector('.sh-items'),foot=pg.querySelector('.sh-foot'),c=pg.clientWidth*CELL/100;
    const n=Math.min(14,Math.floor((foot.getBoundingClientRect().top-grid.getBoundingClientRect().bottom)/c)-2);if(n<6)return;
    grid.insertAdjacentHTML('beforeend',`<div class="pfill${fk%2?' left':''}" style="height:calc(var(--c) * ${n})">${artImg(s.pics[fk%s.pics.length])}</div>`);fk++;
    if(over(pg))grid.lastElementChild.remove()};

    let grid=page.querySelector('.sh-items');const before=grid.children.length;
    grid.insertAdjacentHTML('beforeend',html);snapCells(page.parentNode);
    if(over(page)&&before>0){const n=grid.children.length-before;for(let k=0;k<n;k++)grid.lastElementChild.remove();
      fill(page);page=newPage(false);page.querySelector('.sh-items').insertAdjacentHTML('beforeend',html);snapCells(page.parentNode)}

  fill(page);
  const pages=[...host.children];pages.forEach((pg,k)=>pg.querySelector('.pg').textContent=`Страница ${k+1} из ${pages.length} · ${s.footR}`);
  return pages.length;
}

  try{const r=await pbT.collection('workspaces').getOne(ACC.wsId);const srv=prepState(r.data);
    if(srv&&(srv.savedAt||0)>(S.savedAt||0)&&!['player'].includes(V.screen)){setState(srv);try{localStorage.setItem(KEY_NOW,JSON.stringify(S))}catch(e){}render()}}catch(e){}

/* сданные в кабинете работы попадают в карточку ученика */
let lastSync=0;
async function syncResults(force){
  if(!ACC.user||(!force&&Date.now()-lastSync<20000))return;lastSync=Date.now();
  try{
    const list=await pbT.collection('assignments').getFullList({filter:pbT.filter('tutor = {:id} && status = "done"',{id:ACC.user.id}),fields:'id,code,result'});
    let n=0;
    for(const r of list){const h=S.assignments.find(a=>a.code===r.code);
      if(h&&h.status!=='сдано'&&r.result){const d=r.result;recordResult(h,{correct:d.k,total:d.n,answered:d.a,time:d.tm,log:d.l||[],mistakes:d.m||[]});n++}}
    if(n&&['students','student','works','work'].includes(V.screen))render();
  }catch(e){}
}

/* ---------- аккаунт ученика: логин и пароль создаются при добавлении ---------- */
const firstName=st=>st.first||st.name.split(/\s+/)[0];
const genLogin=st=>(translit(firstName(st)).slice(0,10)||'uchenik')+'-'+(1000+Math.floor(Math.random()*9000));
const genPin=()=>String(100000+Math.floor(Math.random()*900000));
async function ensureAccount(st){
  if(!ACC.user)return null;if(st.acc&&st.acc.id)return st.acc;
  for(let k=0;k<6;k++){
    const login=genLogin(st),pin=genPin();
    try{
      const r=await pbT.collection('students').create({tutor:ACC.user.id,login,password:pin,passwordConfirm:pin,
        name:firstName(st),surname:st.last||st.name.split(/\s+/).slice(1).join(' '),grade:st.grade,tutorName:ACC.user.name||'',localId:st.id});
      st.acc={id:r.id,login,pin};save();return st.acc;
    }catch(e){if(!(e&&e.status===400))throw e}
  }
  throw new Error('login');
}
function accessText(st){const a=st.acc;
  return `Привет, ${firstName(st)}! Твои задания теперь здесь:\n${CAB_URL()}#${a.login}\n\nЛогин: ${a.login}\nПароль: ${a.pin}`}
async function accessModal(st,fresh){
  if(!ACC.user){modal(`<h2>Кабинет ученика</h2><p style="margin:0">Кабинет ученика работает в аккаунте репетитора. Зарегистрируйтесь — ученики из демо при этом не переносятся.</p>
    <div class="modal-actions"><button class="btn quiet" id="cl">Закрыть</button><button class="btn primary" id="sg">Зарегистрироваться</button></div>`,()=>{
      document.getElementById('cl').onclick=close;document.getElementById('sg').onclick=()=>{close();go({screen:'auth',authMode:'signup'})}});return}
  modal(`<h2>${fresh?'Ученик добавлен':'Доступ для ученика'}</h2><p class="hint" style="margin:0">Создаём вход для ученика…</p>`);
  try{await ensureAccount(st)}catch(e){
    modal(`<h2>${fresh?'Ученик добавлен':'Доступ для ученика'}</h2><p style="margin:0">Нет связи с сервером, поэтому логин и пароль пока не созданы. Задания ученику можно делать уже сейчас, а доступ откройте позже: меню ⋯ → «Доступ для ученика».</p>
      <div class="modal-actions"><button class="btn primary" id="cl">Понятно</button></div>`,()=>{document.getElementById('cl').onclick=close});return}
  const draw=()=>modal(`<h2>${fresh?'Ученик добавлен':'Доступ для ученика'}</h2>
    <p style="margin:0">Отправьте это сообщение ученику или родителям — в мессенджер или по SMS. Задания можно создавать уже сейчас, даже если ученик ещё не входил.</p>
    <textarea id="amsg" class="amsg" readonly rows="6">${esc(accessText(st))}</textarea>
    <div class="modal-actions"><button class="btn quiet" id="np">Новый пароль</button><button class="btn quiet" id="cl">Готово</button><button class="btn primary" id="cp">Скопировать сообщение</button></div>`,()=>{
      document.getElementById('cl').onclick=close;
      const cp=document.getElementById('cp');cp.onclick=()=>copyText(document.getElementById('amsg'),cp,'Скопировано');
      const np=document.getElementById('np');np.onclick=async()=>{np.disabled=true;np.textContent='Меняем…';const pin=genPin();
        try{await pbT.collection('students').update(st.acc.id,{password:pin,passwordConfirm:pin});st.acc.pin=pin;save();draw()}
        catch(e){np.disabled=false;np.textContent='Не вышло, ещё раз'}};
    });
  draw();
}
function copyText(el,btn,okText){const ok=()=>{btn.textContent=okText};
  if(navigator.clipboard)navigator.clipboard.writeText(el.value).then(ok,()=>{el.select()});else{el.select();try{document.execCommand('copy');ok()}catch(e){}}}

/* ---------- экран входа репетитора ---------- */
const OAUTH_NAMES={vk:'VK ID',yandex:'Яндекс ID',google:'Google',apple:'Apple'};
let OAUTH=null;
async function loadOAuth(){if(OAUTH||!pbT)return;try{const m=await pbT.collection('users').listAuthMethods();OAUTH=(m.oauth2&&m.oauth2.enabled?m.oauth2.providers:[])||[]}catch(e){OAUTH=[]}
  if(V.screen==='auth')render()}
function authErr(e,signup){const d=e&&e.response&&e.response.data||{};
  if(!e||e.status===0)return'Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.';
  if(signup&&d.email&&/unique|exists/i.test(d.email.code+d.email.message))return'Эта почта уже зарегистрирована. Войдите.';
  if(d.email)return'Проверьте адрес почты.';
  if(d.password)return'Пароль — не короче 8 символов.';
  return signup?'Не получилось зарегистрироваться. Попробуйте ещё раз.':'Неверная почта или пароль.'}
function viewAuth(){
  const su=V.authMode==='signup';
  if(OAUTH===null)loadOAuth();
  const prov=(OAUTH||[]).filter(p=>OAUTH_NAMES[p.name]);
  app.innerHTML=`<div class="auth"><div class="auth-card">
    <h1>${su?'Регистрация':'Вход'}</h1>
    <p class="auth-sub">${su?'Кабинет репетитора: ученики, задания и результаты в одном месте.':'Кабинет репетитора.'}</p>
    ${prov.length?`<div class="oauth">${prov.map(p=>`<button type="button" class="btn oa oa-${p.name}" data-p="${p.name}">${esc(OAUTH_NAMES[p.name])}</button>`).join('')}</div><div class="or"><span>или по почте</span></div>`:''}
    <form id="af" novalidate>
      ${su?'<div class="field"><label class="label" for="an">Имя</label><input id="an" type="text" autocomplete="name" placeholder="Как к вам обращаться"></div>':''}
      <div class="field"><label class="label" for="ae">Почта</label><input id="ae" type="email" autocomplete="email" inputmode="email" required></div>
      <div class="field"><label class="label" for="ap">Пароль</label><input id="ap" type="password" autocomplete="${su?'new-password':'current-password'}" minlength="8" required aria-describedby="aph"><span class="hint" id="aph">${su?'Не короче 8 символов':''}</span></div>
      <p class="auth-err" id="aerr" role="alert"></p>
      <button class="btn primary wide" id="ago" type="submit">${su?'Зарегистрироваться':'Войти'}</button>
    </form>
    <p class="auth-sw">${su?'Уже есть аккаунт? <button type="button" class="btn link" id="sw">Войти</button>':'Нет аккаунта? <button type="button" class="btn link" id="sw">Зарегистрироваться</button>'}</p>
    <button type="button" class="btn link demo-l" id="demo">Посмотреть без регистрации</button>
  </div></div>`;
  const $=id=>document.getElementById(id),err=$('aerr');
  $('sw').onclick=()=>go({screen:'auth',authMode:su?'login':'signup'});
  $('demo').onclick=startDemo;
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{err.textContent='';b.disabled=true;
    try{await pbT.collection('users').authWithOAuth2({provider:b.dataset.p});await startTutor()}
    catch(e){err.textContent='Вход через '+OAUTH_NAMES[b.dataset.p]+' не удался. Попробуйте ещё раз.';b.disabled=false}});
  $('af').onsubmit=async e=>{e.preventDefault();err.textContent='';
    const email=$('ae').value.trim(),pw=$('ap').value,name=su?$('an').value.trim():'';
    if(!/^\S+@\S+\.\S+$/.test(email)){err.textContent='Проверьте адрес почты.';return}
    if(pw.length<8){err.textContent='Пароль — не короче 8 символов.';return}
    if(!pbT){err.textContent='Нет связи с сервером. Проверьте интернет и обновите страницу.';return}
    const btn=$('ago');btn.disabled=true;btn.textContent=su?'Регистрируем…':'Входим…';
    try{
      if(su)await pbT.collection('users').create({email,password:pw,passwordConfirm:pw,name});
      await pbT.collection('users').authWithPassword(email,pw);await startTutor();
    }catch(x){err.textContent=authErr(x,su);btn.disabled=false;btn.textContent=su?'Зарегистрироваться':'Войти'}
  };
  ($(su?'an':'ae')).focus();
}

function viewCab(){
  const me=CAB.me||pbS.authStore.record||{};
  if(CAB.items===null){app.innerHTML=`<div class="cab"><p class="hint">Загружаем задания…</p></div>`;return}
  const pick=(seed)=>{const L=THEMES.filter(t=>artList(t).length);const t=L[seed%L.length];return artSet(t,seed)};
  const card=r=>{const d=r.payload||{},done=r.status==='done',res=r.result||{};const a=pick(d.s||7);
    return `<button class="ctask${done?' done':''}" data-id="${r.id}"${done?' disabled':''}>
      <span class="ct-pic">${a?`<img src="${a.char}" alt="" loading="lazy">`:''}</span>
      <span class="ct-t"><b>${esc(r.title||d.t||'Задание')}</b><small>${done?`Сделано · ${res.k} из ${res.n}`:`Новое · ${ago(Date.parse(r.created))}`}</small></span>
      ${done?`<span class="ct-score num">${Math.round(res.k/res.n*100)}%</span>`:'<span class="btn primary small">Решать</span>'}</button>`};
  const fresh=CAB.items.filter(r=>r.status!=='done'),done=CAB.items.filter(r=>r.status==='done');
  app.innerHTML=`<div class="cab">
    <div class="cab-head"><div><h1>Привет, ${esc(me.name||'')}!</h1>${me.tutorName?`<p>Твой репетитор: ${esc(me.tutorName)}</p>`:''}</div>
      <button class="btn link" id="cout">Выйти</button></div>
    ${CAB.err?`<p class="auth-err">${esc(CAB.err)}</p>`:''}
    <h2 class="cab-h">${fresh.length?'Новые задания':'Новых заданий нет'}</h2>
    ${fresh.length?`<div class="ctasks">${fresh.map(card).join('')}</div>`:'<p class="hint">Когда репетитор пришлёт задание, оно появится здесь.</p>'}
    ${done.length?`<h2 class="cab-h">Сделано</h2><div class="ctasks">${done.map(card).join('')}</div>`:''}
  </div>`;
  app.querySelectorAll('.ctask[data-id]:not(.done)').forEach(b=>b.onclick=()=>startCab(CAB.items.find(r=>r.id===b.dataset.id)));
  document.getElementById('cout').onclick=()=>{pbS.authStore.clear();CAB.items=null;V={screen:'cablogin'};render()};

function startCab(r){const d=r.payload;
  P={h:{code:d.c,level:0},t:{t:d.t,grade:d.g,sheet:d.mix},name:d.n,remote:true,cab:r.id,items:generate(d.p,d.s),i:0,input:'',correct:0,streak:0,score:0,mistakes:[],log:[],start:Date.now(),fb:null,lock:false};
  V={screen:'player'};render();window.scrollTo({top:0});
}
/* результат уходит репетитору; без связи — ждёт в браузере и уходит при следующем входе */
const CAB_PENDING='kletka-cab-pending';
async function sendCab(id,res){
  try{await pbS.collection('assignments').update(id,{status:'done',result:res});return true}
  catch(e){try{const q=JSON.parse(localStorage.getItem(CAB_PENDING)||'[]');q.push({id,res});localStorage.setItem(CAB_PENDING,JSON.stringify(q))}catch(x){}return false}
}
async function flushCab(){let q=[];try{q=JSON.parse(localStorage.getItem(CAB_PENDING)||'[]')}catch(e){}
  if(!q.length)return;localStorage.removeItem(CAB_PENDING);for(const x of q)await sendCab(x.id,x.res)}

/* ---------- экраны ---------- */
const app=document.getElementById('app');
/* каждый экран — отдельный шаг в истории браузера: «Назад» возвращает на прошлый экран, а не уводит с сайта */
let popping=false;
const navKey=v=>[v.screen,v.studentId,v.topicId,v.code].join('|');
function go(v){const before=navKey(V);V={...V,...v};render();window.scrollTo({top:0});
  if(popping||STUDENT_MODE||['player','done'].includes(V.screen))return;
  try{const st={V:JSON.parse(JSON.stringify(V))};if(navKey(V)!==before)history.pushState(st,'');else history.replaceState(st,'')}catch(e){}}
window.addEventListener('popstate',e=>{if(STUDENT_MODE||!e.state||!e.state.V)return;
  mroot.innerHTML='';popping=true;V=e.state.V;P=null;
  if(V.studentId&&!student(V.studentId))V={screen:'students'};
  if(V.topicId&&!TOPICS[V.topicId]&&['topic','print'].includes(V.screen))V={...V,screen:'student'};
  render();popping=false});

function bindAcct(){const $=id=>document.getElementById(id);
  if($('acctBtn'))$('acctBtn').onclick=()=>{V.acctMenu=!V.acctMenu;crumbs()};

function crumbs(){
  const c=document.getElementById('crumbs');const parts=[];
  if(CABINET||['auth','cablogin','cab'].includes(V.screen)){c.innerHTML='';document.getElementById('steps').innerHTML='';return}
  const steps0=document.getElementById('steps');
  if(SEC_T[V.screen]){c.innerHTML=`<span class="cur">${SEC_T[V.screen]}</span>`;steps0.innerHTML=acctHTML();bindAcct();return}
  const st=V.studentId&&student(V.studentId);
  if(V.screen==='students'){parts.push('<span class="cur">Ученики</span>')}
  else{parts.push('<button data-go="students">Ученики</button>')}
  if(st&&V.screen!=='students'&&!['player','done'].includes(V.screen)){parts.push('›');parts.push(V.screen==='student'?`<span class="cur">${esc(st.name)}</span>`:`<button data-go="student">${esc(st.name)}</button>`)}
  if(V.topicId&&['topic','print'].includes(V.screen)){parts.push('›');parts.push(V.screen==='topic'?`<span class="cur">${esc(TOPICS[V.topicId].t)}</span>`:`<button data-go="topic">${esc(TOPICS[V.topicId].t)}</button>`)}
  if(V.screen==='print'){parts.push('›');parts.push('<span class="cur">Печать</span>')}
  if(V.screen==='builder'){parts.push('›');parts.push('<span class="cur">Своя тема</span>')}
  if(V.screen==='gallery'){parts.push('›');parts.push('<span class="cur">Сюжеты оформления</span>')}
  if(V.screen==='works'){parts.push('›');parts.push('<span class="cur">Работы и домашки</span>')}
  if(V.screen==='work'){parts.push('›');parts.push('<button data-go="works">Работы и домашки</button>');parts.push('›');parts.push(`<span class="cur">${esc(V.code||'')}</span>`)}
  if(['player','done'].includes(V.screen)){parts.length=0;parts.push('<span class="cur">Экран ученика</span>')}
  c.innerHTML=parts.join(' ');
  c.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go({screen:b.dataset.go}));
  const steps=document.getElementById('steps');steps.innerHTML=acctHTML();bindAcct();return;
  const n={students:0,student:1,topic:2,print:3}[V.screen];

}

/* текущая тема хранится отдельно по каждому предмету */
const CK=subj=>subj==='rus'?'currentRus':'current';
const curOf=(st,subj)=>st[CK(subj)];

function viewStudents(){
  const cards=S.students.map(s=>{
    const cur=TOPICS[s.current];const m=cur?mastery(s.id,cur.id):{cls:''};
    const rp=s.subjects.includes('rus')?trackPos(s,'rus'):null;const rus=rp&&rp.i>=0?TOPICS[rp.tr[rp.i]]:null;
    const hw=S.assignments.filter(a=>a.studentId===s.id&&a.status==='выдано').length;
    const last=S.attempts.filter(a=>a.studentId===s.id).sort((a,b)=>b.date-a.date)[0];
    return `<button class="st" data-id="${s.id}">
      <div class="st-top"><div><h3>${esc(s.name)}</h3><div class="grade">${gradeWord(s.grade)}</div></div>${hw?`<span class="wait-chip">ждём ${hw}</span>`:''}</div>
      <div class="st-now"><span class="t">${cur?esc(cur.t):'Тема не выбрана'}</span>${m.pct!=null?`<span class="pct num">${m.pct}%</span>`:''}</div>
      ${(()=>{const nx=nextLesson(s.id),b=money(s).bal;return nx||b<0?`<div class="st-foot2">${nx?`<span>${whenTxt(nx.at)}</span>`:'<span></span>'}${b<0?`<span class="chip bad num">долг ${rub(-b)}</span>`:''}</div>`:''})()}
    </button>`}).join('');

/* порядок тем: по математике встроенная программа 1–4 класса, свои темы встают в конец своего класса;
   по русскому пока только свои темы, по классам */
function trackIds(subj='math'){const ids=[];for(const g of [1,2,3,4]){if(PROG[subj])for(const sec of PROG[subj][g])for(const t of sec.topics)if(!t.soon)ids.push(t.id);
  for(const c of S.customTopics)if(c.subject===subj&&c.grade===g&&!c.review&&!c.sheet)ids.push(c.id)}return ids}
function trackPos(st,subj='math'){const tr=trackIds(subj);if(!tr.length)return{tr,i:-1};let i=tr.indexOf(curOf(st,subj));
  if(i<0){i=tr.findIndex(id=>TOPICS[id].grade>=st.grade&&!TOPICS[id].custom);if(i<0)i=tr.findIndex(id=>TOPICS[id].grade>=st.grade);if(i<0)i=0}
  return{tr,i}}
function makeReview(st,subj='math'){
  const {tr,i}=trackPos(st,subj);const prev=tr.slice(0,i);
  const weak=prev.map(id=>({id,m:mastery(st.id,id)})).filter(x=>x.m.pct!=null&&x.m.pct<85).sort((a,b)=>a.m.pct-b.m.pct).map(x=>x.id);
  const pick=weak.slice(0,3);
  for(let k=prev.length-1;k>=0&&pick.length<3;k--)if(!pick.includes(prev[k]))pick.push(prev[k]);
  pick.sort((a,b)=>tr.indexOf(a)-tr.indexOf(b));
  const parts=pick.map(id=>{const t=TOPICS[id];return{tid:id,p:t.L[Math.min(1,t.L.length-1)].p}});
  const rv={id:'rev-'+Date.now(),review:true,custom:true,subject:subj,grade:st.grade,section:'Повторение',t:'Повторение пройденного',
    L:[{n:`Микс из ${pick.length} ${pick.length===1?'темы':'тем'}`,d:pick.map(id=>TOPICS[id].t).join(' · '),p:{kind:'mix',parts,per:4,count:parts.length*4}}]};
  S.customTopics=S.customTopics.filter(c=>!(c.review&&c.forStudent===st.id&&!S.assignments.some(a=>a.topicId===c.id)));
  rv.forStudent=st.id;S.customTopics.push(rv);TOPICS=allTopics();save();openTopic(rv.id);
}
function deleteStudent(st){
  if(ACC.user&&st.acc&&st.acc.id)pbT.collection('students').delete(st.acc.id).catch(()=>{});
  S.students=S.students.filter(s=>s.id!==st.id);
  S.attempts=S.attempts.filter(a=>a.studentId!==st.id);
  S.assignments=S.assignments.filter(a=>a.studentId!==st.id);
  S.lessons=S.lessons.filter(l=>l.sid!==st.id);S.payments=S.payments.filter(p=>p.sid!==st.id);
  S.customTopics=S.customTopics.filter(c=>c.forStudent!==st.id);
  TOPICS=allTopics();save();go({screen:'students',studentId:null,confirmStDel:false});
}

/* ---------- поиск темы: слова с опечатками, синонимы, подтемы учебника и пример вида 37 + 48 ---------- */
const progSec=id=>{for(const subj in PROG)for(const g in PROG[subj])for(const sec of PROG[subj][g])if(sec.topics.some(t=>t.id===id))return sec;return null};
const partOf=id=>{const sec=progSec(id);return sec?sec.part:1};
const secOf=id=>{const sec=progSec(id);return sec?sec.s:TOPICS[id]?TOPICS[id].section:''};
const normT=x=>String(x).toLowerCase().replace(/ё/g,'е').replace(/[«»"(),.:;!?…]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function tokScore(tk,words){let best=0;
  for(const w of words){if(/^\d+$/.test(tk)){if(w===tk)best=3;continue}
    if(w.startsWith(tk)){best=Math.max(best,3);continue}
    if(tk.length>=4&&(lev(tk,w.slice(0,tk.length))<=1||lev(tk,w)<=(tk.length>=7?2:1)))best=Math.max(best,2)}
  return best}
function exampleTopic(a,op,b){
  const t1=n=>n<10,rt=n=>n%10===0;
  if(op==='+'){const s2=a+b;
    if(s2<=10)return Math.min(a,b)<=4?['g1-add14',{k:[Math.min(a,b)]}]:['g1-add59'];
    if(t1(a)&&t1(b))return['g1-addc',{k:[Math.min(a,b)]}];
    if(s2<=20)return['g1-teen'];
    if(s2<=100){if(t1(a)||t1(b)){const u=(t1(a)?b:a)%10,k=t1(a)?a:b;return u+k===10?['g2-oral',{forms:['u26p4']}]:u+k>10?['g2-oral',{forms:['u26p7']}]:['g2-oral',{forms:['u36p2','u36p20']}]}
      if(rt(a)||rt(b))return['g2-oral',{forms:['u36p2','u36p20']}];
      if(s2===100)return['g2-coladd',{kind:'forms',forms:['col100']}];
      if(a%10+b%10===10)return['g2-coladd',{kind:'forms',forms:['colRound']}];
      return a%10+b%10>10?['g2-coladd',{kind:'column',ops:['+'],lo:30,hi:99,digits:2,carry:'with',column:true}]:['g2-coladd',{kind:'column',ops:['+'],lo:30,hi:99,digits:2,carry:'without',column:true}]}
    if(s2<=1000)return rt(a)&&rt(b)?['g3-oral1000']:['g3-col1000'];
    return['g4-addsub']}
  if(op==='-'){if(b>a)return null;if(a<=10)return['g1-sub10'];
    if(a>10&&a<=18&&t1(b)&&a%10<b)return['g1-subc',{from:[a]}];
    if(a<=20)return['g1-teen'];
    if(a<=100){if(t1(b))return rt(a)?['g2-oral',{forms:['u30m7']}]:a%10<b?['g2-oral',{forms:['u35m7']}]:['g2-oral',{forms:['u36m2','u36m20']}];
      if(rt(b))return['g2-oral',{forms:['u36m2','u36m20']}];
      if(rt(a))return['g2-oral',{forms:['u60m24']}];
      return a%10<b%10?['g2-colsub',{kind:'column',ops:['-'],lo:30,hi:99,digits:2,carry:'with',column:true}]:['g2-colsub',{kind:'column',ops:['-'],lo:30,hi:99,digits:2,carry:'without',column:true}]}
    if(a<=1000)return rt(a)&&rt(b)?['g3-oral1000']:['g3-col1000'];
    return['g4-addsub']}
  if(op==='×'){if(a<=1||b<=1)return['g3-zero'];if(a===10||b===10)return['g2-mul10'];
    if(a<=9&&b<=9){const k=Math.max(a,b);return['g2-table',{tab:[k,k]}]}
    if(a*b<=100&&Math.max(a,b)<=99)return rt(a)||rt(b)?['g3-extra',{kind:'forms',forms:['roundMul']}]:['g3-extra',{kind:'forms',forms:['m2x1','m1x2']}];
    if(a*b<1000)return a%100===0||b%100===0?['g3-oralmd']:['g3-colmul'];
    if(a<10||b<10)return['g4-mul1'];if(a%10===0&&b%10===0)return['g4-mul0',{forms:['mul0']}];return['g4-mul2']}
  if(b===0)return null;if(a===0||b===1||a===b)return['g3-zero'];
  if(a%b){if([10,100,1000].includes(b)&&a>=1000)return['g4-mul0',{forms:['remDiv10']}];if(b>=10)return['g4-div2',{forms:['remBy2']}];return['g3-rem']}
  const q=a/b;if(b===10)return['g2-mul10'];if(b<=9&&q<=9)return['g2-table',{tab:[b,b]}];
  if(a<=99)return b>=10?(rt(a)&&rt(b)?['g3-extradiv',{kind:'forms',forms:['divRound']}]:['g3-extradiv',{kind:'forms',forms:['d2x2']}]):['g3-extradiv',{kind:'forms',forms:['d2x1']}];

function parseExample(q){const m=String(q).replace(/\s+/g,'').match(/^(\d+)([+\-−×xх*:÷\/])(\d+)/i);if(!m)return null;
  const a=+m[1],b=+m[3],o=m[2],op=o==='+'?'+':/[-−]/.test(o)?'-':/[×xх*]/i.test(o)?'×':'÷';
  const r=exampleTopic(a,op,b);if(!r||!TOPICS[r[0]])return null;
  const t=TOPICS[r[0]],key=r[1]?JSON.stringify(r[1]):null;const si=key?(t.sub||[]).findIndex(x=>x.p&&JSON.stringify(x.p)===key):-1;
  return{tid:r[0],si,over:r[1]||null,ex:`${a} ${sym(op)} ${b}`}}
function searchTopics(q,subj){
  const out=[];const ex=subj==='math'?parseExample(q):null;if(ex)out.push({...ex,score:100});
  const toks=normT(q).split(' ').filter(t=>/^[a-zа-я0-9]+$/.test(t)&&(t.length>=2||/^\d+$/.test(t)));
  if(!toks.length||(ex&&toks.every(t=>/^\d+$/.test(t))))return out;
  const ids=trackIds(subj);
  for(const id of ids){const t=TOPICS[id];const syn=normT((t.syn||[]).join(' ')+' '+t.t).split(' ');
    let best=null;
    [{txt:t.t,si:-1},...(t.sub||[]).map((x,k)=>({txt:x.n||x,si:k}))].forEach(e=>{const words=[...normT(e.txt).split(' '),...syn];let sc=0;
      for(const tk of toks){const v=tokScore(tk,words);if(!v)return;sc+=v}
      const own=normT(e.txt).split(' ');sc+=toks.filter(tk=>tokScore(tk,own)).length;if(e.si<0)sc+=.5;
      if(!best||sc>best.score)best={tid:id,si:e.si,score:sc}});
    if(best&&!(ex&&best.tid===ex.tid))out.push(best)}
  return out.sort((a,b)=>b.score-a.score).slice(0,15)}

  const q=(V.q||'').trim();if(!q){box.hidden=true;main.hidden=!V.allOpen;return}

  box.innerHTML=res.length?res.map((r,k)=>{const t=TOPICS[r.tid],sb=r.si>=0?t.sub[r.si]:null;
    return `<button class="sr" data-k="${k}"><span class="sr-t">${r.ex?`<span class="chip ok">по примеру ${esc(r.ex)}</span> `:''}${esc(sb?(sb.n||sb):t.t)}</span>

/* печать: листы раскладываются заново ровно по ширине А4 (на экране часть заданий другого размера),
   на бумагу идёт только этот невидимый набор страниц */
async function printPages(items,o){
  let host=document.getElementById('printHost');if(host)host.remove();
  host=document.createElement('div');host.id='printHost';document.body.appendChild(host);
  paginate(host,items,o);
  await Promise.all([...host.querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  paginate(host,items,o);
  const done=()=>{host.remove();removeEventListener('afterprint',done)};
  addEventListener('afterprint',done);window.print()}

const KINDS=[['examples','Примеры','7 + 5 = □'],['window','Окошки','7 + □ = 12'],['compare','Сравнение','7 + 5 ◯ 11'],['column','Столбик','47 + 38 в столбик'],['eq','Уравнения','x + 5 = 12']];
const OPS=[['+','сложение'],['-','вычитание'],['×','умножение'],['÷','деление']];

function buildTopic(b){
  const base={id:'c'+Date.now(),custom:true,subject:b.subject,grade:b.grade,section:MY,t:b.name.trim()||'Новая тема'};
  if(b.mode==='own'){const {list}=parseList(b.text);const c=Math.min(b.count,list.length);
    return{...base,L:[{n:'Свой список',d:`${list.length} заданий, порядок перемешивается`,p:{kind:'own',count:c,list}}]}}
  let ops=b.ops.slice();
  const p={kind:b.kind==='column'?'column':b.kind==='compare'?'compare':'examples',ops,lo:b.lo,hi:b.hi,count:b.count};
  if(b.kind==='compare')p.cmp='expr';
  if(b.kind==='window')p.missing='any';
  if(b.kind==='eq'){p.missing='ab';p.xvar=true}
  if(b.carry!=='any')p.carry=b.carry;
  if(b.kind==='column'){p.column=true;p.ops=ops.filter(o=>o!=='÷');if(p.ops.includes('×')){p.ops=['×'];p.aLo=Math.max(2,b.lo);p.aHi=Math.max(b.lo+1,b.hi)}}
  else if(ops.some(o=>o==='×'||o==='÷'))p.table=[2,9];
  const mid=Math.max(b.lo+2,Math.round(b.lo+(b.hi-b.lo)/2));
  const harder=b.kind==='examples'?{...p,missing:'any'}:{...p,count:Math.min(24,p.count+4)};
  return{...base,L:[
    {n:'Попроще',d:p.table&&!ops.some(o=>o==='+'||o==='-')?'таблица на 2–5':`числа до ${fmt(mid)}`,p:{...p,hi:mid,aHi:p.aHi?Math.max(p.aLo+1,Math.round((p.aLo+p.aHi)/2)):undefined,table:p.table?[2,5]:undefined}},
    {n:'Как задано',d:p.table&&!ops.some(o=>o==='+'||o==='-')?'вся таблица':`числа от ${fmt(b.lo)} до ${fmt(b.hi)}`,p},
    {n:'Посложнее',d:b.kind==='examples'?'пропуск в любом месте':`длиннее лист: ${harder.count} заданий`,p:harder}]};
}
function builderErrors(b){
  const e=[];
  if(b.mode==='own'){const {list,bad}=parseList(b.text);
    if(list.length<2)e.push('Добавьте хотя бы 2 строки в формате «вопрос = ответ».');
    if(bad)e.push(`Строк без знака «=» или без ответа: ${bad}. Они не попадут в тему.`);}
  else{
    if(!b.ops.length)e.push('Выберите хотя бы одно действие.');
    if(b.kind==='column'&&b.ops.length&&b.ops.every(o=>o==='÷'))e.push('Столбиком можно складывать, вычитать и умножать. Деление в столбик появится позже.');
    if(!(Number.isFinite(b.lo)&&Number.isFinite(b.hi))||b.lo<0||b.hi<=b.lo+1)e.push('Число «до» должно быть хотя бы на 2 больше, чем «от».');
    if(b.hi>100000)e.push('Слишком большие числа: максимум 100 000.');
  }
  if(!(b.count>=4&&b.count<=24))e.push('Заданий на листе: от 4 до 24.');
  return e;
}

/* ---------- разделы репетитора: меню слева, сегодня, расписание, финансы, материалы, профиль ---------- */
const DAY=86400000;
const pad2=n=>String(n).padStart(2,'0');
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())};
const atOf=(k,tm)=>{const[y,m,d]=k.split('-').map(Number),[h,mi]=(tm||'00:00').split(':').map(Number);return new Date(y,m-1,d,h,mi).getTime()};
const dayStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const addDays=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()};
const monday=t=>addDays(dayStart(t),-((new Date(t).getDay()+6)%7));
const monthStart=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),1).getTime()};
const addMonths=(t,n)=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth()+n,1).getTime()};
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WDL=['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
const MONN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const wdOf=t=>(new Date(t).getDay()+6)%7;
const hm=t=>{const d=new Date(t);return pad2(d.getHours())+':'+pad2(d.getMinutes())};
const dayTxt=t=>{const d=new Date(t);return d.getDate()+' '+MONG[d.getMonth()]};
const whenTxt=t=>{const d0=dayStart(Date.now()),d=dayStart(t);return (d===d0?'сегодня':d===addDays(d0,1)?'завтра':WD[wdOf(t)].toLowerCase()+', '+dayTxt(t))+', '+hm(t)};
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const LESSONS=['занятие','занятия','занятий'];

/* цена занятия меняется только для следующих занятий: прошлые считаются по старой */
function priceAt(st,at){const ps=st.prices||[];if(!ps.length)return st.price||0;let p=ps[0].p;for(const x of ps)if(x.from<=at)p=x.p;return p}
function setPrice(st,p){p=Math.max(0,Math.round(+p||0));if(p===(st.price||0)&&(st.prices||[]).length)return;
  st.prices=st.prices||[];st.prices.push({from:st.prices.length?Date.now():0,p});st.price=p}

/* занятия: дни недели ученика дают занятия сами, в S.lessons лежат только отмеченные, перенесённые и разовые */
function lessonsIn(a,b,sid){
  const real=S.lessons.filter(l=>(!sid||l.sid===sid)&&student(l.sid));
  const taken=new Set(real.map(l=>l.slot).filter(Boolean));
  const out=real.filter(l=>l.at>=a&&l.at<b);
  for(const st of S.students){if(sid&&st.id!==sid)continue;
    for(const sl of st.slots||[]){
      let d=dayStart(Math.max(a,sl.since||0));d=addDays(d,(sl.wd-wdOf(d)+7)%7);
      for(;d<b;d=addDays(d,7)){const k=dkey(d),at=atOf(k,sl.t);
        if(sl.until&&at>=sl.until)break;if(at<(sl.since||0)||at<a||at>=b)continue;
        const key=st.id+'|'+sl.id+'|'+k;if(taken.has(key))continue;
        out.push({id:'v:'+key,slot:key,sid:st.id,at,dur:st.dur||60,status:'plan',virtual:true})}}}
  return out.sort((x,y)=>x.at-y.at)}
/* прошедшее занятие считается проведённым само: отмечать нужно только отмену и пропуск */
const lstat=l=>l.status&&l.status!=='plan'?l.status:(l.at+(l.dur||60)*60000<=Date.now()?'done':'plan');
const charged=l=>['done','miss'].includes(lstat(l));
const lprice=l=>l.price!=null?l.price:priceAt(student(l.sid),l.at);
const LST={plan:'по плану',done:'проведено',miss:'пропуск, оплачивается',cancel:'отменено'};
function realize(l){if(!l.virtual)return S.lessons.find(x=>x.id===l.id)||l;
  const r={id:'l'+Date.now()+Math.floor(Math.random()*1000),slot:l.slot,sid:l.sid,at:l.at,dur:l.dur,status:'plan'};S.lessons.push(r);return r}
function money(st,a=0,b=Date.now()+90*DAY){
  const ls=lessonsIn(a,b,st.id).filter(charged);const ch=ls.reduce((s,l)=>s+lprice(l),0);
  const pd=S.payments.filter(p=>p.sid===st.id&&p.date>=a&&p.date<b).reduce((s,p)=>s+p.amount,0);
  return{n:ls.length,charged:ch,paid:pd,bal:pd-ch}}
/* какие занятия оплачены: сначала оплата, отмеченная в самом занятии, потом остальные деньги по порядку дат */
function coverage(st){
  const ls=lessonsIn(0,Date.now()+180*DAY,st.id).filter(l=>lstat(l)!=='cancel');
  const ids=new Set(ls.map(l=>l.id)),own={};let pool=0;
  for(const p of S.payments)if(p.sid===st.id){if(p.lid&&ids.has(p.lid))own[p.lid]=(own[p.lid]||0)+p.amount;else pool+=p.amount}
  const paid=new Map();let un=0,unSum=0,until=0;
  for(const l of ls){const pr=lprice(l);let a=own[l.id]||0;if(a>pr){pool+=a-pr;a=pr}
    if(a<pr&&pool>0){const t=Math.min(pool,pr-a);pool-=t;a+=t}
    if(a>=pr){paid.set(l.id,own[l.id]?'own':'pre');if(lstat(l)==='plan')until=l.at}
    else if(charged(l)){un++;unSum+=pr-a}}
  return{paid,un,unSum,until,pool}}
function balTxt(st){const c=coverage(st);
  if(c.un)return{cls:'bad',t:`не оплачено ${c.un} ${plural(c.un,LESSONS)} · ${rub(c.unSum)}`};
  if(c.until)return{cls:'ok',t:'оплачено до '+dayTxt(c.until)};
  if(c.pool>0)return{cls:'ok',t:'аванс '+rub(c.pool)};
  return{cls:'',t:'всё оплачено'}}
const nextLesson=sid=>lessonsIn(Date.now(),Date.now()+60*DAY,sid).find(l=>lstat(l)==='plan');
const slotsTxt=st=>(st.slots||[]).filter(s=>!s.until).sort((a,b)=>a.wd-b.wd||a.t.localeCompare(b.t)).map(s=>WD[s.wd]+' '+s.t).join(', ');

/* дни занятий в карточке ученика */
function slotRows(slots){return slots.map((s,i)=>`<div class="wslot" data-i="${i}"><select class="sl-wd" aria-label="День недели">${WD.map((w,k)=>`<option value="${k}"${k===s.wd?' selected':''}>${WDL[k]}</option>`).join('')}</select>
  <input class="sl-t" type="time" value="${s.t}" aria-label="Время"><button type="button" class="ibtn sl-rm" aria-label="Убрать день">✕</button></div>`).join('')}
function slotEditor(st){const act=(st&&st.slots||[]).filter(s=>!s.until).map(s=>({...s}));
  return{html:`<div class="field"><span class="label">Дни занятий</span><div class="slots" id="slots">${slotRows(act)}</div>
    <button type="button" class="btn small quiet" id="sl-add">+ День</button></div>`,
  bind(){const box=document.getElementById('slots');
    const pull=()=>box.querySelectorAll('.wslot').forEach(r=>{const s=act[+r.dataset.i];s.wd=+r.querySelector('.sl-wd').value;s.t=r.querySelector('.sl-t').value||s.t});
    const redraw=()=>{box.innerHTML=slotRows(act);box.querySelectorAll('.sl-rm').forEach(b=>b.onclick=()=>{pull();act.splice(+b.closest('.wslot').dataset.i,1);redraw()})};
    redraw();document.getElementById('sl-add').onclick=()=>{pull();const last=act[act.length-1];act.push({wd:last?(last.wd+3)%7:0,t:last?last.t:'16:00'});redraw()};
    this.read=()=>{pull();return act}}}}
/* старые дни заканчиваются сейчас (прошлые занятия остаются в истории), новые начинаются сейчас */
function applySlots(st,next){const now=Date.now();st.slots=st.slots||[];
  const same=(a,b)=>a.wd===b.wd&&a.t===b.t;
  for(const s of st.slots.filter(s=>!s.until))if(!next.some(n=>n.id===s.id&&same(n,s)))s.until=now;
  st.slots=st.slots.filter(s=>!(s.until&&(s.since||0)>=s.until));
  next.forEach((n,i)=>{const old=st.slots.find(s=>s.id===n.id&&!s.until);if(!old||!same(old,n))st.slots.push({id:'w'+now+i,wd:n.wd,t:n.t,since:now})})}

/* ---------- Мои материалы: сохранённые листы, свои темы и свои файлы ---------- */
let FILES=null,FILES_ERR='';
async function loadFiles(){if(!ACC.user)return;
  try{FILES=await pbT.collection('files').getFullList({sort:'-created'});FILES_ERR=''}catch(e){FILES=FILES||[];FILES_ERR='Файлы не загрузились. Проверьте интернет.'}
  if(V.screen==='materials')render()}
async function uploadFiles(list){
  const box=document.getElementById('upSt');
  for(const f of list){
    if(f.size>25e6){toast('Больше 25 МБ: '+f.name);continue}
    if(box)box.textContent='Загружаю '+f.name+'…';
    const fd=new FormData();fd.append('owner',ACC.user.id);fd.append('file',f);fd.append('name',f.name.slice(0,200));fd.append('folder',V.mfolder&&V.mfolder!=='*'?V.mfolder:'');
    try{const r=await pbT.collection('files').create(fd);FILES=[r,...(FILES||[])]}catch(e){toast('Не загрузился: '+f.name)}}
  render()}
async function openFile(r){const w=window.open('about:blank','_blank');
  try{const token=await pbT.files.getToken();const url=pbT.files.getURL(r,r.file,{token});if(w)w.location.href=url;else location.href=url}
  catch(e){if(w)w.close();toast('Не удалось открыть файл')}}
const fileKind=n=>{const x=(n.split('.').pop()||'').toLowerCase();return /^(png|jpe?g|webp|gif|heic)$/.test(x)?'IMG':x==='pdf'?'PDF':/^(docx?|odt|rtf)$/.test(x)?'DOC':/^(pptx?|key)$/.test(x)?'PPT':/^(xlsx?|csv)$/.test(x)?'XLS':'FILE'};
const fsize=b=>b>1e6?(b/1e6).toFixed(1).replace('.',',')+' МБ':Math.max(1,Math.round(b/1e3))+' КБ';
function folders(){return [...new Set([...S.saved.map(m=>m.folder),...(FILES||[]).map(f=>f.folder)].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'))}
function pickStudent(title,cb,pre){
  if(!S.students.length){toast('Сначала добавьте ученика');return}
  if(S.students.length===1)return cb(S.students[0]);
  modal(`<h2>${esc(title)}</h2><div class="picks">${S.students.map(s=>`<button class="pick${s.id===pre?' on':''}" data-id="${s.id}"><b>${esc(s.name)}</b><small>${gradeWord(s.grade)}</small></button>`).join('')}</div>

const mroot=document.getElementById('modal-root');
function modal(html,bind){mroot.innerHTML=`<div class="veil" id="veil"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const v=document.getElementById('veil');v.onclick=e=>{if(e.target===v)close()};bind&&bind();const f=v.querySelector('input,button');f&&f.focus()}
function close(){mroot.innerHTML=''}

/* настоящая ссылка: задание целиком лежит в адресе после #, сервер не нужен */
const SITE='https://kurkinsavvyn-boop.github.io/kletka-tutor/';
const b64e=o=>{const b=new TextEncoder().encode(JSON.stringify(o));let x='';b.forEach(c=>x+=String.fromCharCode(c));return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const b64d=str=>{const t=str.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(t);return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))))};
function hwPayload(h){const t=TOPICS[h.topicId];
  return{v:1,c:h.code,n:student(h.studentId).name,t:t.t,g:t.grade,mix:!!(t.review||t.sheet),p:{...t.L[h.level].p,...(h.over||{})},s:h.seed}}
function hwLink(h){return SITE+'app/#hw='+b64e(hwPayload(h))}
/* результат записывается одинаково и с экрана ученика в этом браузере, и из кода результата */
function recordResult(h,r){
  const t=TOPICS[h.topicId];const base={studentId:h.studentId,time:r.time,date:Date.now()};const id='a'+Date.now();
  if(t&&(t.review||t.sheet)){
    const by={};for(const[src,ok]of r.log){by[src]=by[src]||{c:0,n:0};by[src].n++;if(ok)by[src].c++}
    Object.keys(by).filter(src=>TOPICS[src]).forEach((src,k)=>S.attempts.push({...base,id:id+'-'+k,topicId:src,level:Math.min(1,TOPICS[src].L.length-1),
      correct:by[src].c,total:by[src].n,mistakes:r.mistakes.filter(m=>m.src===src),via:'review'}));
  }else S.attempts.push({...base,id,topicId:h.topicId,level:h.level,correct:r.correct,total:r.total,answered:r.answered,mistakes:r.mistakes,hw:h.code});
  h.result={correct:r.correct,total:r.total,answered:r.answered,time:r.time,date:Date.now(),answers:r.log.map(x=>x[2]==null?'':String(x[2])),oks:r.log.map(x=>x[1]?1:0)};
  h.status='сдано';save();
}
function importModal(){
  modal(`<h2>Внести результат</h2>
    <p style="margin:0;color:var(--ink-2)">Вставьте код, который ученик получил после решения домашки по ссылке. Он начинается с <b>KL-</b>.</p>
    <div class="field"><label class="label" for="rc">Код результата</label><textarea id="rc" rows="4" spellcheck="false" placeholder="KL-…"></textarea></div>
    <p class="hint" id="rc-err" style="margin:0"></p>
    <div class="modal-actions"><button class="btn quiet" id="cl">Отмена</button><button class="btn primary" id="ok">Внести</button></div>`,()=>{
    document.getElementById('cl').onclick=close;
    document.getElementById('ok').onclick=()=>{const raw=document.getElementById('rc').value.trim().replace(/^KL-/,'').replace(/\s+/g,'');const err=document.getElementById('rc-err');
      let d;try{d=b64d(raw)}catch(e){err.textContent='Код не читается. Проверьте, что он скопирован целиком.';return}
      const h=S.assignments.find(a=>a.code===d.c);
      if(!h){err.textContent=`Домашки ${d.c} нет в этом браузере. Код подходит только к домашке, которую выдали здесь.`;return}
      if(h.status==='сдано'){err.textContent=`Результат домашки ${d.c} уже внесён.`;return}
      recordResult(h,{correct:d.k,total:d.n,answered:d.a,time:d.tm,log:d.l,mistakes:d.m||[]});close();go({screen:'work',studentId:h.studentId,code:h.code})};
  });
}
function linkModal(){
  const st=student(V.studentId);const t=TOPICS[V.topicId];

/* в аккаунте домашка уходит прямо в кабинет ученика */

let P=null;
function startPlayer(h){
  const t=TOPICS[h.topicId];const p={...t.L[h.level].p,...(h.over||{})};
  P={h,t,items:generate(p,h.seed),i:0,input:'',correct:0,streak:0,score:0,mistakes:[],log:[],start:Date.now(),fb:null,lock:false};
  V.studentId=h.studentId;go({screen:'player'});
}
const isNumAns=it=>/^\d+$/.test(String(it.ans));
const textMode=it=>(it.type==='own'&&!isNumAns(it))||(it.type==='line'&&!it.opts);
const norm=s=>String(s).trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');
function qText(it){
  if(it.type==='sort'||it.type==='line'||it.type==='mor'||it.type==='snt')return `<span>${esc(it.q||it.w)}</span>`;
  if(it.type==='ins'){const [a,b]=it.w.split('□');return `${esc(a)}<span class="slot${P.input?' filled':''}">${esc(P.input)||'?'}</span>${esc(b)}`}
  const sl=()=>`<span class="slot${P.input?' filled':''}">${esc(P.input)||'?'}</span>`;
  if(it.type==='word')return `<span class="wq">${esc(it.q)}</span><span class="wa">Ответ: ${sl()}</span>`;
  if(it.type==='grid')return `<span class="gwrap">${gridSVG(it)}</span><span class="wa">${it.ask} = ${sl()} ${gridUnit(it)}</span>`;
  if(it.type==='ch')return `<span class="wq">${esc(it.q)}</span>${it.svg?`<span class="gwrap">${it.svg}</span>`:''}`;
  if(it.svg)return `<span class="gwrap">${it.svg}</span><span class="wq">${esc(it.q).replace('□',sl())}</span>`;
  if(it.type==='own'){const slot=`<span class="slot${P.input?' filled':''}">${esc(P.input)||'?'}</span>`;
    return it.q.includes('□')?`<span>${esc(it.q).replace('□',slot)}</span>`:`<span>${esc(it.q)} =</span>${slot}`}
  if(it.type==='cmp')return `${it.left} <span class="slot${P.input?' filled':''}">${P.input||'?'}</span> ${it.right}`;
  if(it.type==='expr')return `${it.q} = <span class="slot${P.input?' filled':''}">${P.input||'?'}</span>`;
  if(it.type==='col')return `<div class="col"><span class="op">${sym(it.op)}</span><span>${fmt(it.a)}</span><span>${fmt(it.b)}</span><span class="bar"></span><span class="r">${P.input||''}</span></div>`;
  const slot=`<span class="slot${P.input?' filled':''}">${P.input||(it.x?'x':'?')}</span>`;
  return `${it.miss==='a'?slot:fmt(it.a)} ${sym(it.op)} ${it.miss==='b'?slot:fmt(it.b)} = ${it.miss==='res'?slot:fmt(it.res)}`;
}
function plainQ(it){
  if(it.type==='sort'||it.type==='line'||it.type==='mor'||it.type==='snt')return it.q||it.w;
  if(it.type==='ins')return it.w;
  if(it.type==='word'||it.type==='ch'||it.svg)return it.q.length>70?it.q.slice(0,67)+'…':it.q;
  if(it.type==='grid')return (it.ask==='P'?'Периметр':'Площадь')+` фигуры из ${it.cells.length} клеток`;
  if(it.type==='own')return it.q.includes('□')?it.q:it.q+' = □';
  if(it.type==='cmp')return `${it.left} ◯ ${it.right}`;
  if(it.type==='expr')return `${it.q} = □`;
  if(it.type==='col')return `${fmt(it.a)} ${sym(it.op)} ${fmt(it.b)}`;
  const s=v=>it.x?'x':'□';
  return `${it.miss==='a'?s():fmt(it.a)} ${sym(it.op)} ${it.miss==='b'?s():fmt(it.b)} = ${it.miss==='res'?s():fmt(it.res)}`;
}
function viewPlayer(){
  const it=P.items[P.i];const who=P.name||student(P.h.studentId).name;
  const tm=textMode(it);
  const pad=it.type==='ch'||it.type==='ins'||(it.opts&&it.type!=='cmp')?`<div class="opts-pad">${it.opts.map((o,k)=>`<button data-opt="${k}">${esc(o)}</button>`).join('')}</div>`
    :it.type==='cmp'
    ?`<div class="signs">${['<','=','>'].map(s=>`<button data-sign="${s}" aria-label="знак ${s}">${s}</button>`).join('')}</div>`
    :tm?`<div class="txt"><input id="tx" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ответ" placeholder="Ответ" value="${esc(P.input)}"><button class="btn primary" id="txok">Готово</button></div>`
    :`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button class="del" data-k="del">Стереть</button><button data-k="0">0</button><button class="go" data-k="ok">Готово</button></div>`;
  app.innerHTML=`<div class="player">
    ${P.remote?'':'<div class="demo-bar">Так домашку видит ученик на телефоне или компьютере</div>'}
    <div class="pl-head"><div><div class="pl-who">${esc(who)} · ${esc(P.t.t)}</div><div class="label">Задание ${P.i+1} из ${P.items.length}</div></div>
      <div class="score num"><span>${P.score}<small>очки</small></span><span>${P.streak}<small>подряд</small></span></div></div>
    <div class="prog"><i style="width:${P.i/P.items.length*100}%"></i></div>
    <p class="pl-instr">${esc(it.hintOn||instr(it))}</p>
    <div class="task${(it.type==='ins'&&it.phr)||it.type==='snt'||it.long?' word':''}${it.type==='own'&&!it.svg&&it.q.length>16&&it.q.length<=26?' long':''}${it.type==='word'||it.type==='ch'||it.svg||(it.type==='own'&&it.q.length>26)?' word':''}${it.type==='grid'?' grid':''}" aria-live="polite"><div class="q">${qText(it)}</div>${P.fb?`<div class="fb ${P.fb.ok?'ok':'bad'}">${P.fb.ok?'Верно! +10':'Правильный ответ: '+esc(P.fb.ans)}</div>`:''}</div>
    ${pad}
    <div style="text-align:center"><button class="btn small quiet" id="stop">Закончить досрочно</button></div></div>`;
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k));
  app.querySelectorAll('[data-sign]').forEach(b=>b.onclick=()=>{P.input=b.dataset.sign;submit()});
  app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(P.lock)return;P.input=it.opts[+b.dataset.opt];submit()});
  if(tm){const tx=document.getElementById('tx');const send=()=>{if(!P.lock&&P.input.trim())submit()};
    tx.oninput=()=>{P.input=tx.value};tx.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};
    document.getElementById('txok').onclick=send;if(!P.lock)tx.focus()}
  document.getElementById('stop').onclick=finish;
}
function key(k){
  if(!P||P.lock||V.screen!=='player')return;
  if(k==='del')P.input=P.input.slice(0,-1);
  else if(k==='ok'){if(P.input)submit();return}
  else if(P.input.length<10)P.input+=k;
  P.fb=null;viewPlayer();
}
function submit(){
  const it=P.items[P.i];const ok=norm(it.ans)===norm(P.input);
  P.log.push([it.src||'',ok?1:0,P.input]);
  if(ok){P.correct++;P.streak++;P.score+=10}else{P.streak=0;P.mistakes.push({q:plainQ(it),given:P.input,ans:String(fmt(it.ans)),src:it.src})}
  P.fb={ok,ans:String(fmt(it.ans))};P.lock=true;viewPlayer();
  setTimeout(()=>{P.lock=false;P.fb=null;P.input='';P.i++;if(P.i>=P.items.length)finish();else viewPlayer()},ok?650:1500);
}
function finish(){
  if(!P)return;
  const r={correct:P.correct,total:P.items.length,answered:P.i,time:Math.round((Date.now()-P.start)/1000),log:P.log,mistakes:P.mistakes};
  if(P.cab){P.sent=null;sendCab(P.cab,{k:r.correct,n:r.total,a:r.answered,tm:r.time,l:r.log,m:r.mistakes.slice(0,30)}).then(ok=>{P.sent=ok;if(V.screen==='done')render()})}
  else if(P.remote){P.rcode='KL-'+b64e({v:1,c:P.h.code,k:r.correct,n:r.total,a:r.answered,tm:r.time,l:r.log,m:r.mistakes.slice(0,30)})}
  else{const h=S.assignments.find(x=>x.code===P.h.code);if(h)recordResult(h,r)}
  P.result=r;go({screen:'done'});
}
function viewDone(){
  const a=P.result;const pct=Math.round(a.correct/a.total*100);
  const word=pct>=85?'Отлично!':pct>=60?'Хорошо, есть над чем поработать':'Давай потренируемся ещё';
  if(P.cab){
    app.innerHTML=`<div class="player"><div class="panel finish"><span class="label">${esc(P.t.t)}</span><div class="big num">${a.correct} из ${a.total}</div>
      <p style="margin:0;font-size:18px;font-weight:600">${word}</p>
      <span class="sent">${P.sent===null?'Отправляем результат…':P.sent?'✓ Результат отправлен репетитору':'Нет связи: результат отправится сам, когда появится интернет'}</span>
      <p class="hint" style="margin:0">Время: ${Math.floor(a.time/60)} мин ${a.time%60} с. Очки: ${P.score}.</p></div>
      <button class="btn primary" id="tocab">К моим заданиям</button></div>`;
    document.getElementById('tocab').onclick=()=>{P=null;CAB.items=null;V={screen:'cab'};render();loadCab()};return}
  app.innerHTML=`<div class="player">${P.remote?'':'<div class="demo-bar">Экран ученика</div>'}
    <div class="panel finish"><span class="label">${esc(P.t.t)}</span><div class="big num">${a.correct} из ${a.total}</div>
      <p style="margin:0;font-size:18px;font-weight:600">${word}</p>${P.remote?'':'<span class="sent">✓ Результат записан в карточку ученика</span>'}
      <p class="hint" style="margin:0">Время: ${Math.floor(a.time/60)} мин ${a.time%60} с. Очки: ${P.score}.</p></div>
    ${P.remote?`<div class="panel rbox"><b>Отправь этот код репетитору</b><span class="hint">Скопируй и пришли в мессенджере. По нему репетитор увидит твой результат и ошибки.</span>
      <textarea id="rcode" readonly rows="3">${P.rcode}</textarea><button class="btn primary" id="rcp">Скопировать код</button></div>`
      :'<button class="btn primary" id="back">Вернуться к репетитору: разбор работы</button>'}</div>`;
  if(P.remote){const b=document.getElementById('rcp');b.onclick=()=>{const t=document.getElementById('rcode');const ok=()=>{b.textContent='Код скопирован'};
    if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(ok,()=>{t.select()});else t.select()};return}
  document.getElementById('back').onclick=()=>{const sid=P.h.studentId,code=P.h.code;P=null;go({screen:'work',studentId:sid,code})};
}
document.addEventListener('keydown',e=>{
  if(V.screen!=='player'||!P||mroot.innerHTML)return;
  const it=P.items[P.i];
  if(it.type==='cmp'){if(['<','>','='].includes(e.key)){P.input=e.key;submit()}return}
  if(textMode(it)||it.type==='ch')return;
  if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('del');else if(e.key==='Enter')key('ok');
});
let STUDENT_MODE=false;
{const m=location.hash.match(/^#hw=([\w-]+)/);
 if(m){STUDENT_MODE=true;document.body.classList.add('student-mode');
  try{const d=b64d(m[1]);
    P={h:{code:d.c,level:0},t:{t:d.t,grade:d.g,sheet:d.mix},name:d.n,remote:true,items:generate(d.p,d.s),i:0,input:'',correct:0,streak:0,score:0,mistakes:[],log:[],start:Date.now(),fb:null,lock:false};
    V={screen:'player'};document.title=d.t+' · Клетка'}
  catch(e){V={screen:'badlink'}}}}
document.getElementById('home').onclick=()=>{if(!STUDENT_MODE&&(ACC.user||ACC.demo))go({screen:'today'})};
if(CABINET){
  STUDENT_MODE=true;document.body.classList.add('cabinet');document.title='Мои задания';document.getElementById('ati').href='../icons/u-180.png';
  addEventListener('focus',()=>{if(V.screen==='cab'&&pbS.authStore.isValid)loadCab()});
  if(pbS&&pbS.authStore.isValid&&pbS.authStore.record&&pbS.authStore.record.collectionName==='students'){V={screen:'cab'};render();loadCab()}
  else{V={screen:'cablogin'};render()}
}else if(!STUDENT_MODE){
  const hash=location.hash;
  if(hash==='#student')location.replace('../u/');
  if(pbT&&pbT.authStore.isValid&&pbT.authStore.record&&pbT.authStore.record.collectionName==='users'){
    startTutor();pbT.collection('users').authRefresh().then(()=>{ACC.user=pbT.authStore.record;crumbs()}).catch(e=>{if(e&&e.status===401)logout()});
  }else if(sessionStorage.getItem('kletka-demo')&&hash!=='#signup'&&hash!=='#login')startDemo();
  else{V={screen:'auth',authMode:hash==='#signup'?'signup':'login'};render()}
  try{history.replaceState({V:JSON.parse(JSON.stringify(V))},'')}catch(e){}
}else render();
</script>
