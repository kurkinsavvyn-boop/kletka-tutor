<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Клетка для репетитора</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F2C55">
<link rel="apple-touch-icon" id="ati" href="../icons/app-180.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: тетрадь в клетку. Рабочие панели лежат на сетке, красная ручка учителя — только для ошибок, ключа и «сейчас проходим». */
:root{
  --paper:#F7F9FC; --grid:#E3EAF4; --card:#FFFFFF; --line:#D5DDEA;
  --ink:#1F2C55; --ink-2:#5B6888; --ink-3:#66718D;
  --pen:#D5402F; --pen-soft:#FBE6E2;
  --ink-soft:#E6ECF8;
  --blue:#2D57C8; --blue-soft:#E8EEFC;
  --ok:#2C8A57; --ok-soft:#E1F2E8; --warn:#C98A12; --warn-soft:#FBF0D9; --bad:#D5402F; --bad-soft:#FBE6E2; --none:#B4BDD0;
  --sheet:#FFFFFF; --sheet-ink:#1A1F2E; --sheet-line:#C9D2E2; --sheet-pen:#D5402F;
  --f-ui:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-disp:"Unbounded", "Golos Text", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151F; --grid:#1A2130; --card:#171D2A; --line:#283247;
  --ink:#E4E9F5; --ink-2:#A3AECA; --ink-3:#8E9AB6;
  --pen:#FF7863; --pen-soft:#3A1F1D; --ink-soft:#222B40; --blue:#8BA8FF; --blue-soft:#1D2742;
  --ok:#5CC98C; --ok-soft:#173326; --warn:#E8B04A; --warn-soft:#33290F; --bad:#FF7863; --bad-soft:#3A1F1D; --none:#4A5470;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151F; --grid:#1A2130; --card:#171D2A; --line:#283247;
  --ink:#E4E9F5; --ink-2:#A3AECA; --ink-3:#8E9AB6;
  --pen:#FF7863; --pen-soft:#3A1F1D; --ink-soft:#222B40; --blue:#8BA8FF; --blue-soft:#1D2742;
  --ok:#5CC98C; --ok-soft:#173326; --warn:#E8B04A; --warn-soft:#33290F; --bad:#FF7863; --bad-soft:#3A1F1D; --none:#4A5470;
  color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--f-disp);font-weight:700;font-size:18px;letter-spacing:-.01em;background:none;border:0;padding:0}
.logo i{width:18px;height:18px;border:2px solid var(--ink);display:grid;grid-template:1fr 1fr/1fr 1fr;border-radius:3px;overflow:hidden}
.logo i b{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.logo i b:nth-child(4){background:var(--pen)}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:14px;flex-wrap:wrap;min-width:0}
.crumbs button{background:none;border:0;padding:4px 6px;border-radius:6px;color:var(--ink-2)}
.crumbs button:hover{background:var(--ink-soft);color:var(--ink)}
.crumbs .cur{color:var(--ink);font-weight:600;padding:4px 6px}
.steps{margin-left:auto;display:flex;gap:4px;font-size:12px;color:var(--ink-3)}
.steps span{padding:3px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.steps span.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.steps span.done{background:var(--ink);border-color:var(--ink);color:var(--card)}

.wrap{max-width:1180px;margin:0 auto;padding-block:28px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-family:var(--f-disp);font-weight:600;font-size:clamp(22px,3vw,30px);letter-spacing:-.015em}
.head p{margin:4px 0 0;color:var(--ink-2)}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);padding:10px 16px;font-weight:600;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);min-height:42px}
.btn:hover{background:var(--ink-soft)}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.primary:hover{filter:brightness(1.15);background:var(--ink)}
.btn.pen{border-color:var(--pen);color:var(--pen)}
.btn.small{padding:6px 11px;min-height:34px;font-size:14px}
.btn.quiet{border-color:var(--line)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px}

/* Ученики */
.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.st{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,transform .15s}
.st:hover{border-color:var(--ink);transform:translateY(-1px)}
.st-top{display:flex;align-items:center;gap:12px}
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--ink-soft);color:var(--ink);flex:none}
.st h3{font-size:17px;font-weight:600}
.st .grade{color:var(--ink-2);font-size:14px}
.st-now{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.st-now .t{font-weight:500}
.st-now .t2{font-size:13.5px;color:var(--ink-2)}
.st-foot{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:99px;padding:3px 9px;background:var(--ink-soft);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.add-card{border:1.5px dashed var(--line);background:transparent;border-radius:14px;color:var(--ink-2);min-height:170px;display:grid;place-items:center;font-weight:600}
.add-card:hover{border-color:var(--ink);color:var(--ink)}

/* Ученик */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.tabs{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--ink-2)}
.tab.on{background:var(--ink-soft);color:var(--ink)}
.sec{padding:14px 18px 6px}
.sec h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.topic{width:100%;display:flex;align-items:center;gap:12px;padding:11px 10px;border:0;background:none;border-radius:9px;text-align:left}
.topic:hover{background:var(--ink-soft)}
.topic .tt{flex:1;min-width:0}
.topic .pct{font-size:13px;color:var(--ink-2)}
.topic[disabled]{cursor:default;opacity:.55}
.topic[disabled]:hover{background:none}
.dot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--none)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.now{font-size:11.5px;font-weight:700;color:var(--pen);border:1.5px solid var(--pen);border-radius:5px;padding:0 6px;margin-left:8px;white-space:nowrap;transform:rotate(-2deg);display:inline-block}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 18px 16px;color:var(--ink-2);font-size:13px;border-top:1px solid var(--line);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.locked{margin:12px 18px;padding:12px 14px;border-radius:10px;background:var(--ink-soft);color:var(--ink-2);font-size:14px}
.side{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.side h2{font-size:16px;font-weight:600}
.res{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.res-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.res .t{font-weight:500;font-size:14px}
.res .m{color:var(--ink-2);font-size:13px}
.res details{font-size:13px}
.res summary{cursor:pointer;color:var(--pen);font-weight:600}
.mist{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.mist div{display:flex;justify-content:space-between;gap:8px}
.mist s{color:var(--pen)}
.empty{color:var(--ink-3);font-size:14px}

/* Тема */
.topic-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:22px;align-items:start}
.levels{display:flex;flex-direction:column;gap:10px}
.lvl{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.lvl:hover{border-color:var(--ink-2)}
.lvl.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink-soft)}
.lvl-top{display:flex;align-items:center;gap:10px}
.lvl-mark{display:flex;gap:3px}
.lvl-mark i{width:8px;height:14px;border-radius:2px;background:var(--line)}
.lvl-mark i.f{background:var(--ink)}
.lvl b{font-size:15px}
.lvl .d{color:var(--ink-2);font-size:13.5px}
.lvl .ex{font-size:13.5px;color:var(--ink);background:var(--ink-soft);border-radius:6px;padding:3px 8px;align-self:flex-start}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.actions .btn{flex:1 1 auto}
.hint{font-size:13px;color:var(--ink-3)}
.tune{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.tune summary{cursor:pointer;font-weight:600;color:var(--ink-2);font-size:14px}
.tune-row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;font-size:14px}
.tune-row input{width:84px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}

/* Лист A4 */
.sheet-wrap{display:flex;flex-direction:column;gap:10px;min-width:0}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sheet{container-type:inline-size;background:var(--sheet);color:var(--sheet-ink);width:100%;max-width:100%;border-radius:4px;
  box-shadow:0 1px 2px rgba(20,30,60,.08),0 10px 30px rgba(20,30,60,.10);font-family:var(--f-ui)}
.sheet-in{padding:6cqw 7cqw;display:flex;flex-direction:column;gap:3.4cqw;min-height:141.4cqw}
.sh-head{display:grid;grid-template-columns:1fr auto;gap:1cqw 4cqw;font-size:2.3cqw;color:#4e5870}
.sh-head .fld{border-bottom:.25cqw solid var(--sheet-line);padding-bottom:.6cqw;min-width:22cqw}
.sh-head .fld b{color:var(--sheet-ink);font-weight:600}
.sh-title{font-family:var(--f-disp);font-weight:600;font-size:4cqw;letter-spacing:-.01em;line-height:1.2}
.sh-sub{font-size:2.3cqw;color:#4e5870;margin-top:-2cqw}
.sh-items{display:grid;gap:3.2cqw 4cqw;font-size:3.5cqw;font-variant-numeric:tabular-nums}
.sh-items.c3{grid-template-columns:repeat(3,1fr)}
.sh-items.c2{grid-template-columns:repeat(2,1fr)}
.sh-items.c4{grid-template-columns:repeat(4,1fr)}
.it{display:flex;align-items:center;gap:1.2cqw;white-space:nowrap}
.sh-items.c1{grid-template-columns:1fr}
.it.word{grid-column:1/-1;flex-direction:column;align-items:stretch;white-space:normal;font-size:2.9cqw;gap:1cqw;position:relative;padding-left:4.2cqw}
.it.word .n{position:absolute;left:0;top:.4cqw}
.it.word .wq{line-height:1.45}
.it.word .sol{height:7cqw;background-image:linear-gradient(var(--sheet-line) .15cqw,transparent .15cqw);background-size:100% 3.5cqw;opacity:.7}
.it.word .wa{display:flex;align-items:center;gap:1.2cqw;align-self:flex-end}
.it.grid{flex-direction:column;align-items:flex-start;font-size:3cqw}
.it.grid .n{align-self:flex-start}
.gfig{width:100%;max-width:24cqw;height:auto}
.gfig .gl line{stroke:#cfd7e6;stroke-width:.4}
.gfig .gf rect{fill:#e3e9f4}
.gfig .ge line{stroke:#1a1f2e;stroke-width:1.2;stroke-linecap:round}
.ga{display:flex;align-items:center;gap:1cqw;white-space:nowrap}
.grp{grid-column:1/-1;font-size:2.3cqw;color:#4e5870;border-bottom:.2cqw solid var(--sheet-line);padding-bottom:.6cqw;margin-top:1cqw}
.grp b{color:var(--sheet-ink);font-weight:600;margin-right:1cqw}
.it.own{white-space:normal;font-size:3.1cqw;align-items:baseline}
.it.own .box{min-width:9cqw}
.it .n{font-size:2.1cqw;color:#6b748c;width:3.2cqw}
.box{display:inline-block;min-width:7cqw;height:5.2cqw;border:.3cqw solid #8a94ab;border-radius:.8cqw;vertical-align:middle;text-align:center;line-height:4.6cqw}
.circ{display:inline-block;width:5cqw;height:5cqw;border:.3cqw solid #8a94ab;border-radius:50%;text-align:center;line-height:4.4cqw}
.ans .box,.ans .circ{border-color:var(--sheet-pen);color:var(--sheet-pen);font-weight:600}
.col{display:inline-grid;grid-template-columns:auto auto;column-gap:1cqw;font-size:3.6cqw;line-height:1.25;justify-items:end}
.col .op{grid-row:1/3;align-self:center;justify-self:start}
.col .bar{grid-column:1/3;border-top:.3cqw solid var(--sheet-ink);width:100%;margin:.4cqw 0}
.col .r{grid-column:2;min-width:9cqw;height:5cqw;border:.3cqw dashed #b3bbcc;border-radius:.6cqw;color:var(--sheet-pen);font-weight:600;text-align:right;padding-right:.6cqw}
.sh-foot{margin-top:auto;display:flex;justify-content:space-between;font-size:2cqw;color:#6b748c;border-top:.2cqw solid var(--sheet-line);padding-top:1.4cqw}
.key-stamp{color:var(--sheet-pen);border:.35cqw solid var(--sheet-pen);border-radius:1cqw;padding:.3cqw 1.6cqw;font-weight:700;transform:rotate(-3deg);display:inline-block;font-size:2.6cqw}

/* Режим ученика по ссылке и код результата */
.student-mode .crumbs,.student-mode .steps{display:none}
.student-mode .logo{cursor:default}
.rbox{padding:16px;display:flex;flex-direction:column;gap:10px}
.rbox textarea,#rc{width:100%;font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--ink-soft);color:var(--ink);resize:vertical;word-break:break-all}
.side-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
a.btn{text-decoration:none}

/* Рисунки и выбор ответа */
.fig{display:block;width:100%;height:auto}
.fig .ln{stroke:#1a1f2e;stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.fig .thin{stroke:#1a1f2e;stroke-width:1;fill:none}
.fig .dt{fill:#1a1f2e}
.fig .fl{fill:#cfd8ea;stroke:#1a1f2e;stroke-width:2}
.fig .gl{stroke:#cfd7e6;stroke-width:.5}
.fig .cell{fill:#e3e9f4;stroke:#1a1f2e;stroke-width:.8}
.fig .axis{stroke:#d5402f;stroke-width:1.5;stroke-dasharray:4 3}
.fig .bar{fill:#c9d4ec;stroke:#1a1f2e;stroke-width:1}
.fig .tx{font-size:9px;font-family:var(--f-ui);fill:#1a1f2e}
.fig .tx.b{font-weight:700;font-size:11px}
.pair{display:flex;align-items:center;gap:8px}
.pair .fig{max-width:45%}
.it.pic{flex-direction:column;align-items:flex-start;white-space:normal;gap:1.2cqw;font-size:3cqw}
.it.pic .fig{max-width:22cqw}
.it.pic .fig.wide{max-width:42cqw}
.it.pic .pair{width:100%}
.it.pic .pair .fig{max-width:16cqw}
.chq{line-height:1.4}
.opts{display:flex;gap:1.6cqw;flex-wrap:wrap}
.opt{border:.3cqw solid #8a94ab;border-radius:4cqw;padding:.4cqw 2cqw;font-size:2.7cqw}
.ans .opt.on{border-color:var(--sheet-pen);color:var(--sheet-pen);font-weight:700}
.opts-pad{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.opts-pad button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:18px;font-weight:700;min-height:58px;padding:8px}
.opts-pad button:hover{border-color:var(--ink)}
.task .fig .ln,.task .fig .thin{stroke:var(--ink)}
.task .fig .dt,.task .fig .tx{fill:var(--ink)}
.task .fig .fl,.task .fig .cell,.task .fig .bar{fill:var(--ink-soft);stroke:var(--ink)}
.task .fig .gl{stroke:var(--line)}
.task .pair{justify-content:center}
.task .pair b{font-size:20px}

/* Каталог и поиск */
.search{padding:14px 18px 0}
.search input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
.search input:focus{border-color:var(--ink)}
.sres{padding:10px 12px 14px;display:flex;flex-direction:column;gap:4px}
.sr{text-align:left;border:0;background:none;border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:2px}
.sr:hover{background:var(--ink-soft)}
.sr-t{font-weight:600}
.sr small{color:var(--ink-2);font-size:12.5px}
.cg{border-top:1px solid var(--line)}
.cg>summary{cursor:pointer;padding:12px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.cg>summary .cnt{margin-left:auto;color:var(--ink-3);font-size:13px}
.cp{margin:0 10px 6px}
.cp>summary{cursor:pointer;padding:8px 10px;font-weight:600;color:var(--ink-2);font-size:14px;border-radius:8px}
.cp>summary:hover{background:var(--ink-soft)}
.topic .tt{display:flex;flex-direction:column;gap:2px}
.topic .subs{font-size:12px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.subchip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink-soft);border-radius:10px;padding:8px 12px;margin:8px 0 0}

/* Шапка ученика и работы */
.sthead{display:flex;align-items:center;gap:14px;background:var(--pen-soft);border:2px solid var(--pen);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.ava.big{width:52px;height:52px;font-size:19px;background:var(--pen);color:var(--card)}
.sth-t{display:flex;flex-direction:column;min-width:0;flex:1}
.sth-t h1{font-family:var(--f-disp);font-weight:600;font-size:clamp(20px,3vw,26px);letter-spacing:-.01em;overflow-wrap:anywhere}
.sth-t span{color:var(--pen);font-weight:600}
.more{position:relative}
.more-btn{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--pen);background:var(--card);font-size:22px;line-height:1;font-weight:700}
.more-pop{position:absolute;right:0;top:48px;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,30,60,.18);padding:6px;min-width:220px}
.more-pop button{width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;color:var(--bad);font-weight:600}
.more-pop button:hover{background:var(--bad-soft)}
.more-pop button.edit{color:var(--ink)}

.worksbtn{width:100%;display:flex;align-items:center;gap:12px;border:2px solid var(--blue);background:var(--blue-soft);border-radius:14px;padding:12px 16px;margin-bottom:12px;text-align:left;font-size:16px}

.wlist{display:flex;flex-direction:column;padding:6px}
.wk{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:10px;padding:12px;text-align:left}
.wk:hover{background:var(--ink-soft)}
.wk.static:hover{background:none}
.wk-t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.wk-t small{color:var(--ink-2);font-size:13px}
.wk-t details{font-size:13px;margin-top:4px}
.wk-t summary{cursor:pointer;color:var(--pen);font-weight:600}
.wwork{padding:6px}
.wrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:9px}
.wrow+.wrow{border-top:1px solid var(--line)}
.wrow.bad{background:var(--bad-soft)}
.wn{color:var(--ink-3);font-variant-numeric:tabular-nums}
.wq2{overflow-wrap:break-word}
.wa2{text-align:right;font-variant-numeric:tabular-nums}
.wrow.ok .wa2{color:var(--ok)}
.wrow.bad s{color:var(--bad)}
details.done{margin:2px 0 6px}
details.done>summary{cursor:pointer;color:var(--ink-3);font-size:13.5px;padding:6px 10px;border-radius:8px}
details.done>summary:hover{background:var(--ink-soft)}
details.done .topic{opacity:.7}

/* Клетки тетради */
.sh-items{--c:2.8cqw;display:grid;column-gap:calc(var(--c) * 2);row-gap:var(--c);padding:var(--c) !important;background-size:var(--c) var(--c) !important;background-position:0 0 !important;align-items:start}
.sh-items>*{margin:0 !important}
.sh-items>.span,.sh-items>.grp,.sh-items>.word{grid-column:1/-1}
.sheet .sh-items .it.ci{display:flex;gap:0;align-items:flex-start;white-space:nowrap;font-size:inherit;padding:0}
.c{width:var(--c);height:var(--c);display:inline-flex;align-items:center;justify-content:center;font-size:calc(var(--c) * .8);line-height:1;font-variant-numeric:tabular-nums;flex:none;position:relative}
.crow,.cl{display:flex}
.cb{width:calc(var(--c) * 2);height:var(--c);display:inline-flex;align-items:center;flex:none}
.cb i{font-style:normal;font-size:calc(var(--c) * .5);color:#6b748c;width:var(--c);text-align:center}
.lv1 .cb i,.lv2 .cb i{background:var(--p1);color:#fff;border-radius:50%;width:calc(var(--c) * .8);height:calc(var(--c) * .8);display:grid;place-items:center;margin-left:calc(var(--c) * .1);font-weight:700}
.lv3 .cb i{color:var(--p1);font-weight:700}
.cbox{display:inline-flex;box-shadow:inset 0 0 0 .3cqw #7d88a3;border-radius:.3cqw}
.lv1 .cbox,.lv2 .cbox{box-shadow:inset 0 0 0 .3cqw var(--p1)}
.c.circ{position:relative}
.c.circ::before{content:"";position:absolute;inset:8%;border:.3cqw solid #7d88a3;border-radius:50%}
.ans .c.a{color:var(--sheet-pen);font-weight:700}
.ccol{position:relative;display:flex;flex-direction:column}
.cl.bar{box-shadow:inset 0 .32cqw 0 0 #1a1f2e}
.csign{position:absolute;left:0;top:var(--c);transform:translate(-50%,-50%);font-size:calc(var(--c) * .8);line-height:1}
.sh-items .it.word,.sh-items .grp{align-self:stretch}

/* Текст по строкам клеток */
.sheet .sh-items .it.rich{display:flex;align-items:flex-start;gap:0;white-space:normal;padding:0;font-size:inherit}
.rb{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1}
.tl{margin:0;font-size:calc(var(--c) * .62);line-height:var(--c)}
.tw{display:inline-block;height:var(--c);line-height:var(--c);font-size:calc(var(--c) * .62);white-space:nowrap;padding:0 calc(var(--c) * .2);flex:none;text-align:center}
.c .pn{position:absolute;right:-.08em;bottom:.05em;font-style:normal;font-size:.8em;line-height:1}
.crow.cwrap{flex-wrap:wrap;row-gap:0}
.sol2{height:calc(var(--c) * 4);width:100%}
.aline{display:flex;align-items:flex-end;gap:calc(var(--c) * .3);width:100%;height:var(--c);font-size:calc(var(--c) * .62);line-height:var(--c)}
.aline i{flex:1;height:calc(var(--c) * .85);border-bottom:.3cqw solid #7d88a3;font-style:normal;font-weight:700;color:var(--sheet-pen);padding-left:calc(var(--c) * .3);line-height:calc(var(--c) * .85)}
.opts2{display:flex;flex-wrap:wrap;gap:0 var(--c)}
.ob{height:var(--c);line-height:var(--c);font-size:calc(var(--c) * .58);padding:0 calc(var(--c) * .35);box-shadow:inset 0 0 0 .25cqw #8a94ab;border-radius:calc(var(--c) * .5);white-space:nowrap}
.ans .ob.on{box-shadow:inset 0 0 0 .35cqw var(--sheet-pen);color:var(--sheet-pen);font-weight:700}
.rb > .fig,.rb > .gfig{width:auto;max-width:40cqw}
.rb > .gfig.on{max-width:none;overflow:visible}
.gfig.on .gf rect{fill:var(--p2,#9fb3d9);fill-opacity:.18}
.gfig.on .ge line{stroke-width:.9}
.rb > .fig.wide{max-width:60cqw}
.rb > .pair{display:flex;align-items:center;gap:var(--c)}
.rb > .pair .fig{height:100%;width:auto;max-width:none}
.sh-items>.grp{font-size:calc(var(--c) * .58);line-height:var(--c);border:0 !important;padding:0 !important;color:#4e5870}
.sh-items>.grp .gico{width:var(--c);height:var(--c);vertical-align:top;margin:0 calc(var(--c) * .2) 0 0}
.sheet .sh-head{display:grid;grid-template-columns:1fr auto;column-gap:calc(var(--c) * 2);row-gap:0;padding:var(--c) !important;background-size:var(--c) var(--c);--c:2.8cqw}
.sheet .sh-head .fld{height:var(--c);line-height:var(--c);font-size:calc(var(--c) * .55);padding:0;border:0;min-width:0}
.sheet .sh-mini{--c:2.8cqw;padding:0 var(--c) !important;height:calc(var(--c) * 2);line-height:calc(var(--c) * 2);background-size:var(--c) var(--c);font-size:calc(var(--c) * .55);border-bottom-width:.15cqw}

/* Клетка на весь лист */
.sheet{--grid:linear-gradient(#c9dcf0 1px,transparent 1px),linear-gradient(90deg,#c9dcf0 1px,transparent 1px)}
.sheet.bw{--grid:linear-gradient(#d4d4d4 1px,transparent 1px),linear-gradient(90deg,#d4d4d4 1px,transparent 1px)}
.sheet .sheet-in{--c:2.8cqw;gap:var(--c);background:transparent}
/* клетка только там, где ребёнок пишет: под заданиями, в шапке с полями и в месте для решения задачи */
.sheet .sh-items,.sheet .sh-head,.sheet .sh-mini,.sgrid,.wq2 .sol2,.wq2 .aline{background-color:#fff;background-image:var(--grid) !important;background-size:var(--c) var(--c) !important;background-position:0 0 !important}
.sheet .sh-items,.sheet .sh-head,.sheet .sh-mini{border:0 !important;border-radius:0 !important;box-shadow:0 0 0 1px #c9dcf0}
.sheet .sh-items{padding:0 !important}
.sheet .sh-head{padding:0 var(--c) !important}
/* русский: лист в линейку, слово с окошком для буквы, правило в рамке */
.sheet.ru{--grid:linear-gradient(#c9dcf0 1px,transparent 1px)}
.sheet.ru.bw{--grid:linear-gradient(#d4d4d4 1px,transparent 1px)}
.it.ins .rb{flex-direction:row;align-items:flex-end;gap:calc(var(--c) * .6);flex-wrap:wrap}
.iw{height:var(--c);line-height:var(--c);font-size:calc(var(--c) * .82);white-space:nowrap;padding-left:calc(var(--c) * .25)}
.ib{display:inline-block;min-width:calc(var(--c) * .78);height:calc(var(--c) * .86);vertical-align:-.16em;margin:0 .04em;border:.25cqw solid #7d88a3;border-radius:.4cqw;background:#fff;text-align:center;line-height:calc(var(--c) * .8);font-weight:700;color:var(--sheet-pen)}
.ib.w2{min-width:calc(var(--c) * 1.2)}
.ichk{display:inline-block;min-width:calc(var(--c) * 7);height:calc(var(--c) * .85);border-bottom:.25cqw solid #7d88a3;font-size:calc(var(--c) * .62);line-height:calc(var(--c) * .85);color:var(--sheet-pen);font-weight:600;padding:0 calc(var(--c) * .2)}
.sh-rule{display:flex;flex-wrap:wrap;gap:.4cqw 1.4cqw;align-items:baseline;border:.3cqw solid var(--p2,#9fb3d9);border-radius:1.2cqw;padding:1.4cqw 2cqw;background:#fff;font-size:2.3cqw;line-height:1.4;color:#2b3245}
.sh-rule b{font-size:1.9cqw;text-transform:uppercase;letter-spacing:.06em;color:var(--p1,#3b5bab)}
.sh-rule span{flex:1 1 60cqw}
.sh-rule i{flex-basis:100%;font-style:normal;color:#4e5870}
.sh-rule i::before{content:"Пример: ";font-weight:600}
.topic.soon{opacity:.55;cursor:default}
.it.srt .rb,.it.ln .rb,.it.mr .rb,.it.sn .rb{flex-direction:row;align-items:flex-end;gap:calc(var(--c) * .6);flex-wrap:wrap}
.iw.big{font-size:var(--c);letter-spacing:.06em;height:calc(var(--c) * 1.2);line-height:calc(var(--c) * 1.4)}
.ichk.wide{flex:1;min-width:calc(var(--c) * 14)}
.stab{margin-top:calc(var(--c) * .5)}
.stab-g{display:grid;width:100%;column-gap:var(--c)}
.stc{display:flex;flex-direction:column}
.stc b{height:var(--c);line-height:var(--c);font-size:calc(var(--c) * .62);text-align:center;border-bottom:.3cqw solid #7d88a3;color:var(--p1,#3b5bab)}
.stc i{height:var(--c);line-height:var(--c);font-style:normal;font-size:calc(var(--c) * .62);text-align:center;border-bottom:.15cqw solid #c9d3e3;color:var(--sheet-pen);font-weight:600}
.mw{height:calc(var(--c) * 1.3);line-height:calc(var(--c) * 1.5);font-size:calc(var(--c) * .9);padding-left:calc(var(--c) * .25);white-space:nowrap}
.mw>span{position:relative;display:inline-block;padding:0 .02em}
.ans .mп{border-top:.3cqw solid var(--sheet-pen);border-right:.3cqw solid var(--sheet-pen);line-height:1.1}
.ans .mк{border-top:.3cqw solid var(--sheet-pen);border-radius:50% 50% 0 0/.6em .6em 0 0;line-height:1.1}
.ans .mс{line-height:1.1;background:linear-gradient(to top right,transparent 46%,var(--sheet-pen) 47%,var(--sheet-pen) 55%,transparent 56%) left top/50% .35em no-repeat,linear-gradient(to top left,transparent 46%,var(--sheet-pen) 47%,var(--sheet-pen) 55%,transparent 56%) right top/50% .35em no-repeat}
.ans .mо{outline:.3cqw solid var(--sheet-pen);outline-offset:.1em;line-height:1.1;margin-left:.15em}
.ans .mо.m0{width:.55em;height:.9em;vertical-align:-.1em}
.mк,.mп,.mс,.mо{color:inherit}
.sn .iw{white-space:normal;height:auto;line-height:var(--c)}
.u1{border-bottom:.3cqw solid var(--sheet-pen)}
.u2{border-bottom:.9cqw double var(--sheet-pen)}
/* текст и картинки — на белом */
.sh-items>.heroG,.sh-items>.tailG,.sh-items>.scene2,.wq2{background:#fff}
.sh-items>.heroG,.sh-items>.tailG{width:100% !important}
.sh-items>.grp,.sgrid>.grp{background:#fff;line-height:calc(var(--c) * 2) !important;min-height:calc(var(--c) * 2);box-shadow:0 calc(var(--c) * -1) 0 #fff}
.wq2 .tl{padding-bottom:var(--c)}
.sh-items>.heroG,.sh-items>.tailG{grid-column:1/-1;display:flex;gap:calc(var(--c) * 2);align-items:stretch}
.hA{position:relative;flex:none}
.hA .art{position:absolute;inset:0;width:100% !important;height:100% !important;object-fit:contain;object-position:center}
.hR{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--c)}
.hT{display:flex;flex-direction:column;gap:var(--c)}
.hT .sh-title{line-height:1.1;font-size:3.4cqw}
.hT .bubble{font-size:2.3cqw;padding:1cqw 1.8cqw}
.tailG{justify-content:space-between}
.sh-items>.tailG.left{justify-content:flex-start}
.tailG.left .tB{justify-content:flex-start}
.tailG.left .tB img.art.pic{right:auto;left:0}
.tB{flex:none;align-self:stretch;min-height:calc(var(--c) * 7);display:flex;justify-content:flex-end;align-items:center;position:relative}
.tB img.art.pic{position:absolute;right:0;top:50%;transform:translateY(-50%);max-height:100%;max-width:100%;width:auto;height:auto}
.tB img.art.pic.say{position:absolute;left:0;top:0;transform:none;height:calc(var(--c) * 3);max-width:40%}
.sheet .sh-items,.sgrid{display:flex !important;flex-wrap:wrap;column-gap:calc(var(--c) * 2);row-gap:var(--c);align-items:flex-start;align-content:flex-start}
.sh-items>.span,.sh-items>.grp,.sh-items>.word,.sh-items>.scene2,.sgrid>.span,.sgrid>.grp,.sgrid>.word{flex:0 0 100%;width:100%}
.sh-items>.it,.sgrid>.it{flex:none}
.sgrid>*{margin:0 !important}
.sgrid>.span,.sgrid>.grp,.sgrid>.word{grid-column:1/-1}
.sgrid>.grp{font-size:calc(var(--c) * .58);line-height:var(--c);border:0 !important;padding:0 !important;color:#4e5870}
.sgrid>.grp .gico{width:var(--c);height:var(--c);vertical-align:top;margin:0 calc(var(--c) * .2) 0 0}
.sh-items>.scene2{height:calc(var(--c) * 10) !important}

/* Оформление листов */
.art{display:block}
.sheet{position:relative}
.deco{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sheet-in{position:relative;z-index:1}
.fr{position:absolute;inset:2.4cqw;border-radius:3cqw}
.lv1 .fr,.lv2 .fr{border:1.3cqw solid var(--p1)}
.fr-dashed .fr{border-style:dashed}
.fr-double .fr{border-style:double;border-width:1.8cqw}
.fr-dots .fr{border-style:dotted;border-color:var(--p2)}
.fr-stripes .fr{border-color:transparent;border-image:repeating-linear-gradient(45deg,var(--p1) 0 1.4cqw,var(--p2) 1.4cqw 2.8cqw) 1}
.lv2 .fr{border-width:.7cqw}
.lv2.fr-double .fr{border-width:1.1cqw}
.lv3 .fr{border:.3cqw solid var(--p1);border-image:none}
.lv1 .sheet-in,.lv2 .sheet-in{padding:9cqw}
.lv3 .sheet-in{padding:7cqw 8cqw}
.deco-stk{position:absolute;width:9cqw;height:9cqw}
.lv2 .deco-stk{width:7cqw;height:7cqw}
.hero{display:flex;gap:3cqw;align-items:center}
.hero-art .art{width:24cqw;height:24cqw}
.hero-r{display:flex;flex-direction:column;gap:2cqw;min-width:0}
.bubble{position:relative;background:var(--p3);border:.4cqw solid var(--p1);border-radius:3cqw;padding:1.6cqw 2.4cqw;font-size:2.6cqw;line-height:1.35}
.bubble::before{content:"";position:absolute;left:-2.6cqw;top:42%;border:1.3cqw solid transparent;border-right-color:var(--p1)}
.band{display:flex;align-items:center;justify-content:space-between;gap:3cqw;background:var(--p3);border-radius:3cqw;padding:2cqw 3cqw;border-left:1.4cqw solid var(--p1)}
.band .sh-sub{margin-top:1cqw}
.band-art .art{width:15cqw;height:15cqw}
img.art.pic{object-fit:contain;display:block}
.hero-art img.art.pic{width:36cqw;height:46cqw}
.band-art img.art.pic{height:34cqw;width:auto;max-width:46cqw;margin:-6cqw 0 -4cqw;object-fit:contain}
.band-art{flex:none;display:flex;justify-content:flex-end}
.sh-items>.scene2{grid-column:1/-1;display:flex;justify-content:flex-end;align-items:flex-start;gap:0;height:calc(var(--c) * 16)}
.scene2 img.art.pic{height:100%;width:auto}
.scene2 img.art.pic.say{height:calc(var(--c) * 4);width:auto;margin-top:calc(var(--c) * 1)}
.bw img.art.pic{filter:grayscale(1)}
.lv1 .sh-title,.lv2 .sh-title,.lv3 .sh-title{color:var(--p1)}
.lv3 .tico{width:5.4cqw;height:5.4cqw;display:inline-block;vertical-align:-1cqw;margin-right:1cqw}
.gico{width:4.6cqw;height:4.6cqw;display:inline-block;vertical-align:middle;margin-right:1cqw}
.lv1 .grp b,.lv2 .grp b,.lv3 .grp b{color:var(--p1)}
.lv1 .grp,.lv2 .grp{border-bottom-color:var(--p2)}
.lv1 .it .n,.lv2 .it .n{background:var(--p1);color:#fff;border-radius:50%;width:4.4cqw;height:4.4cqw;display:inline-grid;place-items:center;font-weight:700;font-size:2.1cqw;flex:none}
.lv3 .it .n{color:var(--p1);font-weight:700}
.lv1 .box,.lv2 .box{border-color:var(--p1)}
.lv1 .sh-items,.lv2 .sh-items,.lv3 .sh-items{font-size:3.1cqw}
/* школьная клетка: на заданиях и на строке с именем, классом, датой; шапка с рисунком без клетки */
.sh-items,.sh-head,.sh-mini{background-color:#fff;background-image:linear-gradient(#c9dcf0 .13cqw,transparent .13cqw),linear-gradient(90deg,#c9dcf0 .13cqw,transparent .13cqw);background-size:2.6cqw 2.6cqw;padding:1.6cqw;border-radius:1cqw;border:.15cqw solid #b7cde6}
.bw .sh-items,.bw .sh-head,.bw .sh-mini{background-image:linear-gradient(#d4d4d4 .13cqw,transparent .13cqw),linear-gradient(90deg,#d4d4d4 .13cqw,transparent .13cqw);border-color:#c4c4c4}
.sh-head .fld{border-bottom:0}
.box,.circ,.col .r{background:transparent}
.lv1 .sh-items .box,.lv2 .sh-items .box{min-width:6cqw;height:4.8cqw}
.lv1 .it,.lv2 .it{gap:1cqw}
.bw .art [fill]:not(.k):not([fill="none"]){fill:#fff}
.bw .art [stroke]:not([stroke="none"]){stroke:#2b2638}
.design .drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.design select{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.bwl{display:flex;gap:6px;align-items:center;font-size:14px}
.dseg button{padding:7px 11px;font-size:14px;min-width:0}
.dprev{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;text-align:left}

.dprev span{display:flex;flex-direction:column}

.seg.tpl{gap:4px}
.seg.tpl button{padding:7px 11px;font-size:14px;min-width:0}

.brow{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.brow-top,.brow-bot{display:flex;gap:6px;align-items:center;min-width:0}
.brow select{flex:1;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13.5px}
.brow .b-cnt{width:58px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.bnum{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.bi{border:1px solid var(--line);background:var(--card);border-radius:8px;width:32px;height:34px;flex:none}
.bi[disabled]{opacity:.35;cursor:default}

/* Маршрут списком */
.rlist{display:flex;flex-direction:column;gap:6px}
.rl{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px}
.rl:hover{border-color:var(--ink-2)}
.rl-mark{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--ink-soft);color:var(--ink-3)}
.rl-t{display:flex;flex-direction:column;font-weight:600;min-width:0;overflow-wrap:break-word;hyphens:auto}
.rl-t small{font-weight:400;font-size:12.5px;color:var(--ink-2)}
.rl-p{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.rl-p small{font-weight:500;font-size:11.5px;color:var(--ink-3)}
.rl.prev{opacity:.6}
.rl.prev:hover{opacity:1}
.rl.prev .rl-mark.ok{background:var(--ok);color:var(--card)}
.rl.prev .rl-mark.warn{background:var(--warn-soft);color:var(--warn)}
.rl.prev .rl-mark.bad{background:var(--bad-soft);color:var(--bad)}
.rl.cur{border:2px solid var(--pen);background:var(--pen-soft);padding:12px 14px}
.rl.cur .rl-mark{background:var(--pen);color:var(--card)}
.rl.cur .rl-t{font-size:16px}
.rl.cur .rl-t small{color:var(--pen);font-weight:600}
.rl.next{border-color:var(--blue-soft);background:var(--blue-soft)}
.rl.next .rl-mark{background:var(--card);border:2px solid var(--blue)}
.rl.next .rl-t small{color:var(--blue);font-weight:600}
.rl.next:hover{border-color:var(--blue)}
.rl-empty{padding:8px 12px;color:var(--ink-3);font-size:13.5px;border:1.5px dashed var(--line);border-radius:10px}
.legend-note{margin:0;padding:0 18px 16px}

/* Маршрут */
.route{padding:16px 18px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.route-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.route-head h2{font-size:16px;font-weight:600}
.route-row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px;position:relative}
.rt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.rt:hover{border-color:var(--ink-2)}
.rt.cur{border:2px solid var(--ink);background:var(--ink-soft)}
.rt.cur .rt-t{font-size:16px}
.rt.prev{opacity:.8}
.rt.empty{border-style:dashed;color:var(--ink-3)}
.rt .label{font-size:11px}
.rt-t{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.rt-m{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.route-act{display:flex;gap:8px;flex-wrap:wrap}
.btn[disabled]{opacity:.45;cursor:default}
.fullprog>summary{cursor:pointer;padding:14px 18px;font-weight:600;color:var(--ink-2)}
.fullprog>summary:hover{color:var(--ink)}
@media (max-width:700px){.route-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.rt.cur{grid-column:1/-1;order:-1}}

/* Конструктор */
.builder{padding:18px;display:flex;flex-direction:column;gap:16px}
.bgroup{display:flex;flex-direction:column;gap:16px}
.builder input[type=text],.builder textarea{padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:var(--card);color:var(--ink);width:100%}
.builder textarea{resize:vertical;min-height:150px;line-height:1.55}
.builder input[type=number]{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;width:96px}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.kinds button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.kinds button span{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kinds button.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink-soft)}
.checks.row{flex-direction:row;flex-wrap:wrap;gap:6px 16px}
.berr{color:var(--pen);font-size:14px;font-weight:500}
.berr:empty{display:none}
.pv-empty{border:1.5px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--ink-3)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px 0}
.tools label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2)}
.gradehead{padding:16px 18px 0;font-family:var(--f-disp);font-weight:600;font-size:15px}
.mine{font-size:11px;font-weight:700;color:var(--ink-2);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:8px}
.txt{display:flex;gap:8px}
.txt input{flex:1;min-width:0;font:inherit;font-size:22px;font-weight:600;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.task.long{font-size:clamp(20px,4.5vw,26px)}

/* Печать */
.print-pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:22px;margin-bottom:26px}
.pr-h{font-size:16px;font-weight:600;margin:0 0 12px}
.pg-measure,#printHost{position:absolute;left:-10000px;top:0;width:210mm;visibility:hidden}
.sheet.page{aspect-ratio:210/297;overflow:hidden}
.sheet.page .sheet-in{height:100%;min-height:0}
.sh-mini{display:flex;justify-content:space-between;gap:2cqw;font-size:2.3cqw;color:#4e5870;border-bottom:.25cqw solid var(--sheet-line);padding-bottom:1cqw}
.sh-mini b{color:var(--sheet-ink)}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pen);border-radius:10px;padding:12px 16px;color:var(--ink-2);font-size:14px;margin-bottom:18px}

/* Модалка */
.veil{position:fixed;inset:0;background:rgba(10,15,30,.45);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);border-radius:16px;width:min(480px,100%);padding:22px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.modal h2{font-family:var(--f-disp);font-weight:600;font-size:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:var(--card);color:var(--ink);max-width:100%}
.field input[type=text]{padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:var(--card);color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;font-weight:600;min-width:46px}
.seg button.on{border-color:var(--ink);background:var(--ink);color:var(--card)}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:9px;align-items:center}
.code{font-family:var(--f-disp);font-size:26px;letter-spacing:.06em;text-align:center;padding:14px;border:2px dashed var(--ink);border-radius:12px}
.linkbox{display:flex;gap:8px}
.linkbox input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px;background:var(--ink-soft);color:var(--ink)}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* Ученик решает */
.player{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pl-instr{margin:0;text-align:center;font-weight:600;color:var(--ink-2)}
.pl-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pl-who{font-size:14px;color:var(--ink-2)}
.score{display:flex;gap:14px;font-weight:700}
.score span{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.score small{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .25s}
.task{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:170px;display:grid;place-items:center;padding:20px;font-size:clamp(30px,7vw,44px);font-weight:700;font-variant-numeric:tabular-nums;text-align:center;position:relative}
.task .q{display:flex;align-items:center;justify-content:center;gap:.3em;flex-wrap:wrap}
.task.word,.task.grid{font-size:clamp(18px,4vw,22px);font-weight:500;padding-bottom:40px}
.task.word .q,.task.grid .q{flex-direction:column;gap:14px}
.task.word .wq{text-align:left;line-height:1.5;max-width:46ch}
.task .wa{display:flex;align-items:center;gap:.4em;font-weight:700;font-size:1.3em}
.task .gwrap{display:block;width:min(260px,70vw)}
.task .gfig{max-width:100%;width:100%}
.task .gfig .gl line{stroke:var(--line)}
.task .gfig .gf rect{fill:var(--ink-soft)}
.task .gfig .ge line{stroke:var(--ink)}
.task .slot{display:inline-block;min-width:1.6em;padding:0 .2em;border:3px dashed var(--ink-3);border-radius:10px;color:var(--ink)}
.task .slot.filled{border-style:solid;border-color:var(--ink)}
.task .col{font-size:inherit;column-gap:.25em}
.task .col .bar{border-top:3px solid var(--ink)}
.task .col .r{height:1.2em;min-width:2.5em;border:3px dashed var(--ink-3);border-radius:8px;color:var(--ink);font-weight:700;padding-right:.15em}
.fb{position:absolute;bottom:10px;left:0;right:0;font-size:15px;font-weight:700}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--pen)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:24px;font-weight:700;min-height:58px}
.pad button:hover{border-color:var(--ink)}
.pad .go{background:var(--ink);color:var(--card);border-color:var(--ink);font-size:18px}
.pad .del{color:var(--pen);font-size:17px}
.signs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.signs button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:34px;font-weight:700;min-height:72px}
.signs button:hover{border-color:var(--ink)}
.finish{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px 20px}
.big{font-family:var(--f-disp);font-size:52px;font-weight:700;line-height:1}
.sent{display:inline-flex;gap:8px;align-items:center;background:var(--ok-soft);color:var(--ok);font-weight:600;border-radius:99px;padding:6px 14px;font-size:14px}
.demo-bar{background:var(--pen-soft);color:var(--pen);font-size:13px;font-weight:600;text-align:center;padding:6px;border-radius:8px}
.foot{margin-top:40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--ink-3);font-size:13px}
.foot button{background:none;border:0;color:var(--ink-2);text-decoration:underline;padding:0}

@media (max-width:900px){.cols,.topic-grid{grid-template-columns:minmax(0,1fr)}.steps{display:none}}
@media (max-width:600px){.top-in{flex-wrap:wrap;gap:4px 12px;padding-block:10px}.crumbs{flex-basis:100%;font-size:13px;gap:2px}.crumbs button,.crumbs .cur{padding:2px 4px}
  .crumbs .cur{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.wrap{padding-block:20px 48px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Минимализм: один акцент, меньше рамок и подписей ---------- */
.btn.link{border:0;background:none;padding:6px 4px;min-height:0;color:var(--ink-2);font-weight:600}
.btn.link:hover{background:none;color:var(--ink);text-decoration:underline}
.sthead{background:none;border:0;padding:0;margin:0 0 18px;align-items:flex-start}
.sth-t{flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.sth-t span{color:var(--ink-2);font-weight:500}
.more-btn{border:1px solid var(--line);width:38px;height:38px;font-size:20px}
.wait-chip{border:0;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;white-space:nowrap}
button.wait-chip:hover{filter:brightness(.96)}
.panel{border-radius:12px}
.route{gap:10px;padding:16px 18px}
.route-head h2,.tools h2{font-size:13px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.tools{padding:16px 18px 4px}
.rlist{gap:0}
.rl{border:0;border-radius:8px;padding:9px 10px;background:none}
.rl:hover{background:var(--ink-soft)}
.rl.cur{border:0;background:var(--ink-soft);padding:12px 10px}
.rl.cur .rl-mark{background:var(--ink);color:var(--card)}
.rl.cur .rl-t small{color:var(--ink-2);font-weight:400}
.rl.next{background:none;border:0}
.rl.next .rl-mark{background:none;border:1.5px solid var(--line)}
.rl.next .rl-t{font-weight:500}
.rl.next .rl-t small{color:var(--ink-2);font-weight:400}
.rl.prev{opacity:.5}
.rl-empty{border:0;padding:6px 10px}
.legend{font-size:12.5px}
.st{gap:8px;padding:16px}
.st-top{justify-content:space-between;align-items:flex-start}
.st-now{border-top:0;padding-top:0;flex-direction:row;justify-content:space-between;gap:10px;color:var(--ink-2)}
.st-now .t{font-weight:500;color:var(--ink)}
.st-now .pct{font-weight:700}
.add-card{min-height:96px}
.head{margin-bottom:16px}
.head p{font-size:14px}
.levels{gap:16px}
.levels .label{font-size:12px}
.fold{border-top:1px solid var(--line);padding-top:10px}
.fold summary{cursor:pointer;color:var(--ink-2);font-weight:600;font-size:14px}
.fold[open]{display:flex;flex-direction:column;gap:10px}
.fold .tune-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fold .tune-row input{width:72px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.bsum{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.bsum li span{margin-left:6px}
.sheet-bar{margin-bottom:8px}

/* экран ученика: акцентная плашка, цвета тем, все темы под лупой */
.sthead{background:var(--ink);color:var(--card);border-radius:14px;padding:16px 18px;align-items:center}
.sthead .sth-t h1{color:var(--card)}
.sthead .sth-t span{color:var(--card);opacity:.75}
.sthead .more-btn{background:transparent;border-color:rgba(255,255,255,.35);color:var(--card)}
.wait-chip.red{background:var(--pen);color:#fff;opacity:1 !important}
.route-head h2{font-size:18px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0;font-family:var(--f-disp)}
.rl.prev{opacity:.75}
.rl.prev .rl-mark,.rl.prev .rl-mark.ok{background:#2C9B5A;color:#fff;border:0}
.rl.cur{background:var(--pen-soft)}
.rl.cur .rl-mark{background:var(--pen);color:#fff}
.rl.next .rl-mark{background:#8FCBF2;border:0}

.allt{border-top:1px solid var(--line);padding:14px 18px}
.allt-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.allt-t{border:0;background:none;padding:4px 0;font-family:var(--f-disp);font-weight:700;font-size:18px;color:var(--ink);display:flex;gap:8px;align-items:center}
.allt-t span{font-size:14px;color:var(--ink-2)}
.qbtn{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center}
.qbtn.on,.qbtn:hover{border-color:var(--ink)}
.allt .search{padding:12px 0 0}
.allt #pmain{margin:6px -18px -14px}

.sh-items>.pfill{flex:0 0 100%;display:flex;justify-content:flex-end;background:#fff}
.sh-items>.pfill.left{justify-content:flex-start}
.pfill img.art.pic{height:100%;width:auto;max-width:60%;object-fit:contain}

/* ---------- аккаунт в шапке ---------- */
.acct{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync{font-size:13px;color:var(--ink-3)}
.sync[data-s="err"]{color:var(--pen)}
.acct-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-btn:hover{border-color:var(--ink)}
.pop-mail{margin:4px 12px 6px;font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.demo-tag{font-size:13px;font-weight:700;color:var(--pen);background:var(--pen-soft);padding:3px 9px;border-radius:99px}

/* ---------- вход: лист в клетку на синем поле ---------- */
body.authbg{background:#1F2C55}
body.authbg .top{background:transparent;border-bottom:0}
body.authbg .logo{color:#fff}
body.authbg .logo i{border-color:#fff}
body.authbg .logo i b{border-color:#fff}
.auth{min-height:calc(100svh - 140px);display:grid;place-items:center;padding:12px 0 40px}

  padding:44px 36px 32px 60px;display:flex;flex-direction:column;gap:16px;color:#1A2242}

.auth-sub{margin:-6px 0 4px;color:var(--ink-2);font-size:15px}
.auth-card .field input{width:100%;padding:12px 14px;border:1.5px solid #C9D2E2;border-radius:0;font:inherit;font-size:16px;background:#fff;color:#1A2242}
.auth-card .field input:focus{border-color:#1A2242;outline:none}
.auth-card form{display:flex;flex-direction:column;gap:14px}
.btn.wide{width:100%;min-height:52px;font-size:17px}
.auth-err{margin:0;color:var(--pen);font-weight:600;font-size:14px;min-height:0}
.auth-err:empty{display:none}
.auth-sw{margin:0;font-size:15px;color:var(--ink-2)}
.auth-sw .btn.link{padding:0 2px;color:#1A2242;text-decoration:underline}
.demo-l{align-self:flex-start;padding:0!important;font-size:14px}
.oauth{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.oa{min-height:48px;border:1.5px solid #1A2242;background:#fff;color:#1A2242;font-size:15px}
.btn.oa:hover{background:#F3F6FB}
.btn.oa-vk{background:#0077FF;border-color:#0077FF;color:#fff}
.btn.oa-yandex{background:#FC3F1D;border-color:#FC3F1D;color:#fff}
.btn.oa-apple{background:#000;border-color:#000;color:#fff}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:#C9D2E2}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amsg{width:100%;font:inherit;font-size:15px;line-height:1.5;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);resize:vertical}
.empty-first{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:22px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty-first h2{font-family:var(--f-disp);font-size:20px}

/* ---------- кабинет ученика ---------- */
body.cabinet .top{display:none}
.cab{max-width:720px;margin:0 auto;padding-top:12px}
.cab-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.cab-head h1{font-family:var(--f-disp);font-size:clamp(28px,6vw,40px);letter-spacing:-.02em;line-height:1.05}
.cab-head p{margin:6px 0 0;color:var(--ink-2)}
.cab-h{font-family:var(--f-disp);font-size:19px;margin:28px 0 12px}
.ctasks{display:flex;flex-direction:column;gap:10px}
.ctask{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px 10px 10px;font:inherit;color:var(--ink);transition:transform .15s,border-color .15s}
.ctask:not(.done):hover{border-color:var(--ink);transform:translateY(-1px)}
.ctask.done{opacity:.75;cursor:default}
.ct-pic{width:84px;height:84px;flex:none;border-radius:12px;background:var(--blue-soft);display:grid;place-items:center;overflow:hidden}
.ct-pic img{max-width:90%;max-height:90%;object-fit:contain}
.ct-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ct-t b{font-size:16px}
.ct-t small{color:var(--ink-2);font-size:14px}
.ct-score{font-weight:800;font-size:18px;color:var(--ok)}
.ctask .btn{pointer-events:none}
@media (max-width:520px){.auth-card{padding:36px 20px 26px 40px}.auth-card::before{left:20px}.oauth{grid-template-columns:1fr}.two{grid-template-columns:1fr}}

/* ---------- меню разделов ---------- */
.sidenav{display:none}
body.shell .sidenav{display:flex;flex-direction:column;gap:18px;position:fixed;z-index:6;left:0;top:0;bottom:0;width:216px;background:var(--card);border-right:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top,0px)) 12px 16px max(12px,env(safe-area-inset-left,0px))}
body.shell{padding-left:216px}
body.shell .top .logo{display:none}
.side-logo{display:flex;align-items:center;gap:9px;font-family:var(--f-disp);font-weight:700;font-size:18px;background:none;border:0;padding:6px 10px;color:var(--ink)}

.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:10px;padding:10px 12px;font-weight:600;color:var(--ink-2);text-align:left;position:relative}
.nav button:hover{background:var(--ink-soft);color:var(--ink)}
.nav button.on{background:var(--ink);color:var(--card)}
.nav button[data-s="profile"]{margin-top:auto}
.nav em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;background:var(--pen);color:#fff;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
@media (max-width:760px){
  body.shell{padding-left:0;padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
  body.shell .top .logo{display:flex}
  body.shell .sidenav{top:auto;right:0;width:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
  .side-logo{display:none!important}
  .nav{flex-direction:row;gap:0}
  .nav button{flex:1;flex-direction:column;gap:2px;padding:6px 0;font-size:10px;letter-spacing:-.02em;font-weight:600;min-width:0;justify-content:center;text-align:center}
  .frow .chip{display:none}
  body.sec .crumbs{display:none}

  .nav button span{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
  .nav button.on{background:none;color:var(--pen)}
  .nav button[data-s="profile"]{margin-top:0}
  .nav em{position:absolute;top:2px;left:calc(50% + 6px);margin:0;min-width:16px;height:16px;font-size:10px;padding:0 4px}
}
@media print{.sidenav,.top,.toast{display:none!important}body.shell{padding:0}}

  padding:10px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(20,30,60,.25);transition:opacity .4s;max-width:calc(100% - 32px);text-align:center}

.lpaid{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  .wday h3{width:64px;padding:0}.les{flex-direction:row;gap:8px;align-items:baseline}.wadd{margin:0 0 0 auto;padding:4px 10px}}

.fpanel{padding:16px 18px;margin-bottom:16px}
.mbars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;height:180px;align-items:end}
.mbar{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:100%;gap:4px;text-align:center}

.mbar.on i{background:var(--ink)}
.bv{font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl{font-size:13px;color:var(--ink-2)}
.mbar.on .bl{color:var(--ink);font-weight:700}
.ftable{display:flex;flex-direction:column}
.frw{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.frw.fh{border-top:0;color:var(--ink-3);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-top:0}
.frw .btn.link{padding:0;color:var(--ink);font-weight:600;text-align:left}
.fact{display:flex;gap:6px;justify-content:flex-end}
.pay{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1.2fr) auto auto;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line)}
.pay:first-of-type{border-top:0}
.pay small{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay-a{font-weight:700;color:var(--ok)}
@media (max-width:760px){.kpis{grid-template-columns:minmax(0,1fr);gap:8px}.kpi{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px;padding:10px 14px}
  .kpi b{font-size:19px;grid-column:2;grid-row:1/3}.kpi small{grid-column:1}
  .mbars{gap:6px;height:150px}.bv{font-size:10px}
  .frw{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}.frw.fh{display:none}.frw>span:nth-child(2),.frw>span:nth-child(3){grid-column:1;font-size:13px;color:var(--ink-2)}
  .frw>span:nth-child(4){grid-row:1;grid-column:2}.fact{grid-column:1/-1;justify-content:flex-start}
  .pay{grid-template-columns:minmax(0,1fr) auto auto}.pay>span:first-child{grid-column:1/-1;font-size:13px;color:var(--ink-3)}.pay small{grid-column:1;grid-row:3}}

.fk-PDF{background:var(--pen-soft);color:var(--pen)}.fk-IMG{background:var(--ok-soft);color:var(--ok)}.fk-DOC{background:var(--blue-soft);color:var(--blue)}.fk-XLS{background:var(--ok-soft);color:var(--ok)}.fk-PPT{background:var(--warn-soft);color:var(--warn)}

<script src="https://cdn.jsdelivr.net/npm/pocketbase@0.28.1/dist/pocketbase.umd.js"></script>
<script>
/* ---------- генератор случайных чисел с seed ---------- */
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ri=(r,lo,hi)=>lo+Math.floor(r()*(hi-lo+1));
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const fmt=n=>typeof n==='number'?(Math.abs(n)>=10000?n.toLocaleString('ru-RU'):String(n)):n;
const TR={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
const translit=s=>s.toLowerCase().split('').map(c=>TR[c]??c).join('').replace(/[^a-z0-9]/g,'')||'uchenik';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- движок «Арифметика» ---------- */
const digitsOf=n=>String(n).split('').reverse().map(Number);
function carries(a,b){const x=digitsOf(a),y=digitsOf(b);let c=0,any=false;for(let i=0;i<Math.max(x.length,y.length);i++){const s=(x[i]||0)+(y[i]||0)+c;c=s>=10?1:0;if(c)any=true}return any}
function borrows(a,b){const x=digitsOf(a),y=digitsOf(b);for(let i=0;i<y.length;i++)if((x[i]||0)<y[i])return true;return false}
function onesCarry(a,b){return a%10+b%10>=10}
function onesBorrow(a,b){return a%10<b%10}

function pair(op,p,r,t){
  const hiEff=p.ramp===false?p.hi:Math.max(p.lo,Math.round(p.lo+(p.hi-p.lo)*(0.45+0.55*t)));
  const minOp=p.digits?10**(p.digits-1):1;
  const step=p.round?10:1;
  const carryFn=p.column?(op==='+'?carries:borrows):(op==='+'?onesCarry:onesBorrow);
  for(let k=0;k<400;k++){
    let a,b,res;
    if(op==='+'){
      res=ri(r,Math.ceil(Math.max(p.lo,2*minOp)/step),Math.floor(hiEff/step))*step;
      a=ri(r,Math.ceil(minOp/step),Math.floor((res-minOp)/step))*step;b=res-a;
      if(a<minOp||b<minOp)continue;
      if(p.lo>=11&&!p.digits&&res<11)continue;
    }else if(op==='-'){
      a=ri(r,Math.ceil(Math.max(p.lo,2*minOp)/step),Math.floor(hiEff/step))*step;
      b=ri(r,Math.ceil(minOp/step),Math.floor((a-(p.allowZero?0:minOp))/step))*step;res=a-b;
      if(b<minOp||res<0)continue;
    }else if(op==='×'){
      if(p.table){a=ri(r,p.table[0],p.table[1]);b=ri(r,2,9);if(r()<.5)[a,b]=[b,a]}
      else if(p.extra==='round'){a=ri(r,2,9)*10;b=ri(r,2,9);if(r()<.5)[a,b]=[b,a]}
      else if(p.extra==='2x1'){a=ri(r,12,49);b=ri(r,2,9);if(a%10===0||a*b>400)continue}
      else{a=ri(r,p.aLo,Math.max(p.aLo,Math.round(p.aLo+(p.aHi-p.aLo)*(0.4+0.6*t))));b=ri(r,2,9)}
      res=a*b;
    }else{
      if(p.table){b=ri(r,p.table[0],p.table[1]);const q=ri(r,2,9);a=b*q;res=q}
      else if(p.extra==='round'){b=ri(r,2,9);const q=ri(r,2,9)*10;a=b*q;res=q}
      else{b=ri(r,2,9);const q=ri(r,11,30);a=b*q;res=q;if(a>99&&!p.big)continue}
    }
    if((op==='+'||op==='-')&&p.carry){const c=carryFn(a,b);if(p.carry==='with'&&!c)continue;if(p.carry==='without'&&c)continue}
    return{a,b,op,res};
  }
  return{a:2,b:3,op:'+',res:5,fallback:true};
}

/* выражения для порядка действий: свой маленький разбор, деление только нацело */
function evalExpr(s){
  const tok=s.match(/\d+|[+\-×÷:()]/g);let i=0;
  function prim(){const x=tok[i++];if(x==='('){const v=sum();i++;return v}return Number(x)}
  function prod(){let v=prim();while(tok[i]==='×'||tok[i]==='÷'||tok[i]===':'){const o=tok[i++],w=prim();if(o==='×')v*=w;else{if(w===0||v%w)return NaN;v/=w}}return v}
  function sum(){let v=prod();while(tok[i]==='+'||tok[i]==='-'){const o=tok[i++],w=prod();v=o==='+'?v+w:v-w;if(v<0)return NaN}return v}
  const v=sum();return Number.isInteger(v)&&v>=0?v:NaN;
}
function orderItem(p,r){
  for(let k=0;k<500;k++){
    const pat=pick(r,p.patterns);
    const s=pat.replace(/[a-d]/g,()=>String(p.small?ri(r,2,9):ri(r,2,p.max||60)));
    const s2=s.replace(/(\d+)\s*÷\s*(\d+)/g,(m,x,y)=>`${Number(y)*ri(r,2,9)} ÷ ${y}`);
    const v=evalExpr(s2.replace(/\s/g,''));
    if(!isNaN(v)&&v<=(p.cap||100))return{type:'expr',q:s2.replace(/-/g,'−').replace(/÷/g,':'),ans:v};
  }
  return{type:'expr',q:'2 + 3 × 4',ans:14};
}

function generate(p,seed){
  const r=rng(seed);const items=[];const n=p.count;
  if(p.kind==='mix'){
    items.failed=0;
    p.parts.forEach((pt,k)=>{const sub=generate({...pt.p,count:pt.count||p.per},seed+k*7919);items.failed+=sub.failed||0;
      sub.forEach(x=>{x.src=pt.tid;x.blk=k;x.lbl=pt.label||'';items.push(x)})});
    return items;
  }
  if(p.kind==='word'||p.kind==='units'||p.kind==='grid'||p.kind==='forms'){
    const make=p.kind==='word'?wordItem:p.kind==='units'?unitItem:p.kind==='grid'?gridItem:formItem;const seen=new Set();items.failed=0;
    /* повторов не бывает: если разных вариантов меньше, чем мест на листе, лист становится короче */
    for(let guard=0;items.length<n&&guard<n*40;guard++){const it=make(p,r);const key=JSON.stringify(it);if(seen.has(key))continue;seen.add(key);
      if(it.fail)items.failed++;items.push(it)}
    return items;
  }
  if(p.kind==='ins')return insItems(p,r);
  if(p.kind==='sort')return sortItems(p,r);
  if(p.kind==='split')return splitItems(p,r);
  if(p.kind==='chs')return chItems(p,r);
  if(p.kind==='snt')return sntItems(p,r);
  if(p.kind==='mor')return morItems(p,r);
  if(p.kind==='own'){
    const arr=p.list.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
    return arr.slice(0,Math.min(n,arr.length)).map(x=>({type:'own',q:x.q,ans:x.ans}));
  }
  items.failed=0;
  /* одинаковые задания подряд и вразброс не нужны: повтор генерируется заново (до 40 попыток на лист) */
  const seenA=new Set();let tries=0,fresh=false;
  for(let i=0;i<=n;i++){
    if(fresh){fresh=false;const key=JSON.stringify(items[i-1]);if(seenA.has(key)&&tries++<40){items.pop();i-=2;continue}seenA.add(key)}
    if(i===n)break;
    fresh=true;
    const t=n>1?i/(n-1):1;
    if(p.kind==='order'){items.push(orderItem(p,r));continue}
    if(p.kind==='compare'){
      if(p.cmp==='num'){const x=ri(r,p.lo,p.hi);let y=r()<.2?x:x+ri(r,-3,3);y=Math.max(0,y);items.push({type:'cmp',left:String(x),right:String(y),ans:x>y?'>':x<y?'<':'='})}
      else{const e=pair(pick(r,p.ops),p,r,t);if(e.fallback)items.failed++;const right=Math.max(0,r()<.25?e.res:e.res+pick(r,[-2,-1,1,2]));
        items.push({type:'cmp',left:`${fmt(e.a)} ${sym(e.op)} ${fmt(e.b)}`,right:fmt(right),ans:e.res>right?'>':e.res<right?'<':'='})}
      continue}
    const e=pair(pick(r,p.ops),p,r,t);if(e.fallback)items.failed++;
    if(p.kind==='column'){items.push({type:'col',a:e.a,b:e.b,op:e.op,ans:e.res});continue}
    let miss='res';
    if(p.missing==='any')miss=pick(r,['a','b','res']);else if(p.missing)miss=p.missing;
    if(p.missing==='ab')miss=pick(r,['a','b']);
    const ans=miss==='a'?e.a:miss==='b'?e.b:e.res;
    items.push({type:'eq',a:e.a,b:e.b,op:e.op,res:e.res,miss,ans,x:!!p.xvar});
  }
  return items;
}
const sym=o=>o==='-'?'−':o==='÷'?':':o;

/* ---------- движок «Задачи»: проверенные шаблоны, в которые подставляются числа, имена и предметы ---------- */
const plural=(n,[one,few,many])=>{const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return many;if(b===1)return one;if(b>=2&&b<=4)return few;return many};

/* числа на 1 (21, 31…) требуют другого падежа в винительном: такие числа в условия не берём */
const ok1=n=>n%10!==1||n%100===11;
const cap=s=>s[0].toUpperCase()+s.slice(1);
const KIDS=[{n:'Маша',gen:'Маши',g:'f'},{n:'Петя',gen:'Пети',g:'m'},{n:'Оля',gen:'Оли',g:'f'},{n:'Саша',gen:'Саши',g:'m'},{n:'Катя',gen:'Кати',g:'f'},
  {n:'Миша',gen:'Миши',g:'m'},{n:'Лиза',gen:'Лизы',g:'f'},{n:'Дима',gen:'Димы',g:'m'},{n:'Аня',gen:'Ани',g:'f'},{n:'Ваня',gen:'Вани',g:'m'}];
const THINGS=[['яблоко','яблока','яблок'],['конфета','конфеты','конфет'],['марка','марки','марок'],['карандаш','карандаша','карандашей'],
  ['наклейка','наклейки','наклеек'],['ракушка','ракушки','ракушек'],['шишка','шишки','шишек'],['открытка','открытки','открыток'],['значок','значка','значков'],['орех','ореха','орехов']];
const GOODS=[{f:['тетрадь','тетради','тетрадей'],one:'одна'},{f:['ручка','ручки','ручек'],one:'одна'},{f:['блокнот','блокнота','блокнотов'],one:'один'},{f:['альбом','альбома','альбомов'],one:'один'}];
const RUB=['рубль','рубля','рублей'],RAZ=['раз','раза','раз'],BAGS=['пакет','пакета','пакетов'];
const VEH=[{n:'Велосипедист',v:[10,20]},{n:'Автобус',v:[40,70]},{n:'Поезд',v:[60,90]},{n:'Мотоциклист',v:[40,80]},{n:'Грузовик',v:[40,60]}];
const vb=(k,m,f)=>k.g==='f'?f:m;
const two=r=>{const a=pick(r,KIDS);let b=pick(r,KIDS);while(b===a)b=pick(r,KIDS);return[a,b]};
const tabN=(r,p)=>ri(r,(p.tab||[2,9])[0],(p.tab||[2,9])[1]);
const WT={
  sum(r,p){const k=pick(r,KIDS),o=pick(r,THINGS),a=ri(r,2,p.max-2),b=ri(r,2,p.max-a);if(!ok1(a)||!ok1(b))return;
    return{q:`У ${k.gen} было ${cnt(a,o)}. ${vb(k,'Он','Она')} ${vb(k,'получил','получила')} ещё ${cnt(b,o)}. Сколько ${o[2]} стало у ${k.gen}?`,ans:a+b}},
  rem(r,p){const k=pick(r,KIDS),o=pick(r,THINGS),a=ri(r,4,p.max),b=ri(r,2,a-2);if(!ok1(a)||!ok1(b))return;
    return{q:`У ${k.gen} было ${cnt(a,o)}. ${vb(k,'Он','Она')} ${vb(k,'отдал','отдала')} другу ${cnt(b,o)}. Сколько ${o[2]} осталось у ${k.gen}?`,ans:a-b}},
  more(r,p){const[k1,k2]=two(r),o=pick(r,THINGS),a=ri(r,2,p.max-2),b=ri(r,2,p.max-a);if(!ok1(a)||!ok1(b))return;
    return{q:`У ${k1.gen} ${cnt(a,o)}, а у ${k2.gen} на ${cnt(b,o)} больше. Сколько ${o[2]} у ${k2.gen}?`,ans:a+b}},
  less(r,p){const[k1,k2]=two(r),o=pick(r,THINGS),a=ri(r,4,p.max),b=ri(r,2,a-2);if(!ok1(a)||!ok1(b))return;
    return{q:`У ${k1.gen} ${cnt(a,o)}, а у ${k2.gen} на ${cnt(b,o)} меньше. Сколько ${o[2]} у ${k2.gen}?`,ans:a-b}},
  diff(r,p){const[k1,k2]=two(r),o=pick(r,THINGS),a=ri(r,4,p.max),b=ri(r,2,a-2);if(!ok1(a)||!ok1(b))return;
    return{q:`У ${k1.gen} ${cnt(a,o)}, а у ${k2.gen} ${cnt(b,o)}. На сколько ${o[2]} у ${k1.gen} больше, чем у ${k2.gen}?`,ans:a-b}},
  steps(r,p){const k=pick(r,KIDS),o=pick(r,THINGS),a=ri(r,3,p.max-3),b=ri(r,2,p.max-a),c=ri(r,2,a+b-1);if(!ok1(a)||!ok1(b)||!ok1(c))return;
    return{q:`В коробке было ${cnt(a,o)}. ${k.n} ${vb(k,'положил','положила')} туда ещё ${cnt(b,o)}, а потом ${vb(k,'взял','взяла')} ${cnt(c,o)}. Сколько ${o[2]} стало в коробке?`,ans:a+b-c}},
  together(r,p){const[k1,k2]=two(r),o=pick(r,THINGS),a=ri(r,2,Math.floor(p.max/2)-2),b=ri(r,2,p.max-2*a);if(!ok1(a)||!ok1(b)||2*a+b>p.max)return;
    return{q:`У ${k1.gen} ${cnt(a,o)}, а у ${k2.gen} на ${cnt(b,o)} больше. Сколько ${o[2]} у них вместе?`,ans:2*a+b}},
  groups(r,p){const o=pick(r,THINGS),a=tabN(r,p),b=ri(r,2,9);if(!ok1(b))return;
    return{q:`В ${a} коробках лежит по ${cnt(b,o)}. Сколько всего ${o[2]} в коробках?`,ans:a*b}},
  share(r,p){const o=pick(r,THINGS),k=tabN(r,p),q=ri(r,2,9),n=k*q;if(!ok1(n))return;
    return{q:`${cap(cnt(n,o))} разложили поровну в ${cnt(k,BAGS)}. Сколько ${o[2]} в каждом пакете?`,ans:q}},
  parts(r,p){const o=pick(r,THINGS),q=tabN(r,p),k=ri(r,2,9),n=k*q;if(!ok1(n)||!ok1(q))return;
    return{q:`${cap(cnt(n,o))} разложили по ${cnt(q,o)} в каждый пакет. Сколько понадобилось пакетов?`,ans:k}},
  times(r,p){const[k1,k2]=two(r),o=pick(r,THINGS),a=ri(r,2,9),m=tabN(r,p);if(!ok1(a))return;
    return{q:`У ${k1.gen} ${cnt(a,o)}, а у ${k2.gen} в ${cnt(m,RAZ)} больше. Сколько ${o[2]} у ${k2.gen}?`,ans:a*m}},
  fewer(r,p){const[k1,k2]=two(r),o=pick(r,THINGS),m=tabN(r,p),q=ri(r,2,9),a=m*q;if(!ok1(a))return;
    return{q:`У ${k1.gen} ${cnt(a,o)}, а у ${k2.gen} в ${cnt(m,RAZ)} меньше. Сколько ${o[2]} у ${k2.gen}?`,ans:q}},
  cost(r,p){const g=pick(r,GOODS),pr=ri(r,2,9)*5,n=ri(r,2,9);if(!ok1(pr))return;
    return{q:`${cap(g.f[0])} стоит ${cnt(pr,RUB)}. Сколько рублей стоят ${cnt(n,g.f)}?`,ans:pr*n}},
  price(r,p){const g=pick(r,GOODS),pr=ri(r,2,9)*5,n=ri(r,2,9),s=pr*n;if(!ok1(s)||!ok1(n))return;

    return{q:`${cap(g.f[0])} стоит ${cnt(pr,RUB)}. Сколько ${g.f[2]} можно купить на ${cnt(s,RUB)}?`,ans:n}},
  kgSum(r,p){const a=ri(r,2,p.max-2),b=ri(r,1,p.max-a);return{q:`Арбуз весит ${a} кг, а дыня — ${b} кг. Сколько килограммов весят арбуз и дыня вместе?`,ans:a+b}},
  kgDiff(r,p){const a=ri(r,3,p.max),b=ri(r,1,a-1);return{q:`Сумка с картошкой весит ${a} кг, а сумка с морковью — ${b} кг. На сколько килограммов сумка с картошкой тяжелее?`,ans:a-b}},

};

function solidSVG(kind){

  if(kind==='прямоугольный параллелепипед')return svgWrap(120,90,`<path d="M10 40 L80 40 L80 80 L10 80 Z M10 40 L32 18 L102 18 L80 40 M102 18 L102 58 L80 80" ${L()}/><path d="M10 80 L32 58 L102 58 M32 58 L32 18" ${L('thin')} stroke-dasharray="3 3"/>`,'Параллелепипед');
  if(kind==='пирамида')return svgWrap(110,90,`<path d="M10 75 L70 75 L95 58 M10 75 L55 8 L70 75 M55 8 L95 58" ${L()}/><path d="M10 75 L35 58 L95 58 M35 58 L55 8" ${L('thin')} stroke-dasharray="3 3"/>`,'Пирамида');
  if(kind==='цилиндр')return svgWrap(100,90,`<ellipse cx="50" cy="18" rx="32" ry="9" ${L()}/><path d="M18 18 L18 72 M82 18 L82 72 M18 72 A32 9 0 0 0 82 72" ${L()}/><path d="M18 72 A32 9 0 0 1 82 72" ${L('thin')} stroke-dasharray="3 3"/>`,'Цилиндр');
  if(kind==='конус')return svgWrap(100,90,`<path d="M50 8 L18 72 M50 8 L82 72 M18 72 A32 9 0 0 0 82 72" ${L()}/><path d="M18 72 A32 9 0 0 1 82 72" ${L('thin')} stroke-dasharray="3 3"/>`,'Конус');
  return svgWrap(100,90,`<circle cx="50" cy="45" r="34" ${L()}/><ellipse cx="50" cy="45" rx="34" ry="10" ${L('thin')}/>`,'Шар')}
const SOLIDS=['куб','прямоугольный параллелепипед','пирамида','цилиндр','конус','шар'];
const SOLID_N={'куб':[6,12,8],'прямоугольный параллелепипед':[6,12,8],'пирамида':[5,8,5]};

  bigPlaces:r=>{const d=[ri(r,1,9),ri(r,0,9),ri(r,1,9),ri(r,0,9),ri(r,1,9)],n=+d.join('');const parts=d.map((x,i)=>x*10**(4-i)).filter(x=>x);const k=ri(r,0,parts.length-1);

function resolveDesign(st,seed){
  const d=(st&&st.design)||{lv:2,theme:'random',bw:false};
  const r=rng(seed*7919+13);
  const lv=+d.lv||2;
  /* удалённая тема (например, «Супергерои») считается случайной */
  const theme=(d.theme&&THEMES.find(t=>t.id===d.theme))||THEMES[Math.floor(r()*THEMES.length)];
  const out={lv,bw:!!d.bw,theme,pal:PALETTES[Math.floor(r()*PALETTES.length)],frame:FRAMES[Math.floor(r()*FRAMES.length)],char:pick(r,theme.chars),seed};
  out.img=artSet(theme,seed);return out;
}

function bankOf(tag){return RB[tag].split('\n').map(line=>{const k=line.lastIndexOf(':'),hasChk=k>0&&!/\)/.test(line.slice(k));
  const w=hasChk?line.slice(0,k):line,chk=hasChk?line.slice(k+1):'';const m=w.match(/\(([^|]*)\|([^)]*)\)/);
  const nn=x=>x==='_'?'—':x;
  return{tag,w:w.slice(0,m.index)+'□'+w.slice(m.index+m[0].length),ans:nn(m[1]),bad:nn(m[2]),chk:stress(chk)}})}
const insWord=it=>it.w.replace('□',it.ans==='—'?'':it.ans);

  let pool=[];for(const g of p.groups)pool.push(...bankOf(g));
  if(p.check)pool=pool.filter(x=>x.chk);
  const seen=new Set();pool=shuffle(r,pool).filter(x=>{const k=insWord(x);if(seen.has(k))return false;seen.add(k);return true});

/* перенос по школьным правилам: по слогам (согласный с гласным за ним не разрывается), одну букву не оставляем и не переносим,
   ь, ъ, й остаются на строке, удвоенные согласные разделяются */
function hyphs(w){const out=[],n=w.length;
  for(let k=2;k<=n-2;k++){const L=w.slice(0,k),Rt=w.slice(k),a=w[k-1],b=w[k];
    if(![...L].some(isV)||![...Rt].some(isV))continue;
    if('ьъй'.includes(b))continue;
    if(isV(b)&&!isV(a)&&!'ьъй'.includes(a))continue;
    if(!isV(b)){let i=k,j=k;while(i>0&&!isV(w[i-1]))i--;while(j<n&&!isV(w[j]))j++;const cl=w.slice(i,j);
      const d=[...cl].findIndex((c,x)=>x>0&&c===cl[x-1]&&!'ьъй'.includes(c));if(d>0&&k!==i+d)continue;
      const y=[...cl].findIndex(c=>'ьъй'.includes(c));if(y>=0&&k!==i+y+1)continue}
    out.push(L+'-'+Rt)}
  return out}
