# 443: по имени сайта — API в Caddy, turn-… — ретранслятор звонков (TURN через TLS, для VPN и строгих сетей)
load_module /usr/lib/nginx/modules/ngx_stream_module.so;
user www-data;
worker_processes auto;
pid /run/kletka-sni.pid;
error_log /var/log/kletka-sni.log warn;
events { worker_connections 4096; }
stream {
	map $ssl_preread_server_name $kup {
		turn-153-76-170-187.sslip.io 127.0.0.1:5350;
		default 127.0.0.1:8443;
	}
	server {
		listen 443;
		listen [::]:443;
		ssl_preread on;
		proxy_protocol on;
		proxy_pass $kup;
		proxy_timeout 6h;
	}
	server {
		listen 127.0.0.1:5350 ssl proxy_protocol;
		set_real_ip_from 127.0.0.1;
		ssl_certificate /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn-153-76-170-187.sslip.io/turn-153-76-170-187.sslip.io.crt;
		ssl_certificate_key /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn-153-76-170-187.sslip.io/turn-153-76-170-187.sslip.io.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		proxy_pass 127.0.0.1:3478;
		proxy_timeout 6h;
	}
}
